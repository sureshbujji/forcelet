/* ---- Gantt drag and drop (click/modal flows stay as the keyboard path) ---- */
function dispDragStart(e,kind,id){
  e.dataTransfer.setData("text/plain",JSON.stringify({kind,id}));
  e.dataTransfer.effectAllowed="move";
}
function dispDragOver(e){
  e.preventDefault(); e.dataTransfer.dropEffect="move";
  const t=e.currentTarget;
  if(t&&t.classList&&(t.classList.contains("disp-lane")||t.classList.contains("unsch-grid"))) t.classList.add("dragover");
}
function dispDragLeave(e){ const t=e.currentTarget; if(t&&t.classList) t.classList.remove("dragover"); }
function dispDragPayload(e){
  try{ const d=JSON.parse(e.dataTransfer.getData("text/plain")||""); return d&&d.id?d:null; }catch(_){ return null; }
}
function dispLaneOf(apptId){
  if(!dispCache) return null;
  for(const l of dispCache.lanes||[]) for(const a of l.appointments||[]) if(a.Id===apptId) return (l.resource||{}).Id||null;
  return null;
}
async function dispDropLane(e,resId){
  e.preventDefault();
  const t=e.currentTarget; if(t&&t.classList) t.classList.remove("dragover");
  const d=dispDragPayload(e); if(!d) return;
  if(dispLaneOf(d.id)===resId) return; // already on this lane
  // mirror the modal's assign behavior: use the candidate's proposed start for this resource
  let start=null;
  try{
    const cr=await api("GET",`/api/field-service/candidates?appointment_id=${encodeURIComponent(d.id)}&date=${dispDate}`);
    const cands=(cr.ok&&(cr.data.candidates||[]))||[];
    const hit=cands.find(c=>(c.resource||{}).Id===resId);
    start=hit&&hit.start?hit.start:null;
  }catch(_){}
  dispAssign(d.id,resId,start);
}
async function dispDropTray(e){
  e.preventDefault();
  const t=e.currentTarget; if(t&&t.classList) t.classList.remove("dragover");
  const d=dispDragPayload(e); if(!d||d.kind!=="sched") return;
  if(!dispLaneOf(d.id)) return; // already unscheduled
  dispUnassign(d.id);
}

function sigInit(canvasId){
  const c=document.getElementById(canvasId);
  if(!c||c._sigInit) return; c._sigInit=true;
  const ctx=c.getContext("2d");
  ctx.lineWidth=2; ctx.lineCap="round"; ctx.strokeStyle="#111";
  let drawing=false, drawn=false;
  const pos=e=>{
    const r=c.getBoundingClientRect(), t=e.touches&&e.touches[0];
    const x=((t?t.clientX:e.clientX)-r.left)*(c.width/Math.max(1,r.width));
    const y=((t?t.clientY:e.clientY)-r.top)*(c.height/Math.max(1,r.height));
    return [x,y];
  };
  const start=e=>{ e.preventDefault(); drawing=true; drawn=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); };
  const move=e=>{ if(!drawing) return; e.preventDefault(); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  const end=()=>{ drawing=false; };
  c.addEventListener("mousedown",start); c.addEventListener("mousemove",move);
  c.addEventListener("mouseup",end); c.addEventListener("mouseleave",end);
  c.addEventListener("touchstart",start,{passive:false}); c.addEventListener("touchmove",move,{passive:false});
  c.addEventListener("touchend",end);
  c._sigDrawn=()=>drawn;
  c._sigClear=()=>{ ctx.clearRect(0,0,c.width,c.height); drawn=false; };
}

function dashChart(d,w){
  const gs=d.groups||[];
  if(w.type==="donut"&&gs.length) return svgDonut(gs,d.report_id,d.group_field);
  if(w.type==="line"&&gs.length) return svgLine(gs);
  if(w.type==="stat") return `<div class="stat"><div class="n">${d.row_count}</div><div class="l">records</div></div>`;
  if(w.type==="table"){
    const rows=(d.rows||[]).slice(0,10), cols=d.columns.length?d.columns:Object.keys(rows[0]||{}).slice(0,6);
    if(!rows.length) return `<p class="muted">No rows.</p>`;
    return `<div style="overflow-x:auto"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??"—")}</td>`).join("")}</tr>`).join("")}</table></div>`;
  }
  if(w.type==="gauge"){
    const aggVals=Object.values(d.grand_total?d.grand_total.aggregates:{}).filter(v=>typeof v==="number");
    const val=aggVals.length?aggVals[0]:d.row_count, mx=parseFloat(w.gauge_max)||val*1.25||100;
    return svgGauge(val,mx);
  }
  if(w.type==="funnel"&&gs.length) return svgFunnel(gs);
  if(w.type==="scatter") return svgScatter(d.rows||[],w.scatter_x||"",w.scatter_y||"");
  if(gs.length) return svgBars(gs,d.report_id,d.group_field);
  return `<div class="stat"><div class="n">${d.row_count}</div><div class="l">records</div></div>`;
}

function dashWfFromExpr(expr){
  // Best-effort: flat {op:[{field},value]} or {and:[...]} back into rows.
  const rows=[];
  const one=c=>{ const ks=Object.keys(c||{}); if(ks.length!==1) return; const op=ks[0], args=c[op];
    if(Array.isArray(args)&&args.length===2&&args[0]&&typeof args[0]==="object"&&args[0].field) rows.push({field:args[0].field,op,value:args[1]}); };
  if(expr&&typeof expr==="object"){ if(expr.and&&Array.isArray(expr.and)) expr.and.forEach(one); else one(expr); }
  return rows;
}

 {obj:"Task",start:"DueDate",color:"#2e9e4f",label_field:"Subject"},
 {obj:"ServiceAppointment",start:"ScheduledStart",color:"#d98a1f",label_field:"Subject"},
];
async function calSources(){
  const r=await api("GET","/api/calendar-sources");
  if(r.ok&&Array.isArray(r.data)&&r.data.length) return r.data;
  return CAL_SOURCES; // offline fallback keeps the classic three sources
}
function calShift(dir){ const [y,m]=calCursor.split("-").map(Number); const d=new Date(y,m-1+dir,1); calCursor=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; showCalendar(); }
/* ---- Omni-Channel agent console: presence, my work, queues, supervisor wall ---- */
const OMNI_STATUS_COLORS={Available:"#22c55e",Busy:"#f59e0b",Offline:"#9ca3af"};
let omniPresence=null, _omniPoll=null;
async function refreshPresence(){
  if(!token) return;
  try{
    const r=await api("GET","/api/omni/presence");
    if(r.ok&&r.data){
      omniPresence=r.data.status||"Offline";
      const dot=document.getElementById("presdot"), lbl=document.getElementById("preslabel");
      if(dot) dot.style.color=OMNI_STATUS_COLORS[omniPresence]||"#9ca3af";
      if(lbl) lbl.textContent=omniPresence;
    }
  }catch(e){}
}
async function setPresence(status){
  const r=await api("PUT","/api/omni/presence",{status});
  const dd=document.getElementById("presencedd"); if(dd) dd.classList.remove("open");
  if(r.ok) toast("Presence: "+status,"ok");
  else toast("Presence update failed: "+((r.data||{}).error||r.status),"error");
  await refreshPresence();
  const tab=document.querySelector('#tabs button[data-obj="__omni"]');
  if(tab&&tab.classList.contains("active")) showOmni();
}
async function omniWorkAction(wid,action){
  const r=await api("POST","/api/omni/work/"+encodeURIComponent(wid)+"/"+action);
  if(r.ok) toast(action==="decline"?"Work declined — returned to the queue.":action==="complete"?"Work completed.":"Work accepted.","ok");
  else toast("Failed: "+((r.data||{}).error||r.status),"error");
  showOmni();
}
async function omniRouteAll(){
  const r=await api("POST","/api/omni/work/route-all");
  if(r.ok) toast("Routed "+(r.data.routed||0)+", unrouted "+(r.data.unrouted||0)+".","ok");
  else toast("Route all failed: "+((r.data||{}).error||r.status),"error");
  showOmni();
}
function omniStatusPill(status){
  const c=OMNI_STATUS_COLORS[status]||"#9ca3af";
  return `<span class="stat-pill" style="background:${c}22;color:${c}">${esc(status||"—")}</span>`;
}
async function showOmni(){
  setActive("__omni");
  const main=document.getElementById("main"); main.innerHTML=skel(3);
  const [presR,capR,mineR,qR]=await Promise.all([
    api("GET","/api/omni/presence"),
    api("GET","/api/omni/capacity"),
    api("GET","/api/omni/work/mine"),
    api("GET","/api/queues"),
  ]);
  const pres=(presR.ok&&presR.data)||{status:"Offline"};
  const cap=(capR.ok&&capR.data)||{max_capacity:5,current_load:0};
  const mine=(mineR.ok&&mineR.data)||[];
  const queues=(qR.ok&&qR.data)||[];
  const isAdmin=me&&me.profile==="System Administrator";
  const myQueues=queues.filter(q=>((q.members)||[]).includes(me.id));
  const wallQueues=isAdmin?queues:myQueues;
  const snaps={};
  await Promise.all(wallQueues.map(async q=>{
    const r=await api("GET","/api/omni/queues/"+encodeURIComponent(q.id)+"/work");
    snaps[q.id]=(r.ok&&r.data)||{queued:[],assigned:[]};
  }));
  const agentNames={};
  await Promise.all(wallQueues.flatMap(q=>((snaps[q.id]||{}).assigned||[])).map(async w=>{
    if(w.assigned_to&&!(w.assigned_to in agentNames)) agentNames[w.assigned_to]=await userName(w.assigned_to);
  }));
  let html=`<div class="btnrow" style="align-items:center"><h2 style="margin:0">Omni-Channel</h2><span style="flex:1"></span>`
    +(isAdmin?`<button class="btn secondary small" onclick="omniRouteAll()">Route all queued work</button>`:"")
    +`</div>`;
  html+=`<div class="card"><div class="section-title">My presence</div><div class="btnrow" style="align-items:center;flex-wrap:wrap">`
    +omniStatusPill(pres.status)
    +["Available","Busy","Offline"].map(s=>`<button class="btn${s===pres.status?"":" secondary"} small" onclick="setPresence('${s}')">${s}</button>`).join("")
    +`<span class="muted">Capacity in use: ${cap.current_load||0} / ${cap.max_capacity}</span></div>`
    +(pres.updated_at?`<p class="muted" style="margin:8px 0 0">Last updated ${fmtDateTime(pres.updated_at)}</p>`:"")+`</div>`;
  html+=`<div class="card"><div class="section-title">My work <span class="muted">· ${mine.length} assigned</span></div>`;
  if(!mine.length) html+=`<p class="muted">No work assigned to you. Set your presence to Available to receive routed work.</p>`;
  else{
    html+=`<table><thead><tr><th>Object</th><th>Record</th><th>Channel</th><th>Priority</th><th>Assigned</th><th></th></tr></thead><tbody>`;
    for(const w of mine){
      html+=`<tr><td>${esc(w.object_name||"—")}</td>`
        +(w.record_id&&w.object_name?`<td><a href="#" onclick="jumpTo('${esc(w.object_name)}','${esc(w.record_id)}');return false">${esc(w.record_id)}</a></td>`:`<td>—</td>`)
        +`<td>${esc(w.channel_name||"—")}</td><td>${w.priority??0}</td><td>${fmtDateTime(w.assigned_at)}</td>`
        +`<td style="white-space:nowrap"><button class="btn secondary small" onclick="omniWorkAction('${w.id}','accept')">Accept</button> `
        +`<button class="btn secondary small" onclick="omniWorkAction('${w.id}','decline')">Decline</button> `
        +`<button class="btn small" onclick="omniWorkAction('${w.id}','complete')">Complete</button></td></tr>`;
    }
    html+=`</tbody></table>`;
  }
  html+=`</div>`;
  for(const q of wallQueues){
    const snap=snaps[q.id]||{queued:[],assigned:[]};
    html+=`<div class="card"><div class="section-title">${esc(q.name)} <span class="muted">· ${snap.queued.length} queued · ${snap.assigned.length} assigned</span></div>`;
    if(!snap.queued.length&&!snap.assigned.length){ html+=`<p class="muted">No work items in this queue.</p>`; }
    if(snap.queued.length){
      html+=`<div class="muted" style="margin:4px 0">Queued — waiting for an available agent</div><table><thead><tr><th>Object</th><th>Record</th><th>Channel</th><th>Priority</th><th>Created</th></tr></thead><tbody>`;
      for(const w of snap.queued){
        html+=`<tr><td>${esc(w.object_name||"—")}</td>`
          +(w.record_id&&w.object_name?`<td><a href="#" onclick="jumpTo('${esc(w.object_name)}','${esc(w.record_id)}');return false">${esc(w.record_id)}</a></td>`:`<td>—</td>`)
          +`<td>${esc(w.channel_name||"—")}</td><td>${w.priority??0}</td><td>${fmtDateTime(w.created_at)}</td></tr>`;
      }
      html+=`</tbody></table>`;
    }
    if(snap.assigned.length){
      html+=`<div class="muted" style="margin:8px 0 4px">Assigned</div><table><thead><tr><th>Object</th><th>Record</th><th>Agent</th><th>Priority</th><th>Assigned</th></tr></thead><tbody>`;
      for(const w of snap.assigned){
        html+=`<tr><td>${esc(w.object_name||"—")}</td>`
          +(w.record_id&&w.object_name?`<td><a href="#" onclick="jumpTo('${esc(w.object_name)}','${esc(w.record_id)}');return false">${esc(w.record_id)}</a></td>`:`<td>—</td>`)
          +`<td>${esc(agentNames[w.assigned_to]||w.assigned_to||"—")}</td><td>${w.priority??0}</td><td>${fmtDateTime(w.assigned_at)}</td></tr>`;
      }
      html+=`</tbody></table>`;
    }
    html+=`</div>`;
  }
  if(isAdmin){
    const pR=await api("GET","/api/omni/presence/all");
    const rows=(pR.ok&&pR.data)||[];
    const names={};
    await Promise.all(rows.map(async r=>{ names[r.user_id]=await userName(r.user_id); }));
    html+=`<div class="card"><div class="section-title">Supervisor wall — agent presence <span class="muted">· ${rows.length}</span></div>`;
    html+=`<table><thead><tr><th>Agent</th><th>Status</th><th>Updated</th></tr></thead><tbody>`;
    html+=rows.length?rows.map(r=>`<tr><td>${esc(names[r.user_id]||r.user_id)}</td><td>${omniStatusPill(r.status)}</td><td>${fmtDateTime(r.updated_at)}</td></tr>`).join("")
      :`<tr><td colspan="3" class="muted">No presence records yet — agents appear here once they set a status.</td></tr>`;
    html+=`</tbody></table></div>`;
  }
  main.innerHTML=html;
}
async function showCalendar(){
  setActive("__calendar");
  if(!calCursor){ const d=new Date(); calCursor=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
  document.getElementById("main").innerHTML=skel(3);
  const [y,m]=calCursor.split("-").map(Number);
  const dim=new Date(y,m,0).getDate(), from=`${calCursor}-01`, to=`${calCursor}-${String(dim).padStart(2,"0")}`;
  const items=[];
  const sources=await calSources();
  for(const s of sources){
    const r=await api("GET",`/api/sobjects/${s.obj}?sort=${s.start}&dir=asc`);
    if(!r.ok) continue;
    for(const rec of (r.data||[])){
      const day=(rec[s.start]||"").slice(0,10);
      if(day>=from&&day<=to) items.push({...rec,_src:s,_day:day});
    }
  }
  const monthName=new Date(y,m-1,1).toLocaleString("default",{month:"long",year:"numeric"});
  let html=`<div class="btnrow"><h2 style="margin:0">Calendar</h2><span class="muted">${items.length} item(s)</span><span style="flex:1"></span>`
    +`<button class="btn secondary small" onclick="calView='month';showCalendar()">Month</button>`
    +`<button class="btn secondary small" onclick="calView='agenda';showCalendar()">Agenda</button>`
    +`<button class="btn secondary small" onclick="calShift(-1)">‹</button><b>${monthName}</b><button class="btn secondary small" onclick="calShift(1)">›</button>`
    +`<button class="btn secondary small" onclick="calCursor=null;showCalendar()">Today</button></div>`;
  if(calView==="agenda"){
    items.sort((a,b)=>(a[a._src.start]||"").localeCompare(b[b._src.start]||""));
    html+=`<div class="card">`+(items.length?items.map(it=>
      `<div style="padding:8px 4px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center"><span class="muted" style="min-width:150px">${esc((it[it._src.start]||"").slice(0,16).replace("T"," "))}</span><span class="pill" style="background:${it._src.color}22;color:${it._src.color}">${esc(it._src.obj)}</span><a href="#" onclick="jumpTo('${it._src.obj}','${it.Id}');return false"><b>${esc(calLabel(it._src,it))}</b></a></div>`
    ).join(""):`<p class="muted">Nothing scheduled this month.</p>`)+`</div>`;
  }else{
    const lead=new Date(y,m-1,1).getDay();
    const cells=[];
    for(let i=0;i<lead;i++) cells.push(null);
    for(let d=1;d<=dim;d++) cells.push(`${calCursor}-${String(d).padStart(2,"0")}`);
    while(cells.length%7) cells.push(null);
    const today=new Date().toISOString().slice(0,10);
    html+=`<div class="cal-grid">`+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
    for(const day of cells){
      if(!day){ html+=`<div class="cal-cell cal-empty"></div>`; continue; }
      const its=items.filter(i=>i._day===day);
      html+=`<div class="cal-cell${day===today?" cal-today":""}" ondragover="event.preventDefault()" ondrop="calDrop(event,'${day}')">`
        +`<div class="cal-date">${parseInt(day.slice(8),10)}</div>`
        +its.slice(0,4).map(it=>`<div class="cal-chip" draggable="true" ondragstart="calDrag(event,'${it._src.obj}','${it.Id}','${it._src.start}','${esc((it[it._src.start]||"").slice(0,10))}')" title="${esc(calLabel(it._src,it))} — drag to reschedule" onclick="jumpTo('${it._src.obj}','${it.Id}')" style="border-left:3px solid ${it._src.color}">${esc(calLabel(it._src,it).slice(0,22))}</div>`).join("")
        +(its.length>4?`<div class="muted" style="font-size:11px">+${its.length-4} more</div>`:"")
        +`</div>`;
    }
    html+=`</div><p class="muted">Drag an item onto another day to reschedule it. Click an item to open the record.</p>`;
  }
  document.getElementById("main").innerHTML=html;
}
function calDrag(e,obj,id,field,oldDay){ e.dataTransfer.setData("text/plain",JSON.stringify({obj,id,field,oldDay})); }
function jumpTo(obj,id){ curObj=obj; showDetail(id); }
async function calDrop(e,day){
  e.preventDefault();
  let d; try{ d=JSON.parse(e.dataTransfer.getData("text/plain")); }catch(_){ return; }
  if(!d||d.oldDay===day) return;
  // fetch current value to preserve the time portion on datetime fields
  const r0=await api("GET",`/api/sobjects/${d.obj}/${d.id}`);
  const cur=r0.ok?String((r0.data||{})[d.field]||""):"";
  const val=cur.length>10?day+cur.slice(10):day;
  const r=await api("PATCH",`/api/sobjects/${d.obj}/${d.id}`,{[d.field]:val});
  if(r.ok){ toast("Rescheduled to "+day+".","ok"); showCalendar(); }
  else toast("Reschedule failed: "+((r.data||{}).error||r.status),"error");
}

/* ============ quote PDF ============ */
async function dlQuotePdf(id){
  const r=await fetch(`/api/quotes/${id}/pdf`,{headers:{"Authorization":"Bearer "+token}});
  if(!r.ok){ toast("PDF failed.","error"); return; }
  const blob=await r.blob(), a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`quote-${id}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ============ bulk data jobs ============ */
let bulkTimer=null;
async function showBulk(){
  setActive("__bulk");
  if(bulkTimer){ clearInterval(bulkTimer); bulkTimer=null; }
  document.getElementById("main").innerHTML=skel(3);
  const objs=(objects||[]).map(o=>`<option>${o.name}</option>`).join("");
  let html=`<div class="btnrow"><h2 style="margin:0">Bulk Data Jobs</h2><span class="muted">async insert / update / upsert</span></div>`;
  html+=`<div class="card"><div class="section-title">New bulk job</div><div id="bjerr"></div><div class="grid2"><div>`
    +`<label>Object</label><select id="bj_obj">${objs}</select><label>Operation</label><select id="bj_op"><option value="insert">Insert</option><option value="update">Update (needs Id per row)</option><option value="upsert">Upsert (needs external ID field)</option></select><label>External ID field (upsert only)</label><input id="bj_ext" placeholder="e.g. External_Id__c"></div><div>`
    +`<label>Rows — JSON array, or CSV with a header row</label><textarea id="bj_rows" rows="8" placeholder='[{"Subject":"Call back","Status":"Not Started"}]'></textarea></div></div>`
    +`<div class="btnrow" style="margin-top:8px"><button class="btn" onclick="bulkSubmit()">Run bulk job</button></div></div>`;
  html+=`<div class="card"><div class="section-title">Jobs</div><div id="bjobs"></div></div>`;
  document.getElementById("main").innerHTML=html;
  await bulkRefresh();
  bulkTimer=setInterval(async()=>{ if(!document.getElementById("bjobs")){ clearInterval(bulkTimer); bulkTimer=null; return; } await bulkRefresh(true); },4000);
}
function csvToRows(text){
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  const heads=lines[0].split(",").map(h=>h.trim());
  return lines.slice(1).map(l=>{ const cells=l.split(","); const o={}; heads.forEach((h,i)=>{ let c=(cells[i]||"").trim(); if(c!==""&&!isNaN(c)) c=Number(c); o[h]=c; }); return o; });
}
async function bulkSubmit(){
  let rows; const raw=document.getElementById("bj_rows").value.trim();
  if(!raw){ document.getElementById("bjerr").innerHTML=`<div class="err">Paste rows first.</div>`; return; }
  try{ rows=raw.startsWith("[")?JSON.parse(raw):csvToRows(raw); }
  catch(e){ document.getElementById("bjerr").innerHTML=`<div class="err">Could not parse rows: ${esc(e.message)}</div>`; return; }
  if(!Array.isArray(rows)||!rows.length){ document.getElementById("bjerr").innerHTML=`<div class="err">No rows found.</div>`; return; }
  const body={object:v("bj_obj"),operation:v("bj_op"),rows,external_id_field:v("bj_ext")||undefined};
  const r=await api("POST","/api/bulk-jobs",body);
  if(r.ok){ toast("Bulk job started.","ok"); bulkRefresh(); }
  else toast("Failed: "+((r.data||{}).error||r.status),"error");
}
async function bulkRefresh(quiet){
  const box=document.getElementById("bjobs"); if(!box) return;
  const r=await api("GET","/api/bulk-jobs");
  const jobs=Array.isArray(r.data)?r.data:[];
  box.innerHTML=jobs.length?`<table><tr><th>Name</th><th>Object</th><th>Op</th><th>Status</th><th>Processed</th><th>OK</th><th>Failed</th><th></th></tr>`
    +jobs.map(j=>`<tr><td><b>${esc(j.name)}</b><div class="muted">${esc(j.rows||"")}</div>${(j.errors||[]).length?`<div class="err" style="margin-top:4px">${esc(j.errors.slice(0,3).join(" · "))}${j.errors.length>3?" …":""}</div>`:""}</td><td>${esc(j.object)}</td><td>${esc(j.operation)}</td><td><span class="pill ${j.status==="completed"?"pill-on":"pill-off"}">${esc(j.status)}</span></td><td>${j.processed??0}</td><td>${j.succeeded??0}</td><td>${j.failed??0}</td><td><button class="btn secondary small" onclick="bulkRefresh()">Refresh</button></td></tr>`).join("")+`</table>`
    :`<p class="muted">No bulk jobs yet.</p>`;
}

/* ============ report subscriptions ============ */
let SUB_RCPTS=[];
function subModal(kind,id,name){
  SUB_RCPTS=[];
  openLightbox(`<div class="section-title">Subscribe — ${esc(name)}</div>
  <p class="muted">A ${kind} digest is emailed on schedule. Delivery is logged under Admin Setup → Email Log${window.FORCELET_SMTP?"":" (demo mode: logged, not sent)"}.</p>
  <div class="grid2"><div><label>Frequency</label><select id="sub_freq"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
  <div><label>Attachment</label><select id="sub_attach"><option value="none">None (summary in body)</option><option value="csv">CSV export</option><option value="xlsx">Excel export</option>${kind==="dashboard"?'<option value="html">HTML snapshot</option>':""}</select></div></div>
  <label>Only send when… (min rows, 0 = always)</label><input id="sub_minrows" type="number" min="0" value="0" style="max-width:140px">
  <label>Recipients</label><div id="sub_rcpts"></div>
  <div class="btnrow"><select id="sub_rtype" style="max-width:130px"><option value="email">Email</option><option value="user">User</option><option value="role">Role</option></select><input id="sub_rval" placeholder="address / pick below" style="flex:1"><button class="btn secondary small" onclick="subAddRcpt()">Add</button></div>
  <div class="btnrow" style="margin-top:4px"><button class="btn secondary small" onclick="subPickUser()">Pick user…</button><button class="btn secondary small" onclick="subPickRole()">Pick role…</button></div>
  <div class="btnrow" style="margin-top:10px"><button class="btn" onclick="subSave('${kind}','${id}')">Subscribe</button>
  <button class="btn secondary" onclick="closeLightbox()">Cancel</button></div><div id="suberr"></div>`);
  subRenderRcpts();
}
function subRenderRcpts(){
  const box=document.getElementById("sub_rcpts"); if(!box) return;
  box.innerHTML=SUB_RCPTS.map((r,i)=>`<span class="pill">${esc(r.type)}: ${esc(r.value)} <a href="#" onclick="SUB_RCPTS.splice(${i},1);subRenderRcpts();return false" title="remove">✕</a></span> `).join("")||'<p class="muted">No recipients yet.</p>';
}
function subAddRcpt(){
  const t=document.getElementById("sub_rtype").value, v=document.getElementById("sub_rval").value.trim();
  if(!v){ toast("Enter a value first.","error"); return; }
  SUB_RCPTS.push({type:t,value:v});
  document.getElementById("sub_rval").value="";
  subRenderRcpts();
}
async function subPickUser(){
  const r=await api("GET","/api/users/directory");
  if(!r.ok){ toast("Could not load users.","error"); return; }
  const v=prompt("Pick a user (username):\n"+(r.data||[]).slice(0,30).map(u=>u.username+" — "+u.name).join("\n"));
  if(v){ const u=(r.data||[]).find(x=>x.username===v.trim()||x.id===v.trim()); if(u){ SUB_RCPTS.push({type:"user",value:u.id}); subRenderRcpts(); } }
}
async function subPickRole(){
  const r=await api("GET","/api/roles/directory");
  if(!r.ok){ toast("Could not load roles.","error"); return; }
  const v=prompt("Pick a role (name):\n"+(r.data||[]).map(x=>x.name).join("\n"));
  if(v){ SUB_RCPTS.push({type:"role",value:v.trim()}); subRenderRcpts(); }
}
async function subSave(kind,id){
  const freq=document.getElementById("sub_freq").value;
  if(!SUB_RCPTS.length){ document.getElementById("suberr").innerHTML=`<div class="err">Add at least one recipient.</div>`; return; }
  const minRows=parseInt(document.getElementById("sub_minrows").value||"0",10)||0;
  const body={frequency:freq,attachment:document.getElementById("sub_attach").value,
    condition:minRows>0?{min_rows:minRows}:{},recipients:SUB_RCPTS};
  body[kind==="report"?"report_id":"dashboard_id"]=id;
  const r=await api("POST","/api/report-subscriptions",body);
  if(r.ok){ closeLightbox(); toast(`Subscribed — ${freq} digest enabled.`,"ok"); }
  else document.getElementById("suberr").innerHTML=`<div class="err">${esc((r.data||{}).error||r.status)}</div>`;
}

/* ============ flow version history ============ */
async function fbLoadVersions(){
  const sel=document.getElementById("fbvers"); if(!sel||!FB) return;
  const cfg=SETUP_KINDS[FB.kind];
  const r=await api("GET",`/api/admin/${cfg.apiKind||FB.kind}/${FB.id}/versions`);
  const vers=r.ok&&Array.isArray(r.data)?r.data:[];
  sel.innerHTML=`<option value="">Versions (${vers.length})…</option>`+vers.map(v=>`<option value="${v.id}">v${v.version} — ${esc((v.created_at||"").slice(0,16).replace("T"," "))}${v.note?" — "+esc(v.note.slice(0,30)):""}</option>`).join("");
  FB.versions=vers;
}
async function fbRollback(){
  const sel=document.getElementById("fbvers");
  const vid=sel&&sel.value;
  if(!vid){ toast("Pick a version from the history dropdown first.","info"); return; }
  if(!confirm("Rollback this flow to the selected version? The current state will be snapshotted first.")) return;
  const cfg=SETUP_KINDS[FB.kind];
  const r=await api("POST",`/api/admin/${cfg.apiKind||FB.kind}/${FB.id}/rollback`,{version_id:vid});
  if(r.ok){ toast("Rolled back.","ok"); openFlowBuilder(FB.kind,FB.id); }
  else toast("Rollback failed: "+((r.data||{}).error||r.status),"error");
}

/* ============ TOTP two-factor management ============ */
async function totpManage(){
  const s=await api("GET","/api/me/totp/status");
  if(s.ok&&s.data.enabled){
    openLightbox(`<div class="section-title">Two-factor authentication</div><p>Two-factor is <b>enabled</b> for your account.</p>
    <label>Confirm password to disable</label><input id="totp_pw" type="password">
    <div class="btnrow" style="margin-top:10px"><button class="btn danger" onclick="totpDisable()">Disable 2FA</button>
    <button class="btn secondary" onclick="closeLightbox()">Cancel</button></div><div id="totperr2"></div>`);
  }else{
    const r=await api("POST","/api/me/totp/setup");
    if(!r.ok){ toast("Setup failed.","error"); return; }
    openLightbox(`<div class="section-title">Set up two-factor authentication</div>
    <p class="muted">1. Open your authenticator app (Google Authenticator, 1Password, …) and add this secret, or open the link below on your phone.</p>
    <label>Secret (keep private)</label><input readonly value="${esc(r.data.secret)}" onclick="this.select()">
    <p><a href="${esc(r.data.otpauth_url)}">otpauth link — open on your phone</a></p>
    <p class="muted">2. Enter the 6-digit code to finish.</p>
    <input id="totp_en_code" inputmode="numeric" maxlength="6" placeholder="000000" style="max-width:160px">
    <div class="btnrow" style="margin-top:10px"><button class="btn" onclick="totpEnable()">Enable 2FA</button>
    <button class="btn secondary" onclick="closeLightbox()">Cancel</button></div><div id="totperr2"></div>`);
  }
}
async function totpEnable(){
  const r=await api("POST","/api/me/totp/enable",{code:document.getElementById("totp_en_code").value.trim()});
  if(r.ok){ closeLightbox(); toast("Two-factor enabled.","ok"); }
  else document.getElementById("totperr2").innerHTML=`<div class="err">${esc((r.data||{}).error||r.status)}</div>`;
}
async function totpDisable(){
  const r=await api("POST","/api/me/totp/disable",{password:document.getElementById("totp_pw").value});
  if(r.ok){ closeLightbox(); toast("Two-factor disabled.","ok"); }
  else document.getElementById("totperr2").innerHTML=`<div class="err">${esc((r.data||{}).error||r.status)}</div>`;
}

boot();
</script>
