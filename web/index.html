function cbInit(bid,objSelId,targetId){
  const host=document.getElementById(bid); if(!host) return;
  CB_STATE[bid]={objSel:objSelId,target:targetId,fields:[]};
  host.innerHTML=`<div class="cb"><div class="cb-cap">Condition builder — no JSON needed</div><div class="cb-rows"></div>
   <div class="btnrow"><button class="btn secondary small" onclick="cbAddRow('${bid}')">+ Condition</button>
   <select id="${bid}_logic" style="max-width:150px"><option value="and">Match all</option><option value="or">Match any</option></select>
   <button class="btn secondary small" onclick="cbInsert('${bid}')">Insert into field ↓</button></div></div>`;
  cbLoadFields(bid);
  const os=document.getElementById(objSelId); if(os) os.onchange=()=>cbLoadFields(bid);
  cbAddRow(bid);
}
async function cbLoadFields(bid){
  const st=CB_STATE[bid]; if(!st) return;
  const obj=document.getElementById(st.objSel); if(!obj) return;
  const r=await api("GET","/api/describe/"+encodeURIComponent(obj.value));
  st.fields=((r.data||{}).fields||[]).filter(f=>!f.computed);
  host2Rows(bid);
}
function host2Rows(bid){
  document.querySelectorAll(`#${bid} .cb-field`).forEach(sel=>{
    const st=CB_STATE[bid], cur=sel.value;
    sel.innerHTML=(st.fields||[]).map(f=>`<option value="${esc(f.name)}">${esc(f.label||f.name)}</option>`).join("");
    if(cur&&[...sel.options].some(o=>o.value===cur)) sel.value=cur;
  });
}
function cbAddRow(bid){
  const st=CB_STATE[bid]; if(!st) return;
  const box=document.querySelector(`#${bid} .cb-rows`); if(!box) return;
  const div=document.createElement("div"); div.className="cb-row";
  div.innerHTML=`<select class="cb-field">${(st.fields||[]).map(f=>`<option value="${esc(f.name)}">${esc(f.label||f.name)}</option>`).join("")}</select>
   <select class="cb-op">${CB_OPS.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("")}</select>
   <input class="cb-val" placeholder="value"><button class="btn danger small cb-x" onclick="this.parentElement.remove()">✕</button>`;

}
function cbVal(s){ s=(s||"").trim(); if(s==="") return ""; if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s); if(s==="true") return true; if(s==="false") return false; return s; }
function cbInsert(bid){
  const st=CB_STATE[bid]; if(!st) return;
  const logic=document.getElementById(bid+"_logic").value;
  const conds=[];
  document.querySelectorAll(`#${bid} .cb-row`).forEach(row=>{
    const f=row.querySelector(".cb-field").value, op=row.querySelector(".cb-op").value, raw=row.querySelector(".cb-val").value;
    if(!f) return;
    if(op==="isblank") conds.push({isblank:{field:f}});
    else if(op==="notblank") conds.push({not:{isblank:{field:f}}});
    else conds.push({[op]:[{field:f},cbVal(raw)]});
  });
  if(!conds.length){ toast("Add at least one condition first.","error"); return; }
  const expr=conds.length===1?conds[0]:{[logic]:conds};
  document.getElementById(st.target).value=JSON.stringify(expr);
  toast("Condition inserted — review, then save.","ok");
}

async function validateCronInput(inputId,descId){
  const el=document.getElementById(descId); if(!el) return;
  const v=(document.getElementById(inputId).value||"").trim();
  if(!v){ el.textContent=""; return; }
  clearTimeout(_cronTimer);
  _cronTimer=setTimeout(async()=>{
    const r=await api("POST","/api/admin/scheduled-jobs/validate-cron",{cron:v});
    el.textContent=r.data&&r.data.ok?("✓ "+r.data.description):("✗ "+((r.data&&r.data.error)||"invalid"));
    el.style.color=r.data&&r.data.ok?"var(--ok)":"var(--danger)";
  },350);
}
async function viewJobRuns(id){
  const box=document.getElementById("sj_runs"); if(!box) return;
  const job=(SETUP_CACHE["scheduled-jobs"]||[]).find(j=>j.id===id);
  const r=await api("GET",`/api/admin/scheduled-jobs/${id}/runs?limit=20`);
  const rows=r.data||[];
  box.innerHTML=`<div class="card" style="margin-top:10px"><div class="section-title">Run history — ${esc((job&&job.name)||id)}</div>`+

/* ============ field history tracking ============ */
let HT_ROWS=[];
async function loadHistoryTracking(){
  const host=document.getElementById("ht_list"); if(!host) return;
  const r=await api("GET","/api/admin/history-tracking");
  const rows=r.data||[]; HT_ROWS=rows;
  host.innerHTML=`<table style="margin-top:10px"><tr><th>Object</th><th>Track</th><th>Fields (comma-separated, blank = all)</th><th>Retention (days)</th><th>History rows</th></tr>`+
   rows.map((o,i)=>`<tr><td>${esc(o.label)}<br><span class="muted" style="font-size:11px">${esc(o.object_name)}</span></td><td><input type="checkbox" id="ht_en_${i}" ${o.enabled?"checked":""} style="width:auto"></td><td><input id="ht_f_${i}" value="${esc((o.fields||[]).join(", "))}" placeholder="all fields" style="min-width:220px"></td><td><input id="ht_r_${i}" type="number" min="1" value="${o.retention_days}" style="width:80px"></td><td>${o.history_rows}</td></tr>`).join("")+`</table>`;
}
async function saveHistoryTracking(){
  for(let i=0;i<HT_ROWS.length;i++){
    const o=HT_ROWS[i];
    const body={enabled:document.getElementById("ht_en_"+i).checked,
      fields:document.getElementById("ht_f_"+i).value.split(",").map(s=>s.trim()).filter(Boolean),
      retention_days:parseInt(document.getElementById("ht_r_"+i).value||"180",10)};
    const r=await api("PUT","/api/admin/history-tracking/"+encodeURIComponent(o.object_name),body);
    if(!r.ok){ toast("Failed on "+o.object_name+": "+((r.data&&r.data.error)||r.status),"error"); return; }
  }
  toast("History tracking settings saved.","ok"); loadHistoryTracking();
}
async function purgeHistory(){
  if(!confirm("Delete history entries older than each object's retention window?")) return;
  const r=await api("POST","/api/admin/history-tracking/purge");
  const p=(r.data&&r.data.purged)||{};
  const n=Object.values(p).reduce((a,b)=>a+b,0);
  toast(n?("Purged "+n+" old history row(s)."):"Nothing old enough to purge.","ok");
  loadHistoryTracking();
}

function renderAppTabRows(){
  const e=APPMGR.editing.app, host=document.getElementById("ae_tabs");
  if(!e.tabs.length){ host.innerHTML='<p class="muted">No tabs yet — add one above.</p>'; return; }
  host.innerHTML=e.tabs.map((t,i)=>{
    const isObj=t.kind==="object";
    const lbl=isObj?((objects.find(o=>o.name===t.ref)||{}).plural||t.ref):(APP_UTILS[t.ref]?APP_UTILS[t.ref][2]:t.ref);
    const relOpts=objects.map(o=>`<option value="${o.name}" ${(t.related_lists||[]).includes(o.name)?"selected":""}>${esc(o.plural)}</option>`).join("");
    const profOpts=`<option value="">— profile default layout —</option>`+APPMGR.profiles.map(p=>`<option ${t.layout&&t.layout.profile===p?"selected":""}>${esc(p)}</option>`).join("");
    return `<div class="card" style="margin:6px 0;padding:10px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <b>${i+1}. ${esc(t.label||lbl)}</b><span class="muted">${t.kind}: ${esc(t.ref)}</span><span style="margin-left:auto"></span>
     <button class="btn secondary small" onclick="appTabMove(${i},-1)" ${i===0?"disabled":""}>↑</button>
     <button class="btn secondary small" onclick="appTabMove(${i},1)" ${i===e.tabs.length-1?"disabled":""}>↓</button>
     <button class="btn secondary small" onclick="appTabDel(${i})">✕</button></div>
     <div class="grid2" style="margin-top:8px"><div>
       <label>Tab label override</label><input data-tab="${i}" data-k="label" value="${esc(t.label||"")}" placeholder="${esc(lbl)}">
       ${isObj?`<label>Page layout override (use another profile's layout)</label><select data-tab="${i}" data-k="layout_profile">${profOpts}</select>`:'<p class="muted">Layout &amp; related lists apply to object tabs.</p>'}
     </div><div>${isObj?`<label>Related lists <span class="muted">— none selected = all</span></label><select multiple data-tab="${i}" data-k="related_lists" style="height:96px">${relOpts}</select>`:""}</div></div></div>`;
  }).join("");
}
function appAddTab(){
  const v=document.getElementById("ae_addref").value, [kind,ref]=v.split(":");
  collectAppTabEdits();
  APPMGR.editing.app.tabs.push({kind,ref,label:null,layout:null,related_lists:null});
  renderAppTabRows();
}
function appTabMove(i,d){ collectAppTabEdits(); const t=APPMGR.editing.app.tabs, j=i+d; if(j<0||j>=t.length) return; [t[i],t[j]]=[t[j],t[i]]; renderAppTabRows(); }
function appTabDel(i){ collectAppTabEdits(); APPMGR.editing.app.tabs.splice(i,1); renderAppTabRows(); }
function collectAppTabEdits(){
  const ed=APPMGR.editing; if(!ed) return; const e=ed.app;
  document.querySelectorAll("#ae_tabs [data-tab]").forEach(el=>{
    const i=+el.dataset.tab, k=el.dataset.k, t=e.tabs[i]; if(!t) return;
    if(k==="label") t.label=el.value.trim()||null;
    if(k==="layout_profile") t.layout=el.value?{profile:el.value,record_type:"Default"}:null;
    if(k==="related_lists"){ const s=[...el.selectedOptions].map(o=>o.value); t.related_lists=s.length?s:null; }
  });
  e.profile_access={};
  document.querySelectorAll("#ae_profiles [data-prof]").forEach(el=>{
    const p=el.dataset.prof; e.profile_access[p]=e.profile_access[p]||{visible:false,default:false};
    if(el.dataset.k==="visible") e.profile_access[p].visible=el.checked;
    else e.profile_access[p].default=el.checked;
  });
  for(const p of Object.keys(e.profile_access))
    if(!e.profile_access[p].visible&&!e.profile_access[p].default) delete e.profile_access[p];
}
async function saveApp(){
  collectAppTabEdits();
  const e=APPMGR.editing.app, err=document.getElementById("ae_err");
  const body={name:document.getElementById("ae_name").value.trim(), label:document.getElementById("ae_label").value.trim(),
    description:document.getElementById("ae_desc").value.trim(),
    color:document.getElementById("ae_color").value, sort_order:+document.getElementById("ae_sort").value||0,
    active:document.getElementById("ae_active").checked, tabs:e.tabs, profile_access:e.profile_access};
  const id=APPMGR.editing.id;
  const r=id?await api("PUT",`/api/admin/apps/${id}`,body):await api("POST","/api/admin/apps",body);
  if(!r.ok){ err.innerHTML=`<div class="err">${esc(r.data.error||("HTTP "+r.status))}</div>`; return; }
  toast("App saved.","ok"); await refreshAppMgr(); await refreshUserApps();
}

async function createBulkJob(){
  const body={object:document.getElementById("bulk_obj").value, operation:document.getElementById("bulk_op").value,
    externalIdFieldName:document.getElementById("bulk_ext").value.trim()||undefined};
  const r=await api("POST","/api/bulk/jobs",body);
  if(!r.ok){ document.getElementById("bulkerr").innerHTML=`<div class="err">${esc(r.data.error||"Failed")}</div>`; return; }
  const csv=document.getElementById("bulk_csv").value;
  if(csv.trim()){
    const up=await fetch(`/api/bulk/jobs/${r.data.id}`,{method:"PUT",headers:{...H(),"Content-Type":"text/csv"},body:csv});
    if(!up.ok){ document.getElementById("bulkerr").innerHTML=`<div class="err">Upload failed.</div>`; }
  }
  document.getElementById("bulk_csv").value="";
  await listBulkJobs();
}
async function listBulkJobs(){
  const r=await api("GET","/api/bulk/jobs");
  const host=document.getElementById("bulk_list"); if(!host) return;
  host.innerHTML=(r.data||[]).map(j=>`<div class="rowline"><b>${esc(j.object)}</b><span class="muted">${esc(j.operation)} · ${esc(j.state)} · ${j.state==="Open"?(j.row_count||0)+" uploaded":(j.processed||0)+" processed"} (${j.succeeded||0} ok, ${j.failed||0} failed)</span><span style="margin-left:auto"></span>
    ${j.state==="Open"?`<button class="btn secondary small" onclick="closeBulkJob('${j.id}')">Close &amp; run</button>`:""}
    ${["Open","UploadComplete","InProgress"].includes(j.state)?`<button class="btn secondary small" onclick="abortBulkJob('${j.id}')">Abort</button>`:""}
    ${j.state==="JobComplete"?`<button class="btn secondary small" onclick="dlBulk('${j.id}','successful')">✓ CSV</button><button class="btn secondary small" onclick="dlBulk('${j.id}','failed')">✗ CSV</button>`:""}
    </div>`).join("")||`<p class="muted">No jobs yet.</p>`;

let STREAM_SRC=null;
function startStream(){
  stopStream();
  const topics=document.getElementById("st_topics").value.trim();
  const log=document.getElementById("stream_log");
  log.innerHTML=`<p class="muted">Listening…</p>`;
  const es=new EventSource(`/api/streaming?access_token=${encodeURIComponent(token)}${topics?`&topics=${encodeURIComponent(topics)}`:""}`);
  STREAM_SRC=es;
  const show=e=>{
    const div=document.createElement("div"); div.className="rowline";
    div.innerHTML=`<b>${esc(e.type==="message"?"event":e.type)}</b> <code>${esc(""+(e.lastEventId||""))}</code><span class="muted" style="word-break:break-all">${esc(e.data.slice(0,300))}</span>`;
    log.prepend(div);
    while(log.children.length>60) log.lastChild.remove();
  };
  es.onmessage=show; // unnamed events
  topics.split(",").forEach(t=>{ t=t.trim(); if(t) es.addEventListener(t,show); }); // named topic events
  es.onerror=()=>{ const d=document.createElement("div"); d.innerHTML=`<div class="err">Stream error / disconnected.</div>`; log.prepend(d); stopStream(); };
}
function stopStream(){ if(STREAM_SRC){ STREAM_SRC.close(); STREAM_SRC=null; } }

async function showSourceChanges(){
  const since=document.getElementById("src_since").value.trim();
  const r=await api("GET","/api/admin/source/changes"+(since?`?since=${encodeURIComponent(since)}`:""));
  const host=document.getElementById("src_list");
  if(!r.ok){ host.innerHTML=`<div class="err">${esc(r.data.error||"Failed")}</div>`; return; }
  document.getElementById("src_since").value=r.data.server_time;

/* ============ visual flow builder (node canvas) ============ */
let FB=null;
const FB_ACTION_TYPES=[["create_record","Create record"],["set_fields","Update fields"],["log","Log to history"],["http_callout","HTTP callout"]];
function fbNodes(){
  const f=FB.flow, isS=FB.isScreen, nodes=[{key:"start",kind:"start"}];
  if(!isS&&f.condition&&Object.keys(f.condition).length) nodes.push({key:"cond",kind:"cond"});
  if(isS){
    (f.screens||[]).forEach((s,i)=>nodes.push({key:"s"+i,kind:"screen",idx:i}));
    (f.finish_actions||[]).forEach((a,i)=>nodes.push({key:"f"+i,kind:"faction",idx:i}));
  }else{
    (f.actions||[]).forEach((a,i)=>nodes.push({key:"a"+i,kind:"action",idx:i}));
  }
  return nodes;
}
function fbPos(key,i){
  const c=FB.flow.canvas||{};
  return c[key]||{x:260,y:44+i*104};
}
function fbLabel(n){
  const f=FB.flow;
  if(n.kind==="start"){
    if(FB.isScreen) return "▶ "+(f.name||"Screen flow");
    if(f.trigger==="scheduled"){
      const s=f.schedule||{};
      return "▶ scheduled · "+(s.frequency||"daily")+" "+(s.time||"")+" UTC";
    }
    return "▶ "+String(f.trigger||"on_create").replace(/_/g," ")+" · "+(f.object||"");
  }
  if(n.kind==="cond") return "◆ Condition";
  if(n.kind==="screen"){ const s=(f.screens||[])[n.idx]||{}; return "▤ "+(s.title||("Screen "+(n.idx+1))); }
  const a=((n.kind==="faction"?f.finish_actions:f.actions)||[])[n.idx]||{};
  const t=(FB_ACTION_TYPES.find(t=>t[0]===a.type)||[])[1]||a.type||"?";
  const d=a.type==="create_record"&&a.object?(" → "+a.object):a.type==="http_callout"?(" "+(a.method||"POST")+" "+(a.path||"")):"";
  return "⚙ "+t+d;
}
async function openFlowBuilder(kind,id){
  const cfg=SETUP_KINDS[kind];
  const r=await api("GET","/api/admin/"+(cfg.apiKind||kind));
  const rows=Array.isArray(r.data)?r.data:[];
  const flow=rows.find(x=>x.id===id);
  if(!flow){ toast("Flow not found.","error"); return; }
  FB={kind,id,flow:JSON.parse(JSON.stringify(flow)),isScreen:(kind==="screen-flows"||flow.flow_type==="screen"),sel:"start"};
  renderFlowBuilder();
  fbLoadVersions();
}
function renderFlowBuilder(){
  const nodes=fbNodes(), H=Math.max(440,44+nodes.length*104+70);
  const pos=nodes.map((n,i)=>fbPos(n.key,i));
  let svg=`<svg id="fbsvg" viewBox="0 0 560 ${H}" style="width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:none">`;
  svg+=`<defs><marker id="fbarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker></defs>`;
  nodes.forEach((n,i)=>{
    if(!i) return;
    const a=pos[i-1],b=pos[i];
    svg+=`<line id="fbl${i}" x1="${a.x}" y1="${a.y+32}" x2="${b.x}" y2="${b.y-32}" stroke="#94a3b8" stroke-width="2" marker-end="url(#fbarr)"/>`;
  });
  nodes.forEach((n,i)=>{
    const p=pos[i], sel=FB.sel===n.key;
    const fill=n.kind==="start"?"#e8f3fd":n.kind==="cond"?"#fef6e0":"var(--surface)";
    svg+=`<g data-node="${n.key}" transform="translate(${p.x},${p.y})" style="cursor:grab"><rect x="-115" y="-32" width="230" height="64" rx="10" fill="${fill}" stroke="${sel?"#0176d3":"var(--line)"}" stroke-width="${sel?3:1.5}"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">${esc(fbLabel(n).slice(0,36))}</text></g>`;
  });
  svg+="</svg>";
  document.getElementById("main").innerHTML=
   `<div class="btnrow"><button class="btn secondary" onclick="showAdmin()">← Back to Setup</button>`
   +`<h2 style="margin:0">${esc(FB.flow.name||"Flow")}</h2><span style="flex:1"></span>`
   +`<select id="fbvers" style="max-width:190px" title="Version history"><option value="">Versions…</option></select>`
   +`<button class="btn secondary small" onclick="fbRollback()">Rollback</button>`
   +(FB.isScreen?`<button class="btn secondary small" onclick="fbAddStep('screen')">+ Screen</button>`:`<button class="btn secondary small" onclick="fbAddStep('action')">+ Action</button>`)
   +(FB.sel&&FB.sel!=="start"?` <button class="btn danger small" onclick="fbDelStep()">Delete step</button>`:"")
   +` <button class="btn" onclick="fbSave()">Save flow</button></div>`
   +`<div class="fbwrap"><div>${svg}</div><div class="fbpanel card" id="fbpanel"></div></div>`
   +`<p class="muted">Drag steps to arrange · click a step to edit · positions save with the flow.</p>`;
  renderFbPanel();
  fbBindDrag();
}
function fbSvgPt(svg,e){
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function fbBindDrag(){
  const svg=document.getElementById("fbsvg"); if(!svg) return;
  let drag=null;
  svg.querySelectorAll("[data-node]").forEach(g=>{
    g.addEventListener("pointerdown",e=>{
      const key=g.dataset.node, nodes=fbNodes(), i=nodes.findIndex(n=>n.key===key);
      FB.sel=key; renderFbPanel();
      svg.querySelectorAll("[data-node] rect").forEach(r=>{const on=r.parentElement.dataset.node===key; r.setAttribute("stroke",on?"#0176d3":"var(--line)"); r.setAttribute("stroke-width",on?"3":"1.5");});
      const pt=fbSvgPt(svg,e), p=fbPos(key,i);
      drag={key,i,dx:pt.x-p.x,dy:pt.y-p.y,g};
      try{g.setPointerCapture(e.pointerId);}catch(err){}
      e.preventDefault();
    });
  });
  svg.addEventListener("pointermove",e=>{
    if(!drag) return;
    const pt=fbSvgPt(svg,e);
    const x=Math.round(pt.x-drag.dx), y=Math.round(pt.y-drag.dy);
    const c=FB.flow.canvas=FB.flow.canvas||{}; c[drag.key]={x,y};
    drag.g.setAttribute("transform",`translate(${x},${y})`);
    const nodes=fbNodes(), i=drag.i;
    const setLine=(li,ax,ay,bx,by)=>{const l=document.getElementById("fbl"+li); if(l){l.setAttribute("x1",ax);l.setAttribute("y1",ay+32);l.setAttribute("x2",bx);l.setAttribute("y2",by-32);}};
    if(i>0){const p=fbPos(nodes[i-1].key,i-1); setLine(i,p.x,p.y,x,y);}
    if(i<nodes.length-1){const p=fbPos(nodes[i+1].key,i+1); setLine(i+1,x,y,p.x,p.y);}
  });
  svg.addEventListener("pointerup",()=>{drag=null;});
}

let fbJsonOk=true;
function fbJson(id,fb){
  const el=document.getElementById(id); if(!el) return fb;
  try{ const p=JSON.parse(el.value||"{}"); el.style.border=""; return p; }
  catch(e){ el.style.border="2px solid #c0392b"; fbJsonOk=false; toast("Invalid JSON in "+id+" — fix it before saving.","error"); return fb; }
}
function fbApplyPanel(loud){
  if(!FB) return;
  fbJsonOk=true;
  const n=fbNodes().find(x=>x.key===FB.sel); if(!n) return;
  const f=FB.flow, gv=id=>(document.getElementById(id)||{}).value;
  if(n.kind==="start"){
    f.name=gv("fb_name")||f.name;
    if(!FB.isScreen){
      f.object=gv("fb_objsel")||f.object; f.trigger=gv("fb_trig")||f.trigger;
      if(f.trigger==="scheduled"){
        f.schedule={frequency:gv("fb_freq")||"daily",time:gv("fb_stime")||"09:00"};
        if(f.schedule.frequency==="weekly") f.schedule.day_of_week=parseInt(gv("fb_dow")||"1",10);
      }else delete f.schedule;
    }
  }else if(n.kind==="cond"){
    f.condition=fbJson("fb_cond",f.condition);
  }else if(n.kind==="action"||n.kind==="faction"){
    const list=n.kind==="faction"?(f.finish_actions=f.finish_actions||[]):(f.actions=f.actions||[]);
    const type=gv("fb_atype")||"create_record", a={type};
    if(type==="create_record"||type==="set_fields"){
      a.object=gv("fb_aobj");
      if(type==="set_fields") a.record_id=gv("fb_arid")||"{{Trigger.Id}}";
      a.fields=fbJson("fb_afields",{});
    }else if(type==="log"){ a.message=gv("fb_amsg")||""; }
    else if(type==="http_callout"){
      a.credential=gv("fb_acred"); a.method=gv("fb_amethod")||"POST"; a.path=gv("fb_apath")||"";
      a.headers=fbJson("fb_aheaders",{}); a.body=fbJson("fb_abody","");
    }
    list[n.idx]=a;
  }else if(n.kind==="screen"){
    const s=(f.screens||[])[n.idx]; if(!s) return;
    s.title=gv("fb_stitle")||s.title;
    const oldFields=s.fields||[];
    s.fields=[...document.querySelectorAll("#fb_sfields [data-sf='name']")].map(inp=>{
      const i=inp.dataset.i;
      const q=k=>document.querySelector(`#fb_sfields [data-sf='${k}'][data-i='${i}']`);
      return {...(oldFields[+i]||{}),name:q("name").value,label:q("label").value||q("name").value,type:q("type").value};
    }).filter(x=>x.name);
  }
  if(loud) toast("Applied — remember to Save flow.","info");
  renderFlowBuilder();
}
function fbAddStep(kind){
  const f=FB.flow;
  if(kind==="screen"){ (f.screens=f.screens||[]).push({title:"Screen "+(f.screens.length+1),fields:[]}); FB.sel="s"+(f.screens.length-1); }
  else{
    if(FB.isScreen){ (f.finish_actions=f.finish_actions||[]).push({type:"create_record"}); FB.sel="f"+(f.finish_actions.length-1); }
    else{ (f.actions=f.actions||[]).push({type:"create_record"}); FB.sel="a"+(f.actions.length-1); }
  }
  renderFlowBuilder();
}
function fbDelStep(){
  const n=fbNodes().find(x=>x.key===FB.sel); if(!n||n.kind==="start") return;
  if(!confirm("Delete this step?")) return;
  const f=FB.flow;
  if(n.kind==="cond") f.condition={};
  else if(n.kind==="action") f.actions.splice(n.idx,1);
  else if(n.kind==="faction") f.finish_actions.splice(n.idx,1);
  else if(n.kind==="screen") f.screens.splice(n.idx,1);
  FB.sel="start"; renderFlowBuilder();
}
function fbAddScreenField(si){
  fbApplyPanel(false);
  const s=FB.flow.screens[si]; s.fields=s.fields||[]; s.fields.push({name:"field"+(s.fields.length+1),label:"Field "+(s.fields.length+1),type:"text"});
  FB.sel="s"+si; renderFlowBuilder();
}
function fbDelScreenField(si,fi){
  fbApplyPanel(false);
  FB.flow.screens[si].fields.splice(fi,1);
  FB.sel="s"+si; renderFlowBuilder();
}
async function fbSave(){
  fbApplyPanel(false);
  if(!fbJsonOk){ toast("Fix the invalid JSON before saving.","error"); return; }
  const f=FB.flow, payload={name:f.name,canvas:f.canvas||{}};
  if(FB.isScreen){ payload.screens=f.screens||[]; payload.finish_actions=f.finish_actions||[]; }
  else{ payload.object=f.object; payload.trigger=f.trigger; payload.condition=f.condition||{}; payload.actions=f.actions||[]; if(f.schedule) payload.schedule=f.schedule; }
  const cfg=SETUP_KINDS[FB.kind];
  const r=await api("PATCH","/api/admin/"+(cfg.apiKind||FB.kind)+"/"+FB.id,payload);
  if(r.ok){ toast("Flow saved.","ok"); fbLoadVersions(); }
  else toast("Save failed: "+(r.data.error||r.status),"error");
}

/* ============ dispatch console ============ */
let dispDate=null, dispTerr="", dispCache=null, dispSkills={};
const FS_STAT_COLOR={"Completed":"#2e9e4f","In Progress":"#d98a1f","Dispatched":"#8b5cf6","Scheduled":"#0176d3","Cancelled":"#94a3b8","Cannot Complete":"#ef4444","None":"#6b7280"};
const FS_TRANSITIONS={"None":["Scheduled","Cancelled"],"Scheduled":["Dispatched","Cancelled"],"Dispatched":["In Progress","Cancelled"],"In Progress":["Completed","Cannot Complete","Cancelled"],"Cannot Complete":["Scheduled"],"Cancelled":["Scheduled"]};
const FS_ACTION_LABEL={"Scheduled":"Re-schedule","Dispatched":"Start travel","In Progress":"Start work","Completed":"Complete","Cannot Complete":"Cannot complete","Cancelled":"Cancel"};
function fsStatusPill(s){

function fsMapLink(loc){
  const p=String(loc||"").split(";");
  if(p.length!==2||!p[0].trim()||!p[1].trim()) return "";
  return ` <a href="https://www.google.com/maps?q=${encodeURIComponent(p[0].trim()+","+p[1].trim())}" target="_blank" rel="noopener">Map</a>`;
}
function fsHm(iso){ return iso?String(iso).slice(11,16):"—"; }
async function showDispatch(){
  setActive("__dispatch");
  if(!dispDate) dispDate=new Date().toISOString().slice(0,10);
  document.getElementById("main").innerHTML=skel(3);
  const q=`date=${dispDate}${dispTerr?`&territory_id=${encodeURIComponent(dispTerr)}`:""}`;
  const [d,terr,sk]=await Promise.all([
    api("GET",`/api/field-service/dispatch?${q}`),
    api("GET","/api/sobjects/ServiceTerritory"),
    api("GET","/api/sobjects/Skill")
  ]);
  if(!d.ok){ document.getElementById("main").innerHTML=`<div class="err">${esc((d.data||{}).error||"Failed to load dispatch data")}</div>`; return; }
  dispCache=d.data||{};
  const terrs=(terr.ok&&terr.data)||[];
  dispSkills={}; ((sk.ok&&sk.data)||[]).forEach(s=>{ dispSkills[s.Id]=s.Name||s.Id; });
  const lanes=dispCache.lanes||[], unsched=dispCache.unscheduled||[];
  const nAppt=lanes.reduce((n,l)=>n+(l.appointments||[]).length,0);
  const H0=6,H1=22,SPAN=H1-H0;
  const pct=dt=>{ const x=new Date(dt); return Math.min(100,Math.max(0,((x.getHours()+x.getMinutes()/60)-H0)/SPAN*100)); };
  const today=new Date().toISOString().slice(0,10);
  const nowPct=dispDate===today?pct(new Date().toISOString()):null;
  let ticks=""; for(let h=H0;h<=H1;h+=2) ticks+=`<span style="position:absolute;left:${((h-H0)/SPAN*100).toFixed(1)}%;transform:translateX(-50%)">${h}:00</span>`;
  let html=`<div class="btnrow" style="align-items:center;flex-wrap:wrap"><h2 style="margin:0">Dispatch console</h2>`
    +`<span class="muted">${nAppt} scheduled · ${unsched.length} unscheduled · ${lanes.length} resource(s)</span><span style="flex:1"></span>`
    +`<select id="disp_terr" onchange="dispTerr=this.value;showDispatch()" style="width:auto"><option value="">All territories</option>${terrs.map(t=>`<option value="${t.Id}"${dispTerr===t.Id?" selected":""}>${esc(t.Name||t.Id)}</option>`).join("")}</select> `
    +`<input type="date" id="disp_date" value="${dispDate}" style="width:auto"> <button class="btn secondary small" onclick="dispDate=v('disp_date');showDispatch()">Go</button> `
    +`<button class="btn secondary small" onclick="dispDate=new Date().toISOString().slice(0,10);showDispatch()">Today</button> `
    +`<button class="btn small" onclick="dispAutoSchedule()">Auto-schedule day</button> `
    +`<button class="btn secondary small" onclick="dispOptimize()">Optimize routes</button></div>`;
  html+=`<div class="setup-links">Setup: ${["ServiceTerritory","ServiceResource","WorkType","OperatingHours","Skill"].map(o=>`<a href="#" onclick="showObject('${o}');return false">${o}</a>`).join(" · ")}</div>`;
  // ---- resource lanes gantt ----
  html+=`<div class="card"><div class="section-title">Resource schedule</div><div class="disp-head"><div></div><div class="disp-scale">${ticks}</div></div>`;
  if(!lanes.length) html+=`<p class="muted">No active service resources${dispTerr?" in this territory":""}. Add them under Setup: ServiceResource.</p>`;
  for(const lane of lanes){
    const res=lane.resource||{};
    const appts=(lane.appointments||[]).slice().sort((a,b)=>(a.ScheduledStart||"").localeCompare(b.ScheduledStart||""));
    const ends=[];
    for(const a of appts){ // stack overlapping bars on separate rows
      const s=a.ScheduledStart||"", e=a.ScheduledEnd||s;
      let r=0; while(ends[r]&&ends[r]>s) r++;
      ends[r]=e; a._row=r;
    }
    const laneH=Math.max(1,ends.length)*36+10;
    html+=`<div class="disp-row"><div style="padding:10px 8px"><b>${esc(res.Name||"(no name)")}</b><div class="muted">${appts.length} appt(s)</div></div><div class="disp-lane" style="min-height:${laneH}px" ondragover="dispDragOver(event)" ondragleave="dispDragLeave(event)" ondrop="dispDropLane(event,'${res.Id}')">`;
    for(const a of appts){
      const l=pct(a.ScheduledStart), w=Math.max(2.5,pct(a.ScheduledEnd||a.ScheduledStart)-l);
      const tip=`${a.Name||"(no name)"} — ${fsHm(a.ScheduledStart)}–${fsHm(a.ScheduledEnd)} · ${a.Status||""}${a.Address?" · "+a.Address:""}`;
      html+=`<div class="disp-bar" draggable="true" ondragstart="dispDragStart(event,'sched','${a.Id}')" style="left:${l.toFixed(1)}%;width:${w.toFixed(1)}%;top:${9+(a._row||0)*36}px;background:${FS_STAT_COLOR[a.Status]||"#0176d3"}" title="${esc(tip)}" onclick="openApptModal('${a.Id}')">${esc(a.Name||"(no name)")}</div>`;
    }
    if(nowPct!=null&&nowPct>=0&&nowPct<=100) html+=`<div style="position:absolute;left:${nowPct.toFixed(1)}%;top:0;bottom:0;width:2px;background:#ef4444;opacity:.7" title="Now"></div>`;
    html+=`</div></div>`;
  }
  html+=`</div><p class="muted">Click a block to open the appointment. Drag an unscheduled card onto a lane to assign it, drag a bar between lanes to reassign, or drop a bar back on the unscheduled tray to unassign.</p>`;
  // ---- unscheduled tray ----
  html+=`<div class="section-title" style="margin-top:18px">Unscheduled (${unsched.length})</div>`;
  html+=`<div class="unsch-grid" id="unsch_tray" ondragover="dispDragOver(event)" ondragleave="dispDragLeave(event)" ondrop="dispDropTray(event)">${unsched.length?unsched.map(a=>dispUnscheduledCard(a)).join(""):`<p class="muted">Nothing waiting to be scheduled.</p>`}</div>`;
  document.getElementById("main").innerHTML=html;
}

/* ---- Gantt drag and drop (click/modal flows stay as the keyboard path) ---- */
function dispDragStart(e,kind,id){
  e.dataTransfer.setData("text/plain",JSON.stringify({kind,id}));
  e.dataTransfer.effectAllowed="move";
}
function dispDragOver(e){
  e.preventDefault(); e.dataTransfer.dropEffect="move";
  const t=e.currentTarget;
  if(t&&t.classList&&(t.classList.contains("disp-lane")||t.classList.contains("unsch-grid"))) t.classList.add("dragover");
}
function dispDragLeave(e){ const t=e.currentTarget; if(t&&t.classList) t.classList.remove("dragover"); }
function dispDragPayload(e){
  try{ const d=JSON.parse(e.dataTransfer.getData("text/plain")||""); return d&&d.id?d:null; }catch(_){ return null; }
}
function dispLaneOf(apptId){
  if(!dispCache) return null;
  for(const l of dispCache.lanes||[]) for(const a of l.appointments||[]) if(a.Id===apptId) return (l.resource||{}).Id||null;
  return null;
}
async function dispDropLane(e,resId){
  e.preventDefault();
  const t=e.currentTarget; if(t&&t.classList) t.classList.remove("dragover");
  const d=dispDragPayload(e); if(!d) return;
  if(dispLaneOf(d.id)===resId) return; // already on this lane
  // mirror the modal's assign behavior: use the candidate's proposed start for this resource
  let start=null;
  try{
    const cr=await api("GET",`/api/field-service/candidates?appointment_id=${encodeURIComponent(d.id)}&date=${dispDate}`);
    const cands=(cr.ok&&(cr.data.candidates||[]))||[];
    const hit=cands.find(c=>(c.resource||{}).Id===resId);
    start=hit&&hit.start?hit.start:null;
  }catch(_){}
  dispAssign(d.id,resId,start);
}
async function dispDropTray(e){
  e.preventDefault();
  const t=e.currentTarget; if(t&&t.classList) t.classList.remove("dragover");
  const d=dispDragPayload(e); if(!d||d.kind!=="sched") return;
  if(!dispLaneOf(d.id)) return; // already unscheduled
  dispUnassign(d.id);
}

function sigInit(canvasId){
  const c=document.getElementById(canvasId);
  if(!c||c._sigInit) return; c._sigInit=true;
  const ctx=c.getContext("2d");
  ctx.lineWidth=2; ctx.lineCap="round"; ctx.strokeStyle="#111";
  let drawing=false, drawn=false;
  const pos=e=>{
    const r=c.getBoundingClientRect(), t=e.touches&&e.touches[0];
    const x=((t?t.clientX:e.clientX)-r.left)*(c.width/Math.max(1,r.width));
    const y=((t?t.clientY:e.clientY)-r.top)*(c.height/Math.max(1,r.height));
    return [x,y];
  };
  const start=e=>{ e.preventDefault(); drawing=true; drawn=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); };
  const move=e=>{ if(!drawing) return; e.preventDefault(); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  const end=()=>{ drawing=false; };
  c.addEventListener("mousedown",start); c.addEventListener("mousemove",move);
  c.addEventListener("mouseup",end); c.addEventListener("mouseleave",end);
  c.addEventListener("touchstart",start,{passive:false}); c.addEventListener("touchmove",move,{passive:false});
  c.addEventListener("touchend",end);
  c._sigDrawn=()=>drawn;

function canInline(f){

function inlineCell(c,row){
  const val=row[c.name], dis=`onchange="inlineSave(this,'${row.Id}','${c.name}','${c.type}')"`;

  if(c.type==="Picklist") return `<select ${dis} style="max-width:170px"><option value="">—</option>${(c.picklist_values||[]).map(p=>`<option ${String(val)===String(p)?"selected":""}>${esc(p)}</option>`).join("")}</select>`;

/* ============ dashboard builder ============ */
let dashBoards=[], curDash=null, dashBuild=false, dashWidgets=[];
async function renderDashboards(){
  const reps=(await api("GET","/api/reports")).data||[];
  const isAdmin=me.profile==="System Administrator";
  let html=`<div class="btnrow"><h2 style="margin:0">Dashboards</h2>`
    +`<select id="dash_sel" onchange="curDash=dashBoards.find(d=>d.id===this.value);dashBuild=false;renderDashboards()" style="max-width:220px">${dashBoards.map(d=>`<option value="${d.id}" ${curDash&&curDash.id===d.id?"selected":""}>${esc(d.name)}</option>`).join("")}</select>`
    +`<span style="flex:1"></span><button class="btn secondary small" onclick="showReports()">Manage reports</button> `
    +(curDash?`<button class="btn secondary small" onclick="subModal('dashboard',curDash.id,curDash.name)">Subscribe</button> `:"");
  if(isAdmin){
    html+=dashBuild
      ?`<button class="btn secondary small" onclick="dashNew()">+ New</button> <button class="btn danger small" onclick="dashDel()">Delete</button> <button class="btn secondary small" onclick="dashBuild=false;renderDashboards()">Done</button>`
      :`<button class="btn secondary small" onclick="dashBuild=true;dashWidgets=JSON.parse(JSON.stringify((curDash&&curDash.widgets)||[]));renderDashboards()">⚙ Customize</button>`;
  }
  html+=`</div>`;
  if(!curDash){
    html+=`<div class="card"><p class="muted">No dashboards yet.</p>${isAdmin?`<button class="btn" onclick="dashSeed()">Create starter dashboard</button> <button class="btn secondary" onclick="dashNew()">Blank dashboard</button>`:""}</div>`;
  }else if(dashBuild){
    html+=dashBuildHtml(reps);
  }else{
    html+=`<div class="dashgrid" id="dashview">${skel(2)}</div>`;
  }
  document.getElementById("main").innerHTML=html;
  if(curDash&&!dashBuild) dashRenderView();
  if(curDash&&dashBuild){ dashBindDnD(); dashRenderPreview(); }
}
function dashChart(dd,type){
  if(!(dd.groups||[]).length) return `<div class="stat"><div class="n">${dd.row_count}</div><div class="l">records</div></div>`;
  if(type==="donut") return svgDonut(dd.groups);
  if(type==="stat") return `<div class="stat"><div class="n">${dd.row_count}</div><div class="l">records</div></div>`;
  return svgBars(dd.groups);
}
async function dashRenderView(){
  const box=document.getElementById("dashview"); if(!box||!curDash) return;
  const reps=(await api("GET","/api/reports")).data||[];
  let html="";
  for(const w of (curDash.widgets||[])){
    const rep=reps.find(x=>x.id===w.report_id); if(!rep) continue;
    const d=await api("GET",`/api/reports/${rep.id}/run`); if(!d.ok) continue;
    html+=`<div class="card"${w.w===2?` style="grid-column:span 2"`:""}><b>${esc(rep.name)}</b><p class="muted">${d.data.row_count} row(s) · ${esc(rep.object)}${rep.group_by?" · by "+esc(rep.group_by):""}</p>${dashChart(d.data,w.type)}</div>`;
  }
  box.innerHTML=html||`<div class="card"><p class="muted">No widgets yet — admins can add some via Customize.</p></div>`;
}
function dashBuildHtml(reps){
  let html=`<div class="dashbuild-grid" id="dashblist">`;
  dashWidgets.forEach((w,i)=>{
    html+=`<div class="dashw" draggable="true" data-wi="${i}"><div class="btnrow"><span style="cursor:grab" title="Drag to reorder">⠿</span><b>Widget ${i+1}</b><span style="flex:1"></span><button class="btn danger small" onclick="dashWidgets.splice(${i},1);renderDashboards()">Remove</button></div>`
      +`<label>Report</label><select onchange="dashWidgets[${i}].report_id=this.value;dashRenderPreview()"><option value="">— choose —</option>${reps.map(r=>`<option value="${r.id}" ${w.report_id===r.id?"selected":""}>${esc(r.name)}</option>`).join("")}</select>`
      +`<div class="grid2"><div><label>Chart</label><select onchange="dashWidgets[${i}].type=this.value;dashRenderPreview()">${["bar","donut","stat"].map(t=>`<option ${w.type===t?"selected":""}>${t}</option>`).join("")}</select></div>`
      +`<div><label>Width</label><select onchange="dashWidgets[${i}].w=parseInt(this.value);dashRenderPreview()">${[1,2].map(n=>`<option value="${n}" ${w.w===n?"selected":""}>${n===2?"Wide":"Normal"}</option>`).join("")}</select></div></div></div>`;
  });
  html+=`</div><div class="btnrow" style="margin-top:12px"><button class="btn secondary" onclick="dashWidgets.push({report_id:'',type:'bar',w:1});renderDashboards()">+ Add widget</button><span style="flex:1"></span><label style="margin:0">Name</label> <input id="dash_name" value="${esc(curDash.name)}" style="max-width:200px"> <button class="btn" onclick="dashSave()">Save dashboard</button></div>`;
  html+=`<div class="card" style="margin-top:12px"><b>Live preview</b><div id="dashprev" class="dashgrid" style="margin-top:8px"><p class="muted">Loading…</p></div></div>`;
  return html;
}
function dashBindDnD(){
  const list=document.getElementById("dashblist"); if(!list) return;
  let src=null;
  list.querySelectorAll(".dashw").forEach(el=>{
    el.addEventListener("dragstart",()=>{ src=parseInt(el.dataset.wi,10); el.classList.add("dragging"); });
    el.addEventListener("dragend",()=>el.classList.remove("dragging"));
    el.addEventListener("dragover",e=>e.preventDefault());
    el.addEventListener("drop",e=>{
      e.preventDefault();
      const dst=parseInt(el.dataset.wi,10);
      if(src==null||src===dst) return;
      const m=dashWidgets.splice(src,1)[0]; dashWidgets.splice(dst,0,m); renderDashboards();
    });
  });
}
async function dashRenderPreview(){
  const box=document.getElementById("dashprev"); if(!box) return;
  const reps=(await api("GET","/api/reports")).data||[];

    if(!w.report_id) continue;
    const rep=reps.find(x=>x.id===w.report_id); if(!rep) continue;

    html+=`<div class="card"${w.w===2?` style="grid-column:span 2"`:""}><b>${esc(rep.name)}</b>${dashChart(d.data,w.type)}</div>`;

}
async function dashSave(){
  const name=(document.getElementById("dash_name")||{}).value||curDash.name;

  const r=await api("PUT","/api/dashboards/"+curDash.id,{name,widgets});
  if(r.ok){ curDash=r.data; dashBoards=dashBoards.map(d=>d.id===curDash.id?curDash:d); dashBuild=false; renderDashboards(); toast("Dashboard saved.","ok"); }
  else toast("Save failed: "+((r.data||{}).error||r.status),"error");
}
async function dashNew(){
  const r=await api("POST","/api/dashboards",{name:"New dashboard",widgets:[]});

async function dashDel(){
  if(!confirm("Delete this dashboard?")) return;
  const r=await api("DELETE","/api/dashboards/"+curDash.id);

/* ============ calendar view (events / tasks / service appointments) ============ */
let calCursor=null, calView="month";
const CAL_SOURCES=[
 {obj:"Event",start:"StartDateTime",color:"#0176d3",label:r=>r.Subject||"(event)"},
 {obj:"Task",start:"DueDate",color:"#2e9e4f",label:r=>r.Subject||"(task)"},
 {obj:"ServiceAppointment",start:"ScheduledStart",color:"#d98a1f",label:r=>r.Subject||r.Name||"(appt)"},
];
function calShift(dir){ const [y,m]=calCursor.split("-").map(Number); const d=new Date(y,m-1+dir,1); calCursor=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; showCalendar(); }
async function showCalendar(){
  setActive("__calendar");
  if(!calCursor){ const d=new Date(); calCursor=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
  document.getElementById("main").innerHTML=skel(3);
  const [y,m]=calCursor.split("-").map(Number);
  const dim=new Date(y,m,0).getDate(), from=`${calCursor}-01`, to=`${calCursor}-${String(dim).padStart(2,"0")}`;
  const items=[];
  for(const s of CAL_SOURCES){
    const r=await api("GET",`/api/sobjects/${s.obj}?sort=${s.start}&dir=asc`);
    if(!r.ok) continue;
    for(const rec of (r.data||[])){
      const day=(rec[s.start]||"").slice(0,10);
      if(day>=from&&day<=to) items.push({...rec,_src:s,_day:day});
    }
  }
  const monthName=new Date(y,m-1,1).toLocaleString("default",{month:"long",year:"numeric"});
  let html=`<div class="btnrow"><h2 style="margin:0">Calendar</h2><span class="muted">${items.length} item(s)</span><span style="flex:1"></span>`
    +`<button class="btn secondary small" onclick="calView='month';showCalendar()">Month</button>`
    +`<button class="btn secondary small" onclick="calView='agenda';showCalendar()">Agenda</button>`
    +`<button class="btn secondary small" onclick="calShift(-1)">‹</button><b>${monthName}</b><button class="btn secondary small" onclick="calShift(1)">›</button>`
    +`<button class="btn secondary small" onclick="calCursor=null;showCalendar()">Today</button></div>`;
  if(calView==="agenda"){
    items.sort((a,b)=>(a[a._src.start]||"").localeCompare(b[b._src.start]||""));
    html+=`<div class="card">`+(items.length?items.map(it=>
      `<div style="padding:8px 4px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center"><span class="muted" style="min-width:150px">${esc((it[it._src.start]||"").slice(0,16).replace("T"," "))}</span><span class="pill" style="background:${it._src.color}22;color:${it._src.color}">${esc(it._src.obj)}</span><a href="#" onclick="jumpTo('${it._src.obj}','${it.Id}');return false"><b>${esc(it._src.label(it))}</b></a></div>`
    ).join(""):`<p class="muted">Nothing scheduled this month.</p>`)+`</div>`;
  }else{
    const lead=new Date(y,m-1,1).getDay();
    const cells=[];
    for(let i=0;i<lead;i++) cells.push(null);
    for(let d=1;d<=dim;d++) cells.push(`${calCursor}-${String(d).padStart(2,"0")}`);
    while(cells.length%7) cells.push(null);
    const today=new Date().toISOString().slice(0,10);
    html+=`<div class="cal-grid">`+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
    for(const day of cells){
      if(!day){ html+=`<div class="cal-cell cal-empty"></div>`; continue; }
      const its=items.filter(i=>i._day===day);
      html+=`<div class="cal-cell${day===today?" cal-today":""}" ondragover="event.preventDefault()" ondrop="calDrop(event,'${day}')">`
        +`<div class="cal-date">${parseInt(day.slice(8),10)}</div>`
        +its.slice(0,4).map(it=>`<div class="cal-chip" draggable="true" ondragstart="calDrag(event,'${it._src.obj}','${it.Id}','${it._src.start}','${esc((it[it._src.start]||"").slice(0,10))}')" title="${esc(it._src.label(it))} — drag to reschedule" onclick="jumpTo('${it._src.obj}','${it.Id}')" style="border-left:3px solid ${it._src.color}">${esc(it._src.label(it).slice(0,22))}</div>`).join("")
        +(its.length>4?`<div class="muted" style="font-size:11px">+${its.length-4} more</div>`:"")
        +`</div>`;
    }
    html+=`</div><p class="muted">Drag an item onto another day to reschedule it. Click an item to open the record.</p>`;
  }
  document.getElementById("main").innerHTML=html;
}
function calDrag(e,obj,id,field,oldDay){ e.dataTransfer.setData("text/plain",JSON.stringify({obj,id,field,oldDay})); }
function jumpTo(obj,id){ curObj=obj; showDetail(id); }
async function calDrop(e,day){
  e.preventDefault();
  let d; try{ d=JSON.parse(e.dataTransfer.getData("text/plain")); }catch(_){ return; }
  if(!d||d.oldDay===day) return;
  // fetch current value to preserve the time portion on datetime fields
  const r0=await api("GET",`/api/sobjects/${d.obj}/${d.id}`);
  const cur=r0.ok?String((r0.data||{})[d.field]||""):"";
  const val=cur.length>10?day+cur.slice(10):day;
  const r=await api("PATCH",`/api/sobjects/${d.obj}/${d.id}`,{[d.field]:val});
  if(r.ok){ toast("Rescheduled to "+day+".","ok"); showCalendar(); }
  else toast("Reschedule failed: "+((r.data||{}).error||r.status),"error");
}

    +`</table><div class="section-title" style="margin-top:12px">New macro</div><div class="grid2"><div><label>Name</label><input id="nm_name" placeholder="Close as solved"></div><div><label>Actions JSON</label><input id="nm_act" placeholder='[{"set_fields":{"Status":"Closed"}},{"add_comment":"Done"}]'></div></div><p class="muted">Action types: <code>set_fields</code>, <code>add_comment</code>, <code>reassign</code> (user id).</p><div class="btnrow"><button class="btn" onclick="macroCreate()">Create macro</button></div></div>`;
  document.getElementById("main").innerHTML=html;
}

async function queueToggle(id,active){ const r=await api("PUT",`/api/case-queues/${id}`,{active:!active}); r.ok?showQueueAdmin():toast("Failed.","error"); }
async function queueDel(id){ if(!confirm("Delete this queue?")) return; const r=await api("DELETE",`/api/case-queues/${id}`); r.ok?showQueueAdmin():toast("Failed.","error"); }
async function macroCreate(){
  let acts; try{ acts=JSON.parse(document.getElementById("nm_act").value||"[]"); }catch(e){ document.getElementById("merr").innerHTML=`<div class="err">Invalid JSON: ${esc(e.message)}</div>`; return; }

/* ============ bulk data jobs ============ */
let bulkTimer=null;
async function showBulk(){
  setActive("__bulk");
  if(bulkTimer){ clearInterval(bulkTimer); bulkTimer=null; }
  document.getElementById("main").innerHTML=skel(3);
  const objs=(objects||[]).map(o=>`<option>${o.name}</option>`).join("");
  let html=`<div class="btnrow"><h2 style="margin:0">Bulk Data Jobs</h2><span class="muted">async insert / update / upsert</span></div>`;
  html+=`<div class="card"><div class="section-title">New bulk job</div><div id="bjerr"></div><div class="grid2"><div>`
    +`<label>Object</label><select id="bj_obj">${objs}</select><label>Operation</label><select id="bj_op"><option value="insert">Insert</option><option value="update">Update (needs Id per row)</option><option value="upsert">Upsert (needs external ID field)</option></select><label>External ID field (upsert only)</label><input id="bj_ext" placeholder="e.g. External_Id__c"></div><div>`
    +`<label>Rows — JSON array, or CSV with a header row</label><textarea id="bj_rows" rows="8" placeholder='[{"Subject":"Call back","Status":"Not Started"}]'></textarea></div></div>`
    +`<div class="btnrow" style="margin-top:8px"><button class="btn" onclick="bulkSubmit()">Run bulk job</button></div></div>`;
  html+=`<div class="card"><div class="section-title">Jobs</div><div id="bjobs"></div></div>`;
  document.getElementById("main").innerHTML=html;
  await bulkRefresh();
  bulkTimer=setInterval(async()=>{ if(!document.getElementById("bjobs")){ clearInterval(bulkTimer); bulkTimer=null; return; } await bulkRefresh(true); },4000);
}
function csvToRows(text){
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  const heads=lines[0].split(",").map(h=>h.trim());
  return lines.slice(1).map(l=>{ const cells=l.split(","); const o={}; heads.forEach((h,i)=>{ let c=(cells[i]||"").trim(); if(c!==""&&!isNaN(c)) c=Number(c); o[h]=c; }); return o; });
}
async function bulkSubmit(){
  let rows; const raw=document.getElementById("bj_rows").value.trim();
  if(!raw){ document.getElementById("bjerr").innerHTML=`<div class="err">Paste rows first.</div>`; return; }
  try{ rows=raw.startsWith("[")?JSON.parse(raw):csvToRows(raw); }
  catch(e){ document.getElementById("bjerr").innerHTML=`<div class="err">Could not parse rows: ${esc(e.message)}</div>`; return; }
  if(!Array.isArray(rows)||!rows.length){ document.getElementById("bjerr").innerHTML=`<div class="err">No rows found.</div>`; return; }
  const body={object:v("bj_obj"),operation:v("bj_op"),rows,external_id_field:v("bj_ext")||undefined};
  const r=await api("POST","/api/bulk-jobs",body);
  if(r.ok){ toast("Bulk job started.","ok"); bulkRefresh(); }
  else toast("Failed: "+((r.data||{}).error||r.status),"error");
}
async function bulkRefresh(quiet){
  const box=document.getElementById("bjobs"); if(!box) return;
  const r=await api("GET","/api/bulk-jobs");
  const jobs=Array.isArray(r.data)?r.data:[];
  box.innerHTML=jobs.length?`<table><tr><th>Name</th><th>Object</th><th>Op</th><th>Status</th><th>Processed</th><th>OK</th><th>Failed</th><th></th></tr>`
    +jobs.map(j=>`<tr><td><b>${esc(j.name)}</b><div class="muted">${esc(j.rows||"")}</div>${(j.errors||[]).length?`<div class="err" style="margin-top:4px">${esc(j.errors.slice(0,3).join(" · "))}${j.errors.length>3?" …":""}</div>`:""}</td><td>${esc(j.object)}</td><td>${esc(j.operation)}</td><td><span class="pill ${j.status==="completed"?"pill-on":"pill-off"}">${esc(j.status)}</span></td><td>${j.processed??0}</td><td>${j.succeeded??0}</td><td>${j.failed??0}</td><td><button class="btn secondary small" onclick="bulkRefresh()">Refresh</button></td></tr>`).join("")+`</table>`
    :`<p class="muted">No bulk jobs yet.</p>`;
}

/* ============ report subscriptions ============ */
function subModal(kind,id,name){
  openLightbox(`<div class="section-title">Subscribe — ${esc(name)}</div>
  <p class="muted">A ${kind} digest is emailed on schedule. Delivery is logged under Admin Setup → Email Log${window.FORCELET_SMTP?"":" (demo mode: logged, not sent)"}.</p>
  <label>Frequency</label><select id="sub_freq"><option value="daily">Daily</option><option value="weekly">Weekly</option></select>
  <label>Recipient emails (comma-separated)</label><input id="sub_rcpt" placeholder="you@company.com">
  <div class="btnrow" style="margin-top:10px"><button class="btn" onclick="subSave('${kind}','${id}')">Subscribe</button>
  <button class="btn secondary" onclick="closeLightbox()">Cancel</button></div><div id="suberr"></div>`);
}
async function subSave(kind,id){
  const freq=document.getElementById("sub_freq").value;
  const rcpt=document.getElementById("sub_rcpt").value.split(",").map(s=>s.trim()).filter(Boolean);
  if(!rcpt.length){ document.getElementById("suberr").innerHTML=`<div class="err">Add at least one recipient.</div>`; return; }
  const body={frequency:freq,recipients:rcpt};
  body[kind==="report"?"report_id":"dashboard_id"]=id;
  const r=await api("POST","/api/report-subscriptions",body);
  if(r.ok){ closeLightbox(); toast(`Subscribed — ${freq} digest enabled.`,"ok"); }
  else document.getElementById("suberr").innerHTML=`<div class="err">${esc((r.data||{}).error||r.status)}</div>`;
}

/* ============ flow version history ============ */
async function fbLoadVersions(){
  const sel=document.getElementById("fbvers"); if(!sel||!FB) return;
  const cfg=SETUP_KINDS[FB.kind];
  const r=await api("GET",`/api/admin/${cfg.apiKind||FB.kind}/${FB.id}/versions`);
  const vers=r.ok&&Array.isArray(r.data)?r.data:[];
  sel.innerHTML=`<option value="">Versions (${vers.length})…</option>`+vers.map(v=>`<option value="${v.id}">v${v.version} — ${esc((v.created_at||"").slice(0,16).replace("T"," "))}${v.note?" — "+esc(v.note.slice(0,30)):""}</option>`).join("");
  FB.versions=vers;
}
async function fbRollback(){
  const sel=document.getElementById("fbvers");
  const vid=sel&&sel.value;
  if(!vid){ toast("Pick a version from the history dropdown first.","info"); return; }
  if(!confirm("Rollback this flow to the selected version? The current state will be snapshotted first.")) return;
  const cfg=SETUP_KINDS[FB.kind];
  const r=await api("POST",`/api/admin/${cfg.apiKind||FB.kind}/${FB.id}/rollback`,{version_id:vid});
  if(r.ok){ toast("Rolled back.","ok"); openFlowBuilder(FB.kind,FB.id); }
  else toast("Rollback failed: "+((r.data||{}).error||r.status),"error");
}

/* ============ TOTP two-factor management ============ */
async function totpManage(){
  const s=await api("GET","/api/me/totp/status");
  if(s.ok&&s.data.enabled){
    openLightbox(`<div class="section-title">Two-factor authentication</div><p>Two-factor is <b>enabled</b> for your account.</p>
    <label>Confirm password to disable</label><input id="totp_pw" type="password">
    <div class="btnrow" style="margin-top:10px"><button class="btn danger" onclick="totpDisable()">Disable 2FA</button>
    <button class="btn secondary" onclick="closeLightbox()">Cancel</button></div><div id="totperr2"></div>`);
  }else{
    const r=await api("POST","/api/me/totp/setup");
    if(!r.ok){ toast("Setup failed.","error"); return; }
    openLightbox(`<div class="section-title">Set up two-factor authentication</div>
    <p class="muted">1. Open your authenticator app (Google Authenticator, 1Password, …) and add this secret, or open the link below on your phone.</p>
    <label>Secret (keep private)</label><input readonly value="${esc(r.data.secret)}" onclick="this.select()">
    <p><a href="${esc(r.data.otpauth_url)}">otpauth link — open on your phone</a></p>
    <p class="muted">2. Enter the 6-digit code to finish.</p>
    <input id="totp_en_code" inputmode="numeric" maxlength="6" placeholder="000000" style="max-width:160px">
    <div class="btnrow" style="margin-top:10px"><button class="btn" onclick="totpEnable()">Enable 2FA</button>
    <button class="btn secondary" onclick="closeLightbox()">Cancel</button></div><div id="totperr2"></div>`);
  }
}
async function totpEnable(){
  const r=await api("POST","/api/me/totp/enable",{code:document.getElementById("totp_en_code").value.trim()});
  if(r.ok){ closeLightbox(); toast("Two-factor enabled.","ok"); }
  else document.getElementById("totperr2").innerHTML=`<div class="err">${esc((r.data||{}).error||r.status)}</div>`;
}
async function totpDisable(){
  const r=await api("POST","/api/me/totp/disable",{password:document.getElementById("totp_pw").value});
  if(r.ok){ closeLightbox(); toast("Two-factor disabled.","ok"); }
  else document.getElementById("totperr2").innerHTML=`<div class="err">${esc((r.data||{}).error||r.status)}</div>`;
}
