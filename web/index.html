<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forcelet — mini-CRM</title>
<style>
:root{
  --blue:#0176d3; --blue-dark:#014486;
  --bg:#f3f2f2; --surface:#ffffff; --surface2:#fafaf9;
  --text:#181818; --muted:#706e6b; --line:#d8dde6;
  --header-bg:#032d60; --header-text:#ffffff;
  --input-bg:#ffffff;
  --danger:#c0392b; --ok:#1b5e20; --ok-bg:#e8f5e9; --err-bg:#fdecea; --err:#a93226;
  --shadow:0 1px 3px rgba(0,0,0,.08); --radius:10px;
}
[data-theme="dark"]{
  --bg:#121417; --surface:#1c1f24; --surface2:#24292f;
  --text:#e8eaed; --muted:#9aa0a6; --line:#343a41;
  --header-bg:#0b1220; --header-text:#e8eaed;
  --input-bg:#24292f;
  --ok-bg:#14291a; --ok:#7cc78a; --err-bg:#3a1d18; --err:#f0978a;
  --shadow:0 1px 3px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.45}
header{background:var(--header-bg);color:var(--header-text);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:20px} header h1 span{font-weight:400}
header .hgroup{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
header input#gsearch{background:var(--input-bg);color:var(--text)}
.userbox{font-size:13px;display:flex;gap:12px;align-items:center}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--header-text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
.iconbtn:hover{background:rgba(255,255,255,.22)}
nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:50}
nav button{border:0;background:none;padding:14px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
nav button .badge{background:var(--danger);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px}
main{padding:20px 24px;max-width:1150px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
/* ---- Admin Setup: home, sections, tiles ---- */
.setup-breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--muted)}
.setup-breadcrumb a{cursor:pointer;color:var(--accent);font-weight:600}
.setup-nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px;padding:10px 0;background:var(--bg)}
.setup-nav button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:600}
.setup-nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.setup-search{margin-bottom:14px}
.setup-search input{width:100%;max-width:520px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);font-size:14px}
.setup-sec{margin-bottom:26px}
.setup-sec-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.setup-sec-head .ticon{font-size:24px}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;box-shadow:var(--shadow);color:var(--text)}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .ticon{font-size:22px}
.tile .ttitle{font-weight:700;font-size:14px}
.tile .tcount{font-size:12px;color:var(--accent);font-weight:700}
.tile .tdesc{font-size:12px;color:var(--muted)}
.setup-sec-title{font-size:16px;font-weight:800;margin:22px 0 4px;display:flex;align-items:center;gap:8px}
/* collapsible setup cards */
#setup_cards .card .section-title{cursor:pointer;user-select:none}
#setup_cards .card .section-title::after{content:"▾";float:right;color:var(--muted);font-size:13px}
#setup_cards .card.collapsed .section-title::after{content:"▸"}
#setup_cards .card.collapsed>:not(.section-title){display:none}
#setup_cards .card.flash{animation:setupflash 2.2s}
@keyframes setupflash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.card-count{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-on{background:#e6f4ea;color:#137333}
.pill-off{background:#fce8e6;color:#a50e0e}
[data-theme="dark"] .pill-on{background:#1e3a2a;color:#7bd88f}
[data-theme="dark"] .pill-off{background:#3d2320;color:#f28b82}
/* guided condition builder */
.cb{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.cb-cap{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.cb-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.cb-row select,.cb-row input{margin:0;flex:1;min-width:0}
.cb-row .cb-x{flex:0 0 auto}
@media(max-width:640px){.cb-row{flex-wrap:wrap}.tile-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{background:var(--input-bg);color:var(--text);width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:14px;cursor:pointer}
.btn:hover{background:var(--blue-dark)}
.btn.secondary{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.btn.secondary:hover{background:rgba(1,118,211,.08)}
.btn.danger{background:var(--danger)}
.btn.small{padding:5px 10px;font-size:12px}
.btnrow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
tr:hover td{background:var(--surface2)}
.section-title{font-size:15px;font-weight:600;margin-bottom:8px}
.field{margin-bottom:10px}.fl{font-size:12px;color:var(--muted)}.fv{font-size:14px}
.muted{color:var(--muted);font-size:13px}
.err{background:var(--err-bg);color:var(--err);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px}
.ok{background:var(--ok-bg);color:var(--ok);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#login .card{width:380px}
.loginbtn{display:block;width:100%;margin:6px 0;text-align:left}
pre{background:#0f2a44;color:#cfe8ff;padding:14px;border-radius:8px;overflow:auto;font-size:13px}
.bar{height:22px;background:linear-gradient(90deg,var(--blue),#4bc076);border-radius:4px;margin:4px 0}
.bar-row{display:grid;grid-template-columns:180px 1fr 120px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
details{margin-top:8px} summary{cursor:pointer;color:var(--blue);font-size:13px}
/* detail tabs */
.dtabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.dtabs button{border:0;background:none;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.dtabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
/* toasts */
#toasts{position:fixed;bottom:24px;right:24px;z-index:1000;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px 16px;box-shadow:var(--shadow);font-size:14px;animation:tin .25s ease}
.toast.ok{border-left-color:#2e9e4f}.toast.error{border-left-color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* skeleton */
.skel{border-radius:8px;background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* command palette */
#palette{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#palette.open{display:flex}
#palette .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(560px,92vw);box-shadow:var(--shadow);overflow:hidden}
#palette input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 18px;font-size:16px}
#palette input:focus{outline:none}
#palresults{max-height:320px;overflow:auto;padding:6px}
.palitem{padding:10px 14px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center}
.palitem.sel{background:rgba(1,118,211,.12)}
.palitem .k{color:var(--muted);font-size:12px;margin-left:auto}
/* assistant chat */
#chatfab{position:fixed;bottom:24px;left:24px;z-index:800;background:var(--blue);color:#fff;border:0;border-radius:50%;width:56px;height:56px;font-size:24px;cursor:pointer;box-shadow:var(--shadow)}
#chatpanel{position:fixed;bottom:92px;left:24px;z-index:800;width:min(380px,92vw);max-height:60vh;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden}
#chatpanel.open{display:flex}
#chatlog{padding:12px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px;min-height:200px}
.msg{padding:8px 12px;border-radius:10px;font-size:13px;max-width:90%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff}
.msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--line)}
#chatpanel .cinput{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
/* dashboard charts */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:700}.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase}
.dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
/* ---- UI batch: flow canvas, dispatch, split view, dashboard builder, lightbox ---- */
.fbwrap{display:grid;grid-template-columns:1fr 350px;gap:16px;align-items:start}
.fbpanel{position:sticky;top:12px;max-height:82vh;overflow:auto}
#lightbox{position:fixed;inset:0;z-index:950;display:flex;align-items:center;justify-content:center;padding:20px}
.lb-back{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.lb-box{position:relative;max-width:min(880px,94vw);max-height:88vh;overflow:auto;padding:22px;margin:0}
.lb-x{position:absolute;top:10px;right:10px}
.split{display:grid;grid-template-columns:minmax(430px,1.35fr) 1fr;gap:16px;align-items:start}
#splitlist tr[data-rid]{cursor:pointer}
#splitlist tr.sel td{background:#e8f3fd}
.dashbuild-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dashw{border:2px dashed var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.dashw.dragging{opacity:.4}
.disp-head{display:grid;grid-template-columns:150px 1fr;color:var(--muted);font-size:12px;margin-bottom:4px}
.disp-scale{position:relative;height:20px}
.disp-row{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--line)}
.disp-lane{position:relative;min-height:46px}
.disp-bar{position:absolute;top:9px;height:28px;border-radius:6px;color:#fff;font-size:12px;line-height:20px;padding:4px 8px;overflow:hidden;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
@media (max-width:900px){.fbwrap,.split,.dashbuild-grid{grid-template-columns:1fr}.fbpanel{position:static;max-height:none}}

/* mobile */
@media (max-width:760px){
  header{padding:10px 14px} header h1{font-size:17px}
  nav{padding:0 10px} nav button{padding:11px 10px;font-size:13px}
  main{padding:12px}
  .grid2{grid-template-columns:1fr}
  .bar-row{grid-template-columns:1fr;gap:2px}
  main table{display:block;overflow-x:auto;white-space:nowrap}
  #toasts{left:16px;right:16px;bottom:16px;max-width:none}
  #chatfab{left:16px;bottom:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-weight:600;color:var(--muted);font-size:12px;padding:4px}
.cal-cell{min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.cal-empty{background:transparent;border:none}
.cal-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal-date{font-weight:600;font-size:13px;margin-bottom:4px}
.cal-chip{background:var(--bg);border-radius:4px;padding:2px 6px;font-size:12px;margin-bottom:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:720px){.cal-grid{grid-template-columns:1fr}.cal-empty{display:none}.cal-cell{min-height:auto}}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h2>⚡ Forcelet</h2>
    <p class="muted">Metadata-driven mini-CRM. Built by Suresh Itha. Demo password for all users: <b>forcelet</b></p>
    <div id="loginbtns"></div>
  </div>
</div>
<div id="app" style="display:none">
  <header>
    <h1>⚡ Forcelet</h1>
    <div class="hgroup">
      <input id="gsearch" placeholder="Search all records…  (⌘K)" onkeydown="if(event.key==='Enter')showSearch()" style="width:200px;margin:0">
      <button class="iconbtn" onclick="openPalette()" title="Command palette (⌘K)">⌘K</button>
      <button class="iconbtn" id="bell" onclick="showNotifications()" title="Notifications">🔔<span id="bellcount" style="display:none"></span></button>
      <button class="iconbtn" onclick="showRecycleBin()" title="Recycle Bin">🗑</button>
      <button class="iconbtn" id="themebtn" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
      <div class="userbox"><span id="whoami"></span><button class="btn secondary small" onclick="totpManage()" title="Two-factor authentication">🔐 2FA</button><button class="btn secondary small" onclick="logout()">Switch user</button></div>
    </div>
  </header>
  <div id="palette"><div class="box"><input id="palinput" placeholder="Type to search records, objects, actions…" autocomplete="off"><div id="palresults"></div></div></div>
  <div id="toasts"></div>
  <button id="chatfab" onclick="toggleChat()" title="Ask Forcelet Assistant">✨</button>
  <div id="chatpanel"><div class="section-title" style="padding:12px 12px 0">✨ Forcelet Assistant <span class="muted">· rule-based demo</span></div><div id="chatlog"></div><div class="cinput"><input id="chatinput" placeholder="Ask about your CRM…" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn small" onclick="sendChat()">Send</button></div></div>
  <nav id="tabs"></nav>
  <main id="main"></main>
  <footer style="text-align:center;color:#999;font-size:12px;padding:16px">Built by Suresh Itha</footer>
</div>
<script>
let token=null, me=null, objects=[], lookups={};
const H=()=>({"Authorization":"Bearer "+token,"Content-Type":"application/json"});
const api=(m,p,b)=>fetch(p,{method:m,headers:H(),body:b?JSON.stringify(b):undefined}).then(async r=>({ok:r.ok,status:r.status,data:await r.json().catch(()=>({}))}));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ------------------------------------------------------- theme + toasts + ui kit
function toggleTheme(){
  const dark=document.documentElement.dataset.theme==="dark";
  document.documentElement.dataset.theme=dark?"":"dark";
  try{localStorage.setItem("forcelet-theme",dark?"light":"dark")}catch(e){}
  document.getElementById("themebtn").textContent=dark?"\uD83C\uDF19":"\u2600\uFE0F";
}
try{if(document.documentElement.dataset.theme==="dark")document.getElementById("themebtn").textContent="\u2600\uFE0F"}catch(e){}
function toast(msg,kind){
  const t=document.createElement("div");t.className="toast "+(kind||"");
  t.textContent=msg;document.getElementById("toasts").appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),320)},3600);
}
function skel(n){n=n||3;let h="";for(let i=0;i<n;i++)h+=`<div class="card"><div class="skel" style="height:18px;width:40%;margin-bottom:10px"></div><div class="skel" style="height:12px;width:90%;margin-bottom:6px"></div><div class="skel" style="height:12px;width:70%"></div></div>`;return h;}

// ------------------------------------------------------- command palette
let palItems=[],palSel=0;
function openPalette(){document.getElementById("palette").classList.add("open");const i=document.getElementById("palinput");i.value="";palSel=0;renderPal("");setTimeout(()=>i.focus(),30);}
function closePalette(){document.getElementById("palette").classList.remove("open");}
function palGo(it){
  closePalette();
  if(it.kind==="obj")showObject(it.name);
  else if(it.kind==="rec")jumpTo(it.obj,it.id);
  else if(it.kind==="act")it.fn();
}
async function renderPal(q){
  q=(q||"").toLowerCase();const items=[];
  const acts=[["Reports",()=>showReports()],["Dashboards",()=>showDashboards()],["Chatter",()=>showChatter()],["Approvals",()=>showApprovals()],["Forecasts",()=>showForecasts()],["Flows",()=>showFlows()],["Recycle Bin",()=>showRecycleBin()],["Admin Setup",()=>showAdmin()],["API docs",()=>window.open("/api/openapi.json","_blank")]];
  for(const [label,fn] of acts)if(label.toLowerCase().includes(q))items.push({kind:"act",label,kind2:"action",fn});
  for(const o of objects)if(o.name.toLowerCase().includes(q)||o.plural.toLowerCase().includes(q))items.push({kind:"obj",name:o.name,label:o.plural,kind2:"object"});
  if(q.length>=2){
    try{const r=await api("GET","/api/search?q="+encodeURIComponent(q));for(const g of (r.data||[]))for(const rec of g.records.slice(0,4))items.push({kind:"rec",obj:g.object,id:rec.Id,label:String(rec.Name||rec.Subject||rec.Title||rec.Id).slice(0,60),kind2:g.label||g.object});}catch(e){}
  }
  palItems=items.slice(0,14);palSel=0;
  document.getElementById("palresults").innerHTML=palItems.map((it,i)=>`<div class="palitem${i===palSel?" sel":""}" data-i="${i}" onclick="palGo(palItems[${i}])">${esc(it.label)}<span class="k">${esc(it.kind2||"")}</span></div>`).join("")||`<div class="palitem">No matches</div>`;
}
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("palette").classList.contains("open")?closePalette():openPalette();}
  if(e.key==="Escape"){closePalette();document.getElementById("chatpanel").classList.remove("open");}
});
document.getElementById("palinput").addEventListener("input",e=>{palSel=0;renderPal(e.target.value);});
document.getElementById("palinput").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(palSel-1,0);}
  else if(e.key==="Enter"){e.preventDefault();if(palItems[palSel])palGo(palItems[palSel]);return;}
  else return;
  document.querySelectorAll(".palitem").forEach((el,i)=>el.classList.toggle("sel",i===palSel));
});
document.getElementById("palette").addEventListener("click",e=>{if(e.target.id==="palette")closePalette();});

// ------------------------------------------------------- assistant chat
function toggleChat(){const p=document.getElementById("chatpanel");p.classList.toggle("open");if(p.classList.contains("open"))setTimeout(()=>document.getElementById("chatinput").focus(),50);}
function chatAdd(text,who){
  const d=document.createElement("div");d.className="msg "+who;
  d.innerHTML=esc(text).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
  const log=document.getElementById("chatlog");log.appendChild(d);log.scrollTop=log.scrollHeight;
}
async function sendChat(){
  const inp=document.getElementById("chatinput");const msg=inp.value.trim();if(!msg)return;
  inp.value="";chatAdd(msg,"me");chatAdd("…","bot");
  const log=document.getElementById("chatlog");
  try{
    const r=await api("POST","/api/assistant",{message:msg});
    log.lastChild.remove();
    chatAdd(r.ok?r.data.reply:"Sorry, something went wrong.","bot");
  }catch(e){log.lastChild.remove();chatAdd("Sorry, something went wrong.","bot");}
}

async function boot(){
  const users=[["admin","Ava Admin — System Administrator"],["maya","Maya Manager — Standard User"],["leo","Leo Rep — Standard User"],["ana","Ana Agent — Read Only"]];
  document.getElementById("loginbtns").innerHTML=users.map(u=>`<button class="btn loginbtn" onclick="login('${u[0]}')">${esc(u[1])}</button>`).join("");
}
async function login(username){
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password:"forcelet"})}).then(r=>r.json());
  if(r.totp_required){ totpChallenge=r.challenge; totpUser=username; showTotpPrompt(); return; }
  if(!r.token){ toast("Login failed","error"); return; }
  finishLogin(r);
}
let totpChallenge=null, totpUser=null;
function showTotpPrompt(){
  document.getElementById("loginbtns").innerHTML=`<div class="card" style="max-width:320px"><div class="section-title">🔐 Two-factor authentication</div>
  <p class="muted">Enter the 6-digit code from your authenticator app for <b>${esc(totpUser)}</b>.</p>
  <input id="totp_code" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;font-size:20px;letter-spacing:6px">
  <div class="btnrow" style="margin-top:10px"><button class="btn" onclick="totpVerify()">Verify</button>
  <button class="btn secondary" onclick="boot()">Back</button></div><div id="totperr"></div></div>`;
  const inp=document.getElementById("totp_code"); inp.focus();
  inp.onkeydown=e=>{ if(e.key==="Enter") totpVerify(); };
}
async function totpVerify(){
  const code=document.getElementById("totp_code").value.trim();
  const r=await fetch("/api/login/totp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({challenge:totpChallenge,code})}).then(r=>r.json());
  if(!r.token){ document.getElementById("totperr").innerHTML=`<div class="err">Invalid code — try again.</div>`; return; }
  finishLogin(r);
}
async function finishLogin(r){
  token=r.token; me=r.user;
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("whoami").textContent=`${me.name} · ${me.profile} · ${me.role||"no role"}`;
  await loadObjects();
  refreshBell();
}
function logout(){ location.reload(); }

async function loadObjects(){
  const r=await api("GET","/api/objects");
  objects=r.data;
  const ap=await api("GET","/api/approvals");
  const pending=(ap.data||[]).length;
  const tabs=document.getElementById("tabs");
  let html=objects.map(o=>`<button data-obj="${o.name}" onclick="showObject('${o.name}')">${esc(o.plural)}${o.is_custom?" ⚙":""}</button>`).join("");
  html+=`<button data-obj="__reports" onclick="showReports()">Reports</button>`;
  html+=`<button data-obj="__dashboards" onclick="showDashboards()">Dashboards</button>`;
  html+=`<button data-obj="__chatter" onclick="showChatter()">Chatter</button>`;
  html+=`<button data-obj="__approvals" onclick="showApprovals()">Approvals${pending?`<span class="badge">${pending}</span>`:""}</button>`;
  html+=`<button data-obj="__forecasts" onclick="showForecasts()">Forecasts</button>`;
  html+=`<button data-obj="__flows" onclick="showFlows()">Flows</button>`;
  html+=`<button data-obj="__dispatch" onclick="showDispatch()">Dispatch</button>`;
  html+=`<button data-obj="__calendar" onclick="showCalendar()">Calendar</button>`;
  if(me.profile==="System Administrator") html+=`<button data-obj="__bulk" onclick="showBulk()">Bulk Jobs</button>`;
  if(me.profile==="System Administrator") html+=`<button data-obj="__admin" onclick="showAdmin()">Admin Setup</button>`;
  tabs.innerHTML=html;
  if(objects.length) showObject(objects[0].name);
}
function setActive(name){ document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.obj===name)); }

let curObj=null, curDesc=null, curLayout=null;
let inlineEdit=false, splitMode=false, splitId=null;
let curViews=[], curView=null, curSort=null, curDir="asc", curSearch="";
async function showObject(name){
  document.getElementById("main").innerHTML=skel(4);
  setActive(name); curObj=name;
  curView=null; curSort=null; curDir="asc"; curSearch=""; curQueue=null;
  splitMode=false; splitId=null;
  const d=await api("GET",`/api/describe/${name}`); curDesc=d.data;
  const l=await api("GET",`/api/layout/${name}`); curLayout=l.data;
  const vw=await api("GET",`/api/list-views/${name}`); curViews=vw.data||[];
  await renderList();
}
function setView(id){
  curView=curViews.find(x=>x.id===id)||null;
  curSort=curView&&curView.sort_by||null; curDir=curView&&curView.sort_dir||"asc";
  renderList();
}
function toggleSort(col){
  if(curSort===col) curDir=curDir==="asc"?"desc":"asc";
  else { curSort=col; curDir="asc"; }
  renderList();
}
async function renderList(){
  let q=`/api/sobjects/${curObj}?`;
  if(curView) q+=`view=${curView.id}&`;
  if(curSort) q+=`sort=${curSort}&dir=${curDir}&`;
  if(curSearch) q+=`search=${encodeURIComponent(curSearch)}&`;
  if(curObj==="Case"&&!caseQueues.length){ const qr=await api("GET","/api/case-queues"); caseQueues=qr.ok&&Array.isArray(qr.data)?qr.data:[]; }
  let rows;
  if(curObj==="Case"&&curQueue){ const qr=await api("GET",`/api/case-queues/${curQueue}/cases`); rows=qr.ok&&Array.isArray(qr.data)?qr.data:[]; }
  else{ const r=await api("GET",q); rows=r.data||[]; }
  let cols;
  if(curView&&curView.columns&&curView.columns.length){
    const fmap={}; curDesc.fields.forEach(f=>fmap[f.name]=f);
    cols=curView.columns.map(n=>fmap[n]).filter(Boolean);
  }
  if(!cols||!cols.length) cols=curDesc.fields.slice(0,6);
  const arrow=c=>curSort===c?(curDir==="asc"?" ▲":" ▼"):"";
  let html=`<div class="btnrow"><h2 style="margin:0">${esc(curDesc.plural)}</h2><span style="flex:1"></span>`;
  html+=`<input id="lsearch" placeholder="Search records..." value="${esc(curSearch)}" style="max-width:170px" onkeydown="if(event.key==='Enter'){curSearch=this.value;renderList();}">`;
  html+=`<select id="lview" onchange="setView(this.value)" style="max-width:200px"><option value="">— All records —</option>${curViews.map(vw=>`<option value="${vw.id}" ${curView&&curView.id===vw.id?"selected":""}>${esc(vw.name)}${vw.shared?" 🌐":""}</option>`).join("")}</select>`;
  html+=`<button class="btn secondary small" onclick="document.getElementById('saveview').style.display='flex'">Save view</button>`;
  html+=`<button class="btn secondary small" onclick="showKanban()">Kanban</button>`;
  html+=`<button class="btn secondary small" onclick="exportCsv()">Export CSV</button>`;
  html+=`<button class="btn secondary small" onclick="toggleSplit()">${splitMode?"☰ List view":"◫ Split view"}</button>`;
  if(curDesc.permissions.edit) html+=`<button class="btn secondary small" onclick="inlineEdit=!inlineEdit;renderList()">${inlineEdit?"✓ Inline edit":"✏️ Inline edit"}</button>`;
  if(curDesc.permissions.create) html+=`<button class="btn" onclick="showForm()">+ New ${esc(curDesc.label)}</button>`;
  html+=`</div>`;
  if(curObj==="Case"&&caseQueues.length){
    html+=`<div class="btnrow" style="margin-top:8px"><span class="muted">Queues:</span>`
      +`<button class="btn ${curQueue?"secondary":""} small" onclick="curQueue=null;renderList()">All cases</button>`
      +caseQueues.filter(x=>x.active!==false).map(x=>`<button class="btn ${curQueue===x.id?"":"secondary"} small" onclick="curQueue='${x.id}';renderList()">${esc(x.name)}</button>`).join("")
      +(me.profile==="System Administrator"?`<button class="btn secondary small" onclick="showQueueAdmin()">Manage</button>`:"")
      +`</div>`;
  }
  html+=`<div class="btnrow" id="saveview" style="display:none"><input id="sv_name" placeholder="View name" style="max-width:220px">`;
  if(me.profile==="System Administrator") html+=`<label style="margin:0"><input type="checkbox" id="sv_shared" style="width:auto"> Shared</label>`;
  html+=`<button class="btn small" onclick="saveView()">Save</button></div>`;
  const listCard=`<div class="card"${splitMode?` id="splitlist" style="margin:0"`:``}><table><tr>${cols.map(c=>`<th onclick="toggleSort('${c.name}')" style="cursor:pointer;user-select:none">${esc(c.label)}${arrow(c.name)}</th>`).join("")}<th></th></tr>`+
  rows.map(row=>`<tr${splitMode?` data-rid="${row.Id}" onclick="splitSelect('${row.Id}')" class="${splitId===row.Id?"sel":""}`:""}>${cols.map(c=>`<td>${inlineEdit&&canInline(c)?inlineCell(c,row):esc(fmtVal(c,row[c.name]))}</td>`).join("")}<td><button class="btn secondary small" onclick="event.stopPropagation();${splitMode?`splitSelect('${row.Id}')`:`showDetail('${row.Id}')`}">${splitMode?"Preview":"Open"}</button></td></tr>`).join("")+
  `</table>${rows.length?"":'<p class="muted">No records match. Sharing rules may be hiding records owned by others.</p>'}</div>`;
  html+=splitMode?`<div class="split">${listCard}<div id="splitdetail"><div class="card"><p class="muted">Select a record to preview it here.</p></div></div></div>`:listCard;
  document.getElementById("main").innerHTML=html;
  if(splitMode&&splitId) splitSelect(splitId);
}
async function saveView(){
  const name=v("sv_name");
  if(!name){ toast("Give the view a name.","info"); return; }
  const shared=document.getElementById("sv_shared")?document.getElementById("sv_shared").checked:false;
  const cols=curView&&curView.columns&&curView.columns.length?curView.columns:curDesc.fields.slice(0,6).map(c=>c.name);
  const r=await api("POST","/api/list-views",{object:curObj,name,columns:cols,filters:curView?curView.filters||{}:{},sort_by:curSort,sort_dir:curDir,shared});
  if(!r.ok){ toast("Save failed: "+(r.data.error||r.status),"error"); return; }
  const vw=await api("GET",`/api/list-views/${curObj}`); curViews=vw.data||[];
  curView=curViews.find(x=>x.id===r.data.id)||null;
  renderList();
}
function exportCsv(){ window.open(`/api/sobjects/${curObj}/export`,"_blank"); }
let curKanbanField=null;
let caseQueues=[], curQueue=null;
async function showKanban(){
  setActive(curObj);
  const r=await api("GET",`/api/kanban/${curObj}`);
  if(!r.ok){ toast("Kanban unavailable: "+(r.data.error||r.status),"error"); return; }
  const k=r.data; curKanbanField=k.group_by;
  let html=`<div class="btnrow"><h2 style="margin:0">${esc(curDesc.plural)} — Kanban by ${esc(k.group_label)}</h2><span style="flex:1"></span><button class="btn secondary" onclick="showObject(curObj)">List view</button></div>`;
  html+=`<div style="display:flex;gap:12px;overflow-x:auto;align-items:flex-start">`;
  for(const col of k.columns){
    html+=`<div class="card" style="min-width:240px;flex:1;margin:0"><div class="section-title">${esc(col.value||"(blank)")} (${col.records.length})</div>`;
    for(const rec of col.records.slice(0,20)){
      const nm=rec.Name||rec.Subject||rec.Id;
      html+=`<div style="border:1px solid #eee;border-radius:6px;padding:8px;margin-bottom:8px"><div><a href="#" onclick="showDetail('${rec.Id}');return false"><b>${esc(nm)}</b></a></div><select onchange="kanbanMove('${rec.Id}',this.value)" style="margin-top:6px"><option value="">Move to…</option>${k.columns.map(c=>c.value?`<option value="${esc(c.value)}">${esc(c.value)}</option>`:"").join("")}</select></div>`;
    }
    if(col.records.length>20) html+=`<p class="muted">+${col.records.length-20} more</p>`;
    html+=`</div>`;
  }
  html+=`</div>`;
  document.getElementById("main").innerHTML=html;
}
async function kanbanMove(id,value){
  if(!value||!curKanbanField) return;
  const u=await api("PATCH",`/api/sobjects/${curObj}/${id}`,{[curKanbanField]:value});
  u.ok?showKanban():toast("Move failed: "+(u.data.error||u.status),"error");
}
function fmtVal(f,v){ if(v==null||v==="")return"—"; if(f.type==="Checkbox")return v?"✓":"—"; if(f.type==="Date"&&String(v).length>10)return String(v).slice(0,10); if(typeof v==="number")return Math.round(v*100)/100; return v; }

async function showSearch(){
  const q=document.getElementById("gsearch").value.trim();
  if(!q) return;
  setActive(null);
  const r=await api("GET","/api/search?q="+encodeURIComponent(q));
  const groups=r.data||[];
  let html=`<h2>Search results for "${esc(q)}"</h2>`;
  if(!groups.length) html+=`<p class="muted">No matches.</p>`;
  for(const g of groups){
    html+=`<div class="card"><div class="section-title">${esc(g.label)} (${g.records.length})</div><table>`;
    for(const rec of g.records){
      const nm=rec.Name||rec.Subject||rec.Id;
      html+=`<tr><td>${esc(String(nm)).slice(0,80)}</td><td><button class="btn secondary small" onclick="jumpTo('${g.object}','${rec.Id}')">Open</button></td></tr>`;
    }
    html+=`</table></div>`;
  }
  document.getElementById("main").innerHTML=html;
}
async function showDetail(id){
  document.getElementById("main").innerHTML=skel(4);
  const r=await api("GET",`/api/sobjects/${curObj}/${id}`);
  if(!r.ok){ document.getElementById("main").innerHTML=`<div class="err">Record not found.</div>`; return; }
  const rec=r.data, fmap={}; curDesc.fields.forEach(f=>fmap[f.name]=f);
  let html=`<div class="btnrow"><button class="btn secondary" onclick="showObject('${curObj}')">\u2190 Back</button><span style="flex:1"></span>`;
  html+=`<button class="btn secondary" onclick="submitApproval('${rec.Id}')">Submit for Approval</button>`;
  if(curObj==="Lead"&&rec.Status!=="Converted") html+=`<button class="btn" onclick="convertLead('${rec.Id}')">Convert</button>`;
  if(curDesc.permissions.edit) html+=`<button class="btn" onclick="showForm('${rec.Id}')">Edit</button>`;
  if(curDesc.permissions.edit) html+=`<button class="btn secondary" onclick="findDuplicates('${curObj}','${rec.Id}')">Find duplicates</button>`;
  if(curDesc.permissions.delete) html+=`<button class="btn danger" onclick="delRec('${rec.Id}')">Delete</button>`;
  if(curObj==="Quote") html+=`<button class="btn secondary" onclick="dlQuotePdf('${rec.Id}')">⬇ PDF</button>`;
  html+=`</div>`;
  const tabs=[["details","Details"],["related","Related"],["activity","Activity"],["chatter","Chatter"],["files","Files"],["history","History"]];
  html+=`<div class="dtabs">${tabs.map((t,i)=>`<button data-t="${t[0]}" class="${i===0?"active":""}" onclick="detailTab('${t[0]}')">${t[1]}</button>`).join("")}</div>`;
  // details panel
  let details="";
  const sections=(curLayout.sections&&curLayout.sections.length)?curLayout.sections:[{title:"Details",columns:[curDesc.fields.map(f=>f.name)]}];
  for(const sec of sections){
    details+=`<div class="card"><div class="section-title">${esc(sec.title)}</div><div class="grid2">`;
    for(const col of sec.columns){ details+=`<div>${col.map(fn=>{const f=fmap[fn]; if(!f)return"";return `<div class="field"><div class="fl">${esc(f.label)}${f.computed?" <span class='muted'>(computed)</span>":""}</div><div class="fv">${esc(fmtVal(f,rec[fn]))}</div></div>`;}).join("")}</div>`; }
    details+=`</div></div>`;
  }
  details+=await pathBar(rec);
  if(curObj==="Lead") details+=await scoreCard(rec.Id);
  if(curObj==="Quote") details+=await quoteLinesCard(rec.Id);
  if(curObj==="Case") details+=await milestonesCard(rec.Id);
  if(curObj==="Case") details+=await macroBar(rec.Id);
  details+=`<div class="card"><div class="section-title">System</div><p class="muted">Id ${esc(rec.Id)} \u00b7 Record type ${esc(rec.RecordType)} \u00b7 Owner ${esc(rec.OwnerId)} \u00b7 Created ${esc(rec.CreatedDate||"")}</p></div>`;
  // other panels
  const related=await relatedLists(rec.Id);
  const activity=await activityCard(rec.Id);
  const chatter=await chatterCard(rec.Id);
  const files=await filesCard(rec.Id);
  const h=await api("GET",`/api/sobjects/${curObj}/${id}/history`);
  let history=`<div class="card"><div class="section-title">Field History</div>`;
  if(!(h.data||[]).length) history+=`<p class="muted">No changes recorded yet.</p>`;
  else history+=`<table><tr><th>When</th><th>Who</th><th>Field</th><th>Old</th><th>New</th></tr>${h.data.filter(x=>x.field_name!=="__flow__").slice(0,20).map(x=>`<tr><td>${esc((x.changed_at||"").slice(0,19).replace("T"," "))}</td><td>${esc(x.changed_by_name)}</td><td>${esc(x.field_name)}</td><td>${esc(x.old_value??"\u2014")}</td><td>${esc(x.new_value??"\u2014")}</td></tr>`).join("")}</table>`;
  history+=`</div>`;
  html+=`<div id="dtab-details">${details}</div><div id="dtab-related" style="display:none">${related}</div><div id="dtab-activity" style="display:none">${activity}</div><div id="dtab-chatter" style="display:none">${chatter}</div><div id="dtab-files" style="display:none">${files}</div><div id="dtab-history" style="display:none">${history}</div>`;
  html+=`<div id="dupzone"></div>`;
  document.getElementById("main").innerHTML=html;
}
function detailTab(name){
  document.querySelectorAll(".dtabs button").forEach(b=>b.classList.toggle("active",b.dataset.t===name));
  for(const t of ["details","related","activity","chatter","files","history"]){
    const el=document.getElementById("dtab-"+t); if(el) el.style.display=(t===name?"":"none");
  }
}
async function findDuplicates(obj,id){
  const z=document.getElementById("dupzone");
  z.innerHTML=`<div class="card"><p class="muted">Checking for duplicates…</p></div>`;
  const r=await api("GET",`/api/sobjects/${obj}/${id}/duplicates`);
  if(!r.ok){ z.innerHTML=`<div class="err">Failed.</div>`; return; }
  const dups=r.data||[];
  if(!dups.length){ z.innerHTML=`<div class="ok">No duplicates found.</div>`; return; }
  z.innerHTML=`<div class="card"><div class="section-title">Possible duplicates (${dups.length})</div>
    <p class="muted">Select records to merge into this one. Field values below win on conflict; related records are re-parented; merged records go to the Recycle Bin.</p>
    ${dups.map(d=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="duppick" value="${d.Id}" style="width:auto"> <b>${esc(d.Name||d.Subject||d.Id)}</b> <span class="muted">${esc(d.Id)}</span></label>`).join("")}
    <div class="btnrow" style="margin-top:10px"><button class="btn" onclick="mergeSelected('${obj}','${id}')">Merge selected</button></div></div>`;
}
async function mergeSelected(obj,id){
  const ids=[...document.querySelectorAll(".duppick:checked")].map(c=>c.value);
  if(!ids.length){ toast("Select at least one duplicate.","info"); return; }
  if(!confirm(`Merge ${ids.length} record(s) into this one?`)) return;
  const r=await api("POST",`/api/sobjects/${obj}/${id}/merge`,{merge_ids:ids});
  if(r.ok){ toast(`Merged ${r.data.merged_ids.length} record(s); ${r.data.reparented} related record(s) re-parented.`,"ok"); showDetail(id); }
  else toast("Merge failed: "+(r.data.error||r.status),"error");
}
async function submitApproval(id){ const r=await api("POST",`/api/sobjects/${curObj}/${id}/submit-approval`); r.ok?showApprovals():toast("Submit failed: "+(r.data.error||r.status),"error"); }
async function convertLead(id){
  if(!confirm("Convert this lead into an Account, Contact, and Opportunity?")) return;
  const r=await api("POST",`/api/sobjects/Lead/${id}/convert`,{});
  if(!r.ok){ toast("Convert failed: "+(r.data.error||r.status),"error"); return; }
  toast("Converted — Account, Contact, and Opportunity were created.","ok");
  showDetail(id);
}
async function pathBar(rec){
  const r=await api("GET",`/api/paths/${curObj}`);
  const path=r.data;
  if(!path||!path.field) return "";
  const f=curDesc.fields.find(x=>x.name===path.field);
  if(!f||!(f.picklist_values||[]).length) return "";
  const values=f.picklist_values, cur=rec[path.field], idx=values.indexOf(cur);
  let html=`<div class="card"><div class="section-title">Path: ${esc(f.label)}</div><div class="btnrow" style="gap:0;flex-wrap:wrap">`;
  values.forEach((v,i)=>{
    const active=i===idx;
    html+=`<button class="btn ${active?"":"secondary"} small" style="${active?"background:#2f80ed;color:#fff;border-color:#2f80ed;":""}border-radius:0" onclick="pathSet('${rec.Id}','${path.field}',this.dataset.v)" data-v="${esc(v)}">${i<idx?"✓ ":""}${esc(v)}</button>`;
  });
  html+=`</div>`;
  const g=(path.guidance||{})[cur];
  if(g) html+=`<p style="margin:10px 0 0"><b>Guidance:</b> ${esc(g)}</p>`;
  return html+`</div>`;
}
async function pathSet(id,field,value){
  const r=await api("PATCH",`/api/sobjects/${curObj}/${id}`,{[field]:value});
  r.ok?showDetail(id):toast("Failed: "+(r.data.error||r.status),"error");
}
let descCache={};
async function getDesc(name){ if(!descCache[name]){ const r=await api("GET",`/api/describe/${name}`); descCache[name]=r.data; } return descCache[name]; }
function jumpTo(obj,id){ showObject(obj).then(()=>showDetail(id)); }
async function activityCard(recId){
  const r=await api("GET",`/api/sobjects/${curObj}/${recId}/activities`);
  const items=r.data||[];
  let html=`<div class="card"><div class="section-title">Activity</div>`;
  html+=`<div class="grid2"><div><label>Type</label><select id="ac_type"><option value="note">Note</option><option value="call">Call</option><option value="task">Task</option></select></div><div><label>Subject</label><input id="ac_subj"></div></div><label>Details</label><textarea id="ac_body" rows="2"></textarea><div class="btnrow" style="margin-top:8px"><button class="btn" onclick="addActivity('${recId}')">Log activity</button><button class="btn secondary" onclick="showEmailForm('${recId}')">Send email</button></div><div id="emailform"></div>`;
  if(!items.length) html+=`<p class="muted">No activity yet.</p>`;
  else html+=items.map(a=>`<div class="field"><div class="fl">${esc(a.activity_type.toUpperCase())} · ${esc(a.created_by_name)} · ${esc((a.created_at||"").slice(0,16).replace("T"," "))}</div><div class="fv"><b>${esc(a.subject)}</b>${a.body?`<br>${esc(a.body)}`:""}</div></div>`).join("");
  return html+`</div>`;
}
async function addActivity(recId){
  const r=await api("POST",`/api/sobjects/${curObj}/${recId}/activities`,{type:document.getElementById("ac_type").value,subject:v("ac_subj"),body:v("ac_body")});
  r.ok?showDetail(recId):toast("Failed: "+(r.data.error||r.status),"error");
}
async function showEmailForm(recId){
  const t=await api("GET","/api/email-templates");

async function showForm(id){
  let rec={};
  if(id){ const r=await api("GET",`/api/sobjects/${curObj}/${id}`); rec=r.data; }
  const rtSel=(curDesc.record_types||[]).length>1?`<label>Record type</label><select id="f_RecordType">${curDesc.record_types.map(rt=>`<option value="${esc(rt.name)}" ${rt.name===(rec.RecordType||curDesc.default_record_type)?"selected":""}>${esc(rt.label)}</option>`).join("")}</select>`:"";
  const fields=curDesc.fields.filter(f=>id?f.editable:true);
  let html=`<div class="card"><h2>${id?"Edit":"New"} ${esc(curDesc.label)}</h2><div id="ferr"></div>${rtSel}`;
  for(const f of fields){
    if((!id&&!f.editable)||f.computed) continue;
    html+=`<label>${esc(f.label)}${f.required?' <b style="color:#c0392b">*</b>':""}</label>`;
    const val=rec[f.name]??"";
    if(f.type==="Picklist") html+=`<select id="f_${f.name}"><option value="">—</option>${(f.picklist_values||[]).map(v=>`<option ${v===val?"selected":""}>${esc(v)}</option>`).join("")}</select>`;
    else if(f.type==="MultiPicklist") html+=`<select id="f_${f.name}" multiple size="4">${(f.picklist_values||[]).map(v=>`<option ${String(val).split(";").includes(v)?"selected":""}>${esc(v)}</option>`).join("")}</select>`;
    else if(f.type==="Checkbox") html+=`<input type="checkbox" id="f_${f.name}" ${val?"checked":""} style="width:auto">`;
    else if(f.type==="TextArea") html+=`<textarea id="f_${f.name}" rows="3">${esc(val)}</textarea>`;
    else if(f.type==="Lookup"){ const opts=await lookupOptions(f.reference_to); html+=`<select id="f_${f.name}"><option value="">—</option>${opts.map(o=>`<option value="${o.id}" ${o.id===val?"selected":""}>${esc(o.label)}</option>`).join("")}</select>`; }
    else html+=`<input id="f_${f.name}" type="${f.type==="Date"?"date":f.type==="Email"?"email":f.type==="URL"?"url":"text"}" value="${esc(val)}">`;
  }
  html+=`<div class="btnrow" style="margin-top:14px"><button class="btn" onclick="saveForm('${id||""}')">Save</button><button class="btn secondary" onclick="showObject('${curObj}')">Cancel</button></div></div>`;
  document.getElementById("main").innerHTML=html;
}
async function saveForm(id){
  const body={};
  const rtEl=document.getElementById("f_RecordType"); if(rtEl) body.RecordType=rtEl.value;
  for(const f of curDesc.fields){
    const el=document.getElementById("f_"+f.name); if(!el) continue;
    if(f.type==="Checkbox") body[f.name]=el.checked;
    else if(f.type==="MultiPicklist") body[f.name]=[...el.selectedOptions].map(o=>o.value).join(";");
    else if(el.value!=="") body[f.name]=el.value;
  }
  const r=await api(id?"PATCH":"POST",`/api/sobjects/${curObj}${id?"/"+id:""}`,body);
  if(r.ok){ showObject(curObj); }
  else {
    let msg=r.data.error||"Save failed";
    if(r.data.details) msg+=": "+r.data.details.join("; ");
    if(r.data.duplicates) msg+=" (duplicates: "+r.data.duplicates.map(d=>d.record_id).join(", ")+")";
    document.getElementById("ferr").innerHTML=`<div class="err">${esc(msg)}</div>`;
  }
}

async function runReport(id){
  const el=document.getElementById("rep_"+id);
  el.innerHTML=`<p class="muted">Running…</p>`;
  const r=await api("GET",`/api/reports/${id}/run`);
  if(!r.ok){ el.innerHTML=`<div class="err">Failed.</div>`; return; }
  const d=r.data; let html=`<p class="muted">${d.row_count} row(s)</p>`;
  if(d.groups&&d.groups.length){
    const max=Math.max(...d.groups.map(g=>g.count));
    html+=d.groups.map(g=>`<div class="bar-row"><span>${esc(g.key)}</span><div class="bar" style="width:${Math.round(g.count/max*100)}%"></div><span>${g.count}${g.aggregate!=null?" · Σ "+Math.round(g.aggregate*100)/100:""}</span></div>`).join("");
  }
  const cols=d.columns.length?d.columns:Object.keys(d.rows[0]||{}).slice(0,8);
  if(d.rows.length) html+=`<table style="margin-top:10px"><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${d.rows.slice(0,25).map(row=>`<tr>${cols.map(c=>`<td>${esc(row[c]??"—")}</td>`).join("")}</tr>`).join("")}</table>`;
  el.innerHTML=html;
}
async function createReport(){
  const agg=document.getElementById("nr_agg").value.trim();
  let filters={}; try{ const f=document.getElementById("nr_filter").value.trim(); if(f) filters=JSON.parse(f); }catch(e){ document.getElementById("rerr").innerHTML=`<div class="err">Filter is not valid JSON.</div>`; return; }
  const body={name:document.getElementById("nr_name").value, object:document.getElementById("nr_obj").value,
    columns:document.getElementById("nr_cols").value.split(",").map(s=>s.trim()).filter(Boolean),
    filters, active:true};
  const g=document.getElementById("nr_group").value.trim(); if(g) body.group_by=g;
  if(agg){ const [func,field]=agg.split(":"); body.aggregate={func:func.trim(),field:(field||"").trim()}; }
  const r=await api("POST","/api/admin/reports",body);
  r.ok?showReports():document.getElementById("rerr").innerHTML=`<div class="err">${esc(r.data.error||"Failed")}</div>`;
}

function svgBars(groups){
  const max=Math.max(1,...groups.map(g=>g.count));
  const W=340,H=180,pad=30,n=Math.min(groups.length,12);
  const bw=Math.min(44,(W-pad*2)/n-10);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">`;
  groups.slice(0,12).forEach((g,i)=>{
    const h=Math.max(4,(H-64)*g.count/max);
    const x=pad+i*((W-pad*2)/n), y=H-32-h;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3" fill="#0176d3"><title>${esc(g.key)}: ${g.count}</title></rect>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-16}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".65">${esc(String(g.key)).slice(0,12)}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".65">${g.count}</text>`;
  });
  return s+"</svg>";
}
function svgDonut(groups){
  const tot=groups.reduce((a,g)=>a+g.count,0)||1;
  const cols=["#0176d3","#2e9e4f","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899","#84cc16"];
  let s=`<svg viewBox="0 0 200 200" style="width:190px;height:auto;display:block;margin:0 auto" role="img">`;
  let ang=-90;const R=78,CX=100,CY=100;
  groups.slice(0,8).forEach((g,i)=>{
    const frac=g.count/tot,a2=ang+frac*360,big=frac>0.5?1:0;
    const x1=CX+R*Math.cos(ang*Math.PI/180),y1=CY+R*Math.sin(ang*Math.PI/180);
    const x2=CX+R*Math.cos(a2*Math.PI/180),y2=CY+R*Math.sin(a2*Math.PI/180);
    s+=`<path d="M${CX},${CY} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${big} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${cols[i%cols.length]}" opacity=".92"><title>${esc(g.key)}: ${g.count}</title></path>`;
    ang=a2;
  });
  s+=`<circle cx="${CX}" cy="${CY}" r="44" fill="var(--surface)"/><text x="${CX}" y="${CY+7}" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">${tot}</text></svg>`;
  s+=`<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px">`+groups.slice(0,8).map((g,i)=>`<span class="muted" style="font-size:12px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cols[i%cols.length]}"></span> ${esc(String(g.key)).slice(0,14)} (${g.count})</span>`).join("")+`</div>`;
  return s;
}

  const rows=r.data.rows||[];

  let html=`<div class="btnrow"><h2 style="margin:0">Forecasts</h2><span style="flex:1"></span><label style="margin:0">Period</label><input id="fc_per" type="month" value="${fcPeriod}" style="width:auto"><button class="btn secondary small" onclick="fcPeriod=v('fc_per');showForecasts()">Go</button></div>`;

  html+=rows.map(x=>{

function flowFieldHtml(f){
  const req=f.required?` <span style="color:#c0392b">*</span>`:"";
  const id=`flw_${f.name}`;
  let input="";
  if(f.type==="textarea") input=`<textarea id="${id}" rows="3"></textarea>`;
  else if(f.type==="picklist") input=`<select id="${id}"><option value="">— select —</option>${(f.picklist_values||[]).map(p=>`<option>${esc(p)}</option>`).join("")}</select>`;
  else if(f.type==="checkbox") input=`<input id="${id}" type="checkbox" style="width:auto">`;
  else if(f.type==="number") input=`<input id="${id}" type="number">`;
  else if(f.type==="date") input=`<input id="${id}" type="date">`;
  else if(f.type==="email") input=`<input id="${id}" type="email">`;
  else input=`<input id="${id}" type="text">`;
  return `<label>${esc(f.label||f.name)}${req}</label>${input}`;
}
function renderFlowScreen(runId, screen, total, step){
  const el=document.getElementById("flowrun");
  if(!screen){ el.innerHTML=""; return; }
  el.innerHTML=`<div class="card"><div class="section-title">${esc(screen.title)} <span class="muted">(step ${step} of ${total})</span></div><div id="flwerr"></div>`
    +screen.fields.map(flowFieldHtml).join("")
    +`<div class="btnrow" style="margin-top:12px"><button class="btn secondary" onclick="showFlows()">Cancel</button><button class="btn" onclick="flowNext('${runId}',${step},${total})">${step>=total?"Finish":"Next"}</button></div></div>`;
  window.scrollTo(0,0);
}
async function flowNext(runId, step, total){
  const r0=await api("GET",`/api/screen-flows/runs/${runId}`);
  const screen=(r0.data||{}).screen;
  const values={};
  (screen.fields||[]).forEach(f=>{
    const el=document.getElementById(`flw_${f.name}`);
    values[f.name]=f.type==="checkbox"?el.checked:el.value;
  });
  const r=await api("POST",`/api/screen-flows/runs/${runId}/next`,{values});
  if(!r.ok){
    const errs=(r.data.errors||[r.data.error||"Validation failed"]);
    document.getElementById("flwerr").innerHTML=`<div class="err">${errs.map(esc).join("<br>")}</div>`;
    return;
  }
  if(r.data.status==="completed"){
    const made=(r.data.result.created||[]).map(c=>`${esc(c.object)} <a href="#" onclick="jumpTo('${c.object}','${c.id}');return false">${esc(c.id.slice(0,8))}…</a>`).join(", ");
    document.getElementById("flowrun").innerHTML=`<div class="ok">Done!${made?` Created: ${made}.`:""}</div>`;
  } else {
    renderFlowScreen(runId, r.data.screen, total, step+1);
  }
}

async function renderSetupHome(){
  let html=`<h2>Admin Setup</h2>
  <div class="setup-search"><input id="setup_home_q" placeholder="🔍 Quick find — type a setting name…" oninput="filterHomeTiles(this.value)"></div>`;
  for(const sec of SETUP_SECTIONS){
    html+=`<div class="setup-sec"><div class="setup-sec-head"><span class="ticon">${sec.icon}</span><div><b style="font-size:15px">${sec.title}</b><div class="muted" style="font-size:12px">${sec.desc}</div></div></div><div class="tile-grid">`;
    html+=SETUP_TILES.filter(t=>t.section===sec.id).map(t=>`<button class="tile" data-tile="${esc(t.card.toLowerCase())}" onclick="showAdmin('${t.section}','${t.card.replace(/'/g,"\\'")}')"><span class="ticon">${t.icon}</span><span class="ttitle">${esc(t.card)}</span><span class="tcount" data-tile-count="${esc(t.card)}"></span><span class="tdesc">${esc(t.desc)}</span></button>`).join("");
    html+=`</div></div>`;
  }
  document.getElementById("main").innerHTML=html;
  // live counts, in parallel
  await Promise.all(SETUP_TILES.map(async t=>{
    try{
      let n=null;
      if(t.kind){ const r=await api("GET","/api/admin/"+t.kind); let rows=Array.isArray(r.data)?r.data:[];
        if(t.flowFilter==="screen") rows=rows.filter(x=>x.flow_type==="screen");
        if(t.flowFilter==="record") rows=rows.filter(x=>!x.flow_type||x.flow_type==="record");
        n=rows.length; }
      else if(t.url){ const r=await api("GET",t.url); const d=r.data; n=Array.isArray(d)?d.length:(d&&d.length)||null; }
      const el=document.querySelector(`[data-tile-count="${CSS.escape(t.card)}"]`);
      if(el) el.textContent=(n===null||n===undefined)?"":`${n} configured`;
    }catch(e){}
  }));
  const q=document.getElementById("setup_home_q"); if(q) q.focus();
}
function filterHomeTiles(q){
  q=q.toLowerCase();
  document.querySelectorAll(".tile").forEach(t=>{ t.style.display=t.dataset.tile.includes(q)?"":"none"; });
  document.querySelectorAll(".setup-sec").forEach(s=>{ s.style.display=[...s.querySelectorAll(".tile")].some(t=>t.style.display!=="none")?"":"none"; });
}
function setupAfterRender(section, highlight){
  const main=document.getElementById("main");
  const sec=SETUP_SECTIONS.find(s=>s.id===section)||SETUP_SECTIONS[0];
  const cards=[...main.querySelectorAll(":scope > .card")];
  main.insertAdjacentHTML("afterbegin",
   `<div class="setup-breadcrumb"><a onclick="showAdmin()">← Setup Home</a><span>›</span><b>${sec.icon} ${sec.title}</b></div>
    <div class="setup-nav">${SETUP_SECTIONS.map(s=>`<button class="${s.id===sec.id?"on":""}" onclick="showAdmin('${s.id}')">${s.icon} ${s.title}</button>`).join("")}</div>
    <div class="setup-search"><input id="setup_q" placeholder="🔍 Filter settings in ${esc(sec.title)}…" oninput="filterSetupCards(this.value)"></div>
    <div id="setup_cards"></div>`);
  const host=document.getElementById("setup_cards");
  for(const card of cards){
    const titleEl=card.querySelector(":scope > .section-title");
    const title=titleEl?titleEl.textContent.trim():"";
    if(CARD_SECTION[title]===sec.id){ host.appendChild(card); enhanceSetupCard(card,title); }
    else card.remove();
  }
  // collapsible cards
  host.querySelectorAll(":scope > .card > .section-title").forEach(t=>{ t.onclick=()=>t.parentElement.classList.toggle("collapsed"); });
  // lists + builders for the visible section
  if(sec.id==="automation"){ listAutoResponses(); }
  if(sec.id==="datamodel"){ listPaths(); }
  for(const [kind,cfg] of Object.entries(SETUP_KINDS)){ if(cfg.cardSection===sec.id) refreshSetupList(kind); }

function setupErr(kind,msg){ const el=document.getElementById(SETUP_KINDS[kind].errEl); if(el) el.innerHTML=msg?`<div class="err">${esc(msg)}</div>`:""; }
function collectSetupForm(kind){
  const cfg=SETUP_KINDS[kind], body={...(cfg.constFields||{})};
  for(const [key,id,how,extra] of cfg.fields){
    if(how==="const"){ body[key]=extra; continue; }
    const el=document.getElementById(id);
    if(how==="check"){ body[key]=el.checked; continue; }
    const raw=v(id);
    if(how==="json"){ if(!raw){ body[key]=extra; continue; } try{ body[key]=JSON.parse(raw); }catch(e){ setupErr(kind,`${key} is not valid JSON.`); return null; } continue; }
    if(how==="csv"){ body[key]=raw.split(",").map(s=>s.trim()).filter(Boolean); continue; }
    if(how==="int"){ body[key]=parseInt(raw||extra||"0",10); continue; }
    if(how==="blankstar"){ body[key]=raw||"*"; continue; }
    body[key]=raw;
  }
  if(!body.name){ setupErr(kind,"Name is required."); return null; }
  return body;
}
function fillSetupForm(kind,row){
  const cfg=SETUP_KINDS[kind];
  for(const [key,id,how] of cfg.fields){
    if(how==="const") continue;
    const el=document.getElementById(id); if(!el) continue;
    const val=row[key];
    if(how==="check"){ el.checked=!!val; continue; }
    if(how==="json"){ el.value=val==null?"":JSON.stringify(val,null,2); continue; }
    if(how==="csv"){ el.value=(val||[]).join(", "); continue; }
    el.value=val==null?"":val;
  }
}
async function submitSetupForm(kind){
  const cfg=SETUP_KINDS[kind], apiKind=cfg.apiKind||kind;
  setupErr(kind,null);
  const body=collectSetupForm(kind); if(!body) return;
  let r;
  if(SETUP_EDIT.kind===kind&&SETUP_EDIT.rid){ r=await api("PATCH",`/api/admin/${apiKind}/${SETUP_EDIT.rid}`,body); }
  else{ r=await api("POST","/api/admin/"+apiKind,body); }
  if(r.ok){ toast(SETUP_EDIT.kind===kind?"Saved.":"Created.","ok"); cancelSetupEdit(kind,true); refreshSetupList(kind); }
  else setupErr(kind,r.data&&r.data.error||"Failed");
}
function editSetupRow(kind,rid){

const CB_OPS=[["==","equals"],["!=","not equals"],[">","greater than"],["<","less than"],[">=","> or equal"],["<=","< or equal"],["contains","contains"],["starts_with","starts with"],["isblank","is blank"],["notblank","is not blank"]];
const CB_STATE={};
const COND_BUILDERS=[
 {id:"cb_vr",section:"automation",objSel:"vr_obj",target:"vr_cond"},

 {id:"cb_sr",section:"automation",objSel:"sr_obj",target:"sr_crit"},
 {id:"cb_esc",section:"automation",objSel:"esc_obj",target:"esc_crit"},
];
function cbInit(bid,objSelId,targetId){
  const host=document.getElementById(bid); if(!host) return;
  CB_STATE[bid]={objSel:objSelId,target:targetId,fields:[]};
  host.innerHTML=`<div class="cb"><div class="cb-cap">🧩 Condition builder — no JSON needed</div><div class="cb-rows"></div>
   <div class="btnrow"><button class="btn secondary small" onclick="cbAddRow('${bid}')">+ Condition</button>
   <select id="${bid}_logic" style="max-width:150px"><option value="and">Match all</option><option value="or">Match any</option></select>
   <button class="btn secondary small" onclick="cbInsert('${bid}')">Insert into field ↓</button></div></div>`;
  cbLoadFields(bid);
  const os=document.getElementById(objSelId); if(os) os.onchange=()=>cbLoadFields(bid);
  cbAddRow(bid);
}
async function cbLoadFields(bid){
  const st=CB_STATE[bid]; if(!st) return;
  const obj=document.getElementById(st.objSel); if(!obj) return;
  const r=await api("GET","/api/describe/"+encodeURIComponent(obj.value));
  st.fields=((r.data||{}).fields||[]).filter(f=>!f.computed);
  host2Rows(bid);
}
function host2Rows(bid){
  document.querySelectorAll(`#${bid} .cb-field`).forEach(sel=>{
    const st=CB_STATE[bid], cur=sel.value;
    sel.innerHTML=(st.fields||[]).map(f=>`<option value="${esc(f.name)}">${esc(f.label||f.name)}</option>`).join("");
    if(cur&&[...sel.options].some(o=>o.value===cur)) sel.value=cur;
  });
}
function cbAddRow(bid){
  const st=CB_STATE[bid]; if(!st) return;
  const box=document.querySelector(`#${bid} .cb-rows`); if(!box) return;
  const div=document.createElement("div"); div.className="cb-row";
  div.innerHTML=`<select class="cb-field">${(st.fields||[]).map(f=>`<option value="${esc(f.name)}">${esc(f.label||f.name)}</option>`).join("")}</select>
   <select class="cb-op">${CB_OPS.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("")}</select>
   <input class="cb-val" placeholder="value"><button class="btn danger small cb-x" onclick="this.parentElement.remove()">✕</button>`;
  box.appendChild(div);
}
function cbVal(s){ s=(s||"").trim(); if(s==="") return ""; if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s); if(s==="true") return true; if(s==="false") return false; return s; }
function cbInsert(bid){
  const st=CB_STATE[bid]; if(!st) return;
  const logic=document.getElementById(bid+"_logic").value;
  const conds=[];
  document.querySelectorAll(`#${bid} .cb-row`).forEach(row=>{
    const f=row.querySelector(".cb-field").value, op=row.querySelector(".cb-op").value, raw=row.querySelector(".cb-val").value;
    if(!f) return;
    if(op==="isblank") conds.push({isblank:{field:f}});
    else if(op==="notblank") conds.push({not:{isblank:{field:f}}});
    else conds.push({[op]:[{field:f},cbVal(raw)]});
  });
  if(!conds.length){ toast("Add at least one condition first.","error"); return; }
  const expr=conds.length===1?conds[0]:{[logic]:conds};
  document.getElementById(st.target).value=JSON.stringify(expr);
  toast("Condition inserted — review, then save.","ok");
}

/* ============ visual flow builder (node canvas) ============ */
let FB=null;
const FB_ACTION_TYPES=[["create_record","Create record"],["set_fields","Update fields"],["log","Log to history"],["http_callout","HTTP callout"]];
function fbNodes(){
  const f=FB.flow, isS=FB.isScreen, nodes=[{key:"start",kind:"start"}];
  if(!isS&&f.condition&&Object.keys(f.condition).length) nodes.push({key:"cond",kind:"cond"});
  if(isS){
    (f.screens||[]).forEach((s,i)=>nodes.push({key:"s"+i,kind:"screen",idx:i}));
    (f.finish_actions||[]).forEach((a,i)=>nodes.push({key:"f"+i,kind:"faction",idx:i}));
  }else{
    (f.actions||[]).forEach((a,i)=>nodes.push({key:"a"+i,kind:"action",idx:i}));
  }
  return nodes;
}
function fbPos(key,i){
  const c=FB.flow.canvas||{};
  return c[key]||{x:260,y:44+i*104};
}
function fbLabel(n){
  const f=FB.flow;
  if(n.kind==="start") return FB.isScreen?("▶ "+(f.name||"Screen flow")):("▶ "+String(f.trigger||"on_create").replace(/_/g," ")+" · "+(f.object||""));
  if(n.kind==="cond") return "◆ Condition";
  if(n.kind==="screen"){ const s=(f.screens||[])[n.idx]||{}; return "▤ "+(s.title||("Screen "+(n.idx+1))); }
  const a=((n.kind==="faction"?f.finish_actions:f.actions)||[])[n.idx]||{};
  const t=(FB_ACTION_TYPES.find(t=>t[0]===a.type)||[])[1]||a.type||"?";
  const d=a.type==="create_record"&&a.object?(" → "+a.object):a.type==="http_callout"?(" "+(a.method||"POST")+" "+(a.path||"")):"";
  return "⚙ "+t+d;
}
async function openFlowBuilder(kind,id){
  const cfg=SETUP_KINDS[kind];
  const r=await api("GET","/api/admin/"+(cfg.apiKind||kind));
  const flow=(r.data||[]).find(x=>x.id===id);
  if(!flow){ toast("Flow not found.","error"); return; }
  FB={kind,id,flow:JSON.parse(JSON.stringify(flow)),isScreen:(kind==="screen-flows"||flow.flow_type==="screen"),sel:"start"};
  renderFlowBuilder();
  fbLoadVersions();
}
function renderFlowBuilder(){
  const nodes=fbNodes(), H=Math.max(440,44+nodes.length*104+70);
  const pos=nodes.map((n,i)=>fbPos(n.key,i));
  let svg=`<svg id="fbsvg" viewBox="0 0 560 ${H}" style="width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:none">`;
  svg+=`<defs><marker id="fbarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker></defs>`;
  nodes.forEach((n,i)=>{
    if(!i) return;
    const a=pos[i-1],b=pos[i];
    svg+=`<line id="fbl${i}" x1="${a.x}" y1="${a.y+32}" x2="${b.x}" y2="${b.y-32}" stroke="#94a3b8" stroke-width="2" marker-end="url(#fbarr)"/>`;
  });
  nodes.forEach((n,i)=>{
    const p=pos[i], sel=FB.sel===n.key;
    const fill=n.kind==="start"?"#e8f3fd":n.kind==="cond"?"#fef6e0":"var(--surface)";
    svg+=`<g data-node="${n.key}" transform="translate(${p.x},${p.y})" style="cursor:grab"><rect x="-115" y="-32" width="230" height="64" rx="10" fill="${fill}" stroke="${sel?"#0176d3":"var(--line)"}" stroke-width="${sel?3:1.5}"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">${esc(fbLabel(n).slice(0,36))}</text></g>`;
  });
  svg+="</svg>";
  document.getElementById("main").innerHTML=
   `<div class="btnrow"><button class="btn secondary" onclick="showAdmin()">← Back to Setup</button>`
   +`<h2 style="margin:0">🎨 ${esc(FB.flow.name||"Flow")}</h2><span style="flex:1"></span>`
   +`<select id="fbvers" style="max-width:190px" title="Version history"><option value="">🕘 Versions…</option></select>`
   +`<button class="btn secondary small" onclick="fbRollback()">Rollback</button>`
   +(FB.isScreen?`<button class="btn secondary small" onclick="fbAddStep('screen')">+ Screen</button>`:`<button class="btn secondary small" onclick="fbAddStep('action')">+ Action</button>`)
   +(FB.sel&&FB.sel!=="start"?` <button class="btn danger small" onclick="fbDelStep()">Delete step</button>`:"")
   +` <button class="btn" onclick="fbSave()">Save flow</button></div>`
   +`<div class="fbwrap"><div>${svg}</div><div class="fbpanel card" id="fbpanel"></div></div>`
   +`<p class="muted">Drag steps to arrange · click a step to edit · positions save with the flow.</p>`;
  renderFbPanel();
  fbBindDrag();
}
function fbSvgPt(svg,e){
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function fbBindDrag(){
  const svg=document.getElementById("fbsvg"); if(!svg) return;
  let drag=null;
  svg.querySelectorAll("[data-node]").forEach(g=>{
    g.addEventListener("pointerdown",e=>{
      const key=g.dataset.node, nodes=fbNodes(), i=nodes.findIndex(n=>n.key===key);
      FB.sel=key; renderFbPanel();
      svg.querySelectorAll("[data-node] rect").forEach(r=>{const on=r.parentElement.dataset.node===key; r.setAttribute("stroke",on?"#0176d3":"var(--line)"); r.setAttribute("stroke-width",on?"3":"1.5");});
      const pt=fbSvgPt(svg,e), p=fbPos(key,i);
      drag={key,i,dx:pt.x-p.x,dy:pt.y-p.y,g};
      try{g.setPointerCapture(e.pointerId);}catch(err){}
      e.preventDefault();
    });
  });
  svg.addEventListener("pointermove",e=>{
    if(!drag) return;
    const pt=fbSvgPt(svg,e);
    const x=Math.round(pt.x-drag.dx), y=Math.round(pt.y-drag.dy);
    const c=FB.flow.canvas=FB.flow.canvas||{}; c[drag.key]={x,y};
    drag.g.setAttribute("transform",`translate(${x},${y})`);
    const nodes=fbNodes(), i=drag.i;
    const setLine=(li,ax,ay,bx,by)=>{const l=document.getElementById("fbl"+li); if(l){l.setAttribute("x1",ax);l.setAttribute("y1",ay+32);l.setAttribute("x2",bx);l.setAttribute("y2",by-32);}};
    if(i>0){const p=fbPos(nodes[i-1].key,i-1); setLine(i,p.x,p.y,x,y);}
    if(i<nodes.length-1){const p=fbPos(nodes[i+1].key,i+1); setLine(i+1,x,y,p.x,p.y);}
  });
  svg.addEventListener("pointerup",()=>{drag=null;});
}
function renderFbPanel(){
  const el=document.getElementById("fbpanel"); if(!el||!FB) return;
  const n=fbNodes().find(x=>x.key===FB.sel);
  if(!n){ el.innerHTML=`<p class="muted">Select a step on the canvas.</p>`; return; }
  const f=FB.flow, objOpts=objects.map(o=>`<option value="${o.name}" ${f.object===o.name?"selected":""}>${esc(o.label||o.name)}</option>`).join("");
  let h="";
  if(n.kind==="start"){
    h=`<div class="section-title">Start</div><label>Name</label><input id="fb_name" value="${esc(f.name||"")}">`;
    if(!FB.isScreen) h+=`<label>Object</label><select id="fb_objsel">${objOpts}</select><label>Trigger</label><select id="fb_trig">${["on_create","on_update","on_create_or_update"].map(t=>`<option ${f.trigger===t?"selected":""}>${t}</option>`).join("")}</select>`;
  }else if(n.kind==="cond"){
    h=`<div class="section-title">Condition</div><label>Object</label><select id="fb_objsel">${objOpts}</select><div class="cb-host" id="cb_fb"></div><label>Condition JSON</label><textarea id="fb_cond" rows="4">${esc(JSON.stringify(f.condition||{}))}</textarea>`;
  }else if(n.kind==="action"||n.kind==="faction"){
    const a=((n.kind==="faction"?f.finish_actions:f.actions)||[])[n.idx]||{};
    h=`<div class="section-title">${n.kind==="faction"?"Finish action":"Action"} ${n.idx+1}</div><label>Type</label><select id="fb_atype" onchange="fbActionParams()">${FB_ACTION_TYPES.map(t=>`<option value="${t[0]}" ${a.type===t[0]?"selected":""}>${t[1]}</option>`).join("")}</select><div id="fb_aparams" style="margin-top:8px"></div>`;
  }else if(n.kind==="screen"){
    const s=(f.screens||[])[n.idx]||{};
    h=`<div class="section-title">Screen ${n.idx+1}</div><label>Title</label><input id="fb_stitle" value="${esc(s.title||"")}"><label>Fields</label><div id="fb_sfields">`
      +(s.fields||[]).map((fld,i)=>`<div class="btnrow" style="margin-bottom:6px"><input data-sf="name" data-i="${i}" value="${esc(fld.name||"")}" placeholder="api name" style="max-width:100px"><input data-sf="label" data-i="${i}" value="${esc(fld.label||"")}" placeholder="Label" style="max-width:120px"><select data-sf="type" data-i="${i}" style="max-width:110px">${["text","textarea","picklist","checkbox","number","date","email"].map(t=>`<option ${fld.type===t?"selected":""}>${t}</option>`).join("")}</select><button class="btn danger small" onclick="fbDelScreenField(${n.idx},${i})">✕</button></div>`).join("")
      +`</div><button class="btn secondary small" onclick="fbAddScreenField(${n.idx})">+ Field</button>`;
  }
  el.innerHTML=h+`<div class="btnrow" style="margin-top:12px"><button class="btn small" onclick="fbApplyPanel(true)">Apply</button></div><p class="muted">Apply stages edits in memory — <b>Save flow</b> persists them.</p>`;
  if(n.kind==="cond") cbInit("cb_fb","fb_objsel","fb_cond");
  if(n.kind==="action"||n.kind==="faction") fbActionParams();
}
async function fbActionParams(){
  const box=document.getElementById("fb_aparams"); if(!box||!FB) return;
  const n=fbNodes().find(x=>x.key===FB.sel); if(!n) return;
  const f=FB.flow, a=((n.kind==="faction"?f.finish_actions:f.actions)||[])[n.idx]||{};
  const type=(document.getElementById("fb_atype")||{}).value||a.type||"create_record";
  const objOpts=objects.map(o=>`<option value="${o.name}" ${a.object===o.name?"selected":""}>${esc(o.label||o.name)}</option>`).join("");
  let h="";

    h=`<label>Object</label><select id="fb_aobj">${objOpts}</select>`
      +(type==="set_fields"?`<label>Record ID (merge fields allowed)</label><input id="fb_arid" value="${esc(a.record_id||"{{Trigger.Id}}")}">`:"")
      +`<label>Fields JSON <span class="muted">— {"Name":"{{Trigger.Name}}"}</span></label><textarea id="fb_afields" rows="4">${esc(JSON.stringify(a.fields||{}))}</textarea>`;
  }else if(type==="log"){
    h=`<label>Message <span class="muted">— merge fields allowed</span></label><input id="fb_amsg" value="${esc(a.message||"")}">`;
  }else if(type==="http_callout"){

    h=`<label>Named credential</label><select id="fb_acred">${creds.map(c=>`<option ${a.credential===c.name?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`
      +`<div class="grid2"><div><label>Method</label><select id="fb_amethod">${["GET","POST","PUT","PATCH","DELETE"].map(m=>`<option ${a.method===m?"selected":""}>${m}</option>`).join("")}</select></div><div><label>Path</label><input id="fb_apath" value="${esc(a.path||"")}"></div></div>`
      +`<label>Headers JSON</label><textarea id="fb_aheaders" rows="2">${esc(JSON.stringify(a.headers||{}))}</textarea><label>Body JSON</label><textarea id="fb_abody" rows="3">${esc(typeof a.body==="string"?a.body:JSON.stringify(a.body??""))}</textarea>`;
  }

let fbJsonOk=true;
function fbJson(id,fb){
  const el=document.getElementById(id); if(!el) return fb;
  try{ const p=JSON.parse(el.value||"{}"); el.style.border=""; return p; }
  catch(e){ el.style.border="2px solid #c0392b"; fbJsonOk=false; toast("Invalid JSON in "+id+" — fix it before saving.","error"); return fb; }
}
function fbApplyPanel(loud){
  if(!FB) return;
  fbJsonOk=true;
  const n=fbNodes().find(x=>x.key===FB.sel); if(!n) return;
  const f=FB.flow, gv=id=>(document.getElementById(id)||{}).value;
  if(n.kind==="start"){
    f.name=gv("fb_name")||f.name;
    if(!FB.isScreen){ f.object=gv("fb_objsel")||f.object; f.trigger=gv("fb_trig")||f.trigger; }
  }else if(n.kind==="cond"){
    f.condition=fbJson("fb_cond",f.condition);
  }else if(n.kind==="action"||n.kind==="faction"){
    const list=n.kind==="faction"?(f.finish_actions=f.finish_actions||[]):(f.actions=f.actions||[]);
    const type=gv("fb_atype")||"create_record", a={type};
    if(type==="create_record"||type==="set_fields"){
      a.object=gv("fb_aobj");
      if(type==="set_fields") a.record_id=gv("fb_arid")||"{{Trigger.Id}}";
      a.fields=fbJson("fb_afields",{});
    }else if(type==="log"){ a.message=gv("fb_amsg")||""; }
    else if(type==="http_callout"){
      a.credential=gv("fb_acred"); a.method=gv("fb_amethod")||"POST"; a.path=gv("fb_apath")||"";
      a.headers=fbJson("fb_aheaders",{}); a.body=fbJson("fb_abody","");
    }
    list[n.idx]=a;
  }else if(n.kind==="screen"){
    const s=(f.screens||[])[n.idx]; if(!s) return;
    s.title=gv("fb_stitle")||s.title;
    const oldFields=s.fields||[];
    s.fields=[...document.querySelectorAll("#fb_sfields [data-sf='name']")].map(inp=>{
      const i=inp.dataset.i;
      const q=k=>document.querySelector(`#fb_sfields [data-sf='${k}'][data-i='${i}']`);
      return {...(oldFields[+i]||{}),name:q("name").value,label:q("label").value||q("name").value,type:q("type").value};
    }).filter(x=>x.name);
  }
  if(loud) toast("Applied — remember to Save flow.","info");
  renderFlowBuilder();
}
function fbAddStep(kind){
  const f=FB.flow;
  if(kind==="screen"){ (f.screens=f.screens||[]).push({title:"Screen "+(f.screens.length+1),fields:[]}); FB.sel="s"+(f.screens.length-1); }
  else{
    if(FB.isScreen){ (f.finish_actions=f.finish_actions||[]).push({type:"create_record"}); FB.sel="f"+(f.finish_actions.length-1); }
    else{ (f.actions=f.actions||[]).push({type:"create_record"}); FB.sel="a"+(f.actions.length-1); }
  }
  renderFlowBuilder();
}
function fbDelStep(){
  const n=fbNodes().find(x=>x.key===FB.sel); if(!n||n.kind==="start") return;
  if(!confirm("Delete this step?")) return;
  const f=FB.flow;
  if(n.kind==="cond") f.condition={};
  else if(n.kind==="action") f.actions.splice(n.idx,1);
  else if(n.kind==="faction") f.finish_actions.splice(n.idx,1);
  else if(n.kind==="screen") f.screens.splice(n.idx,1);
  FB.sel="start"; renderFlowBuilder();
}
function fbAddScreenField(si){

  const s=FB.flow.screens[si]; s.fields=s.fields||[]; s.fields.push({name:"field"+(s.fields.length+1),label:"Field "+(s.fields.length+1),type:"text"});

}
function fbDelScreenField(si,fi){

}
async function fbSave(){
  fbApplyPanel(false);

  const f=FB.flow, payload={name:f.name,canvas:f.canvas||{}};
  if(FB.isScreen){ payload.screens=f.screens||[]; payload.finish_actions=f.finish_actions||[]; }
  else{ payload.object=f.object; payload.trigger=f.trigger; payload.condition=f.condition||{}; payload.actions=f.actions||[]; }
  const cfg=SETUP_KINDS[FB.kind];

}

/* ============ dispatch console (service timeline) ============ */
let dispDate=null;
async function showDispatch(){
  setActive("__dispatch");
  if(!dispDate) dispDate=new Date().toISOString().slice(0,10);
  document.getElementById("main").innerHTML=skel(3);
  const r=await api("GET","/api/sobjects/ServiceAppointment?sort=ScheduledStart&dir=asc");
  if(!r.ok){ document.getElementById("main").innerHTML=`<div class="err">${esc((r.data||{}).error||"Failed to load")}</div>`; return; }
  const day=(r.data||[]).filter(a=>(a.ScheduledStart||"").slice(0,10)===dispDate);
  const techs={};
  day.forEach(a=>{ const t=a.Technician||"(Unassigned)"; (techs[t]=techs[t]||[]).push(a); });
  const names=Object.keys(techs).sort();
  const H0=6,H1=22,SPAN=H1-H0;
  const pct=dt=>{ const d=new Date(dt); return Math.min(100,Math.max(0,((d.getHours()+d.getMinutes()/60)-H0)/SPAN*100)); };
  const col=s=>s==="Completed"?"#2e9e4f":s==="In Progress"?"#d98a1f":s==="Cancelled"?"#94a3b8":"#0176d3";
  const today=new Date().toISOString().slice(0,10);
  const nowPct=dispDate===today?pct(new Date().toISOString()):null;
  let ticks=""; for(let h=H0;h<=H1;h+=2) ticks+=`<span style="position:absolute;left:${((h-H0)/SPAN*100).toFixed(1)}%;transform:translateX(-50%)">${h}:00</span>`;
  let html=`<div class="btnrow"><h2 style="margin:0">🗺 Dispatch console</h2><span class="muted">${day.length} appointment(s) · ${names.length} technician(s)</span><span style="flex:1"></span>`
    +`<input type="date" id="disp_date" value="${dispDate}" style="width:auto"> <button class="btn secondary small" onclick="dispDate=v('disp_date');showDispatch()">Go</button> `
    +`<button class="btn secondary small" onclick="dispDate=new Date().toISOString().slice(0,10);showDispatch()">Today</button></div>`;
  html+=`<div class="card"><div class="disp-head"><div></div><div class="disp-scale">${ticks}</div></div>`;
  if(!names.length) html+=`<p class="muted">No appointments scheduled on this date.</p>`;
  for(const t of names){
    html+=`<div class="disp-row"><div style="padding:10px 8px"><b>${esc(t)}</b><div class="muted">${techs[t].length} appt(s)</div></div><div class="disp-lane">`;
    for(const a of techs[t]){
      const l=pct(a.ScheduledStart), w=Math.max(2.5,pct(a.ScheduledEnd||a.ScheduledStart)-l);
      const tip=`${a.Name||"(no name)"} — ${(a.ScheduledStart||"").slice(11,16)}–${(a.ScheduledEnd||"").slice(11,16)} · ${a.Status||""}${a.Address?" · "+a.Address:""}`;
      html+=`<div class="disp-bar" style="left:${l.toFixed(1)}%;width:${w.toFixed(1)}%;background:${col(a.Status)}" title="${esc(tip)}" onclick="jumpTo('ServiceAppointment','${a.Id}')">${esc(a.Name||"(no name)")}</div>`;
    }
    if(nowPct!=null&&nowPct>=0&&nowPct<=100) html+=`<div style="position:absolute;left:${nowPct.toFixed(1)}%;top:0;bottom:0;width:2px;background:#ef4444;opacity:.7" title="Now"></div>`;
    html+=`</div></div>`;
  }
  html+=`</div><p class="muted">Click a block to open the appointment. Bars are colored by status.</p>`;
  document.getElementById("main").innerHTML=html;
}
