async function renderSetupHome(){
  let html=`<h2>Admin Setup</h2>
  <div class="setup-search"><input id="setup_home_q" placeholder="Quick find — type a setting name…" oninput="filterHomeTiles(this.value)"></div>`;
  for(const sec of SETUP_SECTIONS){
    html+=`<div class="setup-sec"><div class="setup-sec-head"><div><b style="font-size:15px">${sec.title}</b><div class="muted" style="font-size:12px">${sec.desc}</div></div></div><div class="tile-grid">`;
    html+=SETUP_TILES.filter(t=>t.section===sec.id).map(t=>`<button class="tile" data-tile="${esc(t.card.toLowerCase())}" onclick="showAdmin('${t.section}','${t.card.replace(/'/g,"\\'")}')"><span class="ttitle">${esc(t.card)}</span><span class="tcount" data-tile-count="${esc(t.card)}"></span><span class="tdesc">${esc(t.desc)}</span></button>`).join("");
    html+=`</div></div>`;
  }
  document.getElementById("main").innerHTML=html;
  // live counts, in parallel
  await Promise.all(SETUP_TILES.map(async t=>{
    try{
      let n=null;
      if(t.kind){ const r=await api("GET","/api/admin/"+t.kind); let rows=Array.isArray(r.data)?r.data:[];
        if(t.flowFilter==="screen") rows=rows.filter(x=>x.flow_type==="screen");
        if(t.flowFilter==="record") rows=rows.filter(x=>!x.flow_type||x.flow_type==="record");
        n=rows.length; }
      else if(t.url){ const r=await api("GET",t.url); const d=r.data; n=Array.isArray(d)?d.length:(d&&d.length)||null; }
      const el=document.querySelector(`[data-tile-count="${CSS.escape(t.card)}"]`);
      if(el) el.textContent=(n===null||n===undefined)?"":`${n} configured`;
    }catch(e){}
  }));
  const q=document.getElementById("setup_home_q"); if(q) q.focus();
}
function filterHomeTiles(q){
  q=q.toLowerCase();
  document.querySelectorAll(".tile").forEach(t=>{ t.style.display=t.dataset.tile.includes(q)?"":"none"; });
  document.querySelectorAll(".setup-sec").forEach(s=>{ s.style.display=[...s.querySelectorAll(".tile")].some(t=>t.style.display!=="none")?"":"none"; });
}
function setupAfterRender(section, highlight){
  const main=document.getElementById("main");
  const sec=SETUP_SECTIONS.find(s=>s.id===section)||SETUP_SECTIONS[0];
  const cards=[...main.querySelectorAll(":scope > .card")];
  main.insertAdjacentHTML("afterbegin",
   `<div class="setup-breadcrumb"><a onclick="showAdmin()">← Setup Home</a><span>›</span><b>${sec.title}</b></div>
    <div class="setup-nav">${SETUP_SECTIONS.map(s=>`<button class="${s.id===sec.id?"on":""}" onclick="showAdmin('${s.id}')">${s.title}</button>`).join("")}</div>
    <div class="setup-search"><input id="setup_q" placeholder="Filter settings in ${esc(sec.title)}…" oninput="filterSetupCards(this.value)"></div>
    <div id="setup_cards"></div>`);
  const host=document.getElementById("setup_cards");
  for(const card of cards){
    const titleEl=card.querySelector(":scope > .section-title");
    const title=titleEl?titleEl.textContent.trim():"";
    if(CARD_SECTION[title]===sec.id){ host.appendChild(card); enhanceSetupCard(card,title); }
    else card.remove();
  }
  // collapsible cards
  host.querySelectorAll(":scope > .card > .section-title").forEach(t=>{ t.onclick=()=>t.parentElement.classList.toggle("collapsed"); });
  // lists + builders for the visible section
  if(sec.id==="automation"){ listAutoResponses(); dfInit(); }
  if(sec.id==="datamodel"){ listPaths(); }
  if(sec.id==="datamodel"){ listRelationships(); loadPersonStatus(); listTerritories(); listTerrRules(); listBigObjects(); listArchiveRules(); }
  if(sec.id==="devops"){ listBulkJobs(); listSandboxes(); listCmdt(); listSettings(); listXObjects(); }
  if(sec.id==="integrations"){ listInstalledPkgs(); }
  for(const [kind,cfg] of Object.entries(SETUP_KINDS)){ if(cfg.cardSection===sec.id) refreshSetupList(kind); }
  for(const b of COND_BUILDERS){ if(b.section===sec.id) cbInit(b.id,b.objSel,b.target); }
  // custom read-only lists
  if(sec.id==="security"){ listSetupUsers(); listSetupRoles(); listProfiles(); loadSecurityPolicies(); divUsage(); dgInit(); }
  if(sec.id==="company"){ loadOrgSettings(); loadPortalSettings(); loadChatterSettings(); tbList(); lbLoad(); }
  if(sec.id==="monitoring"){ loadLoginHistory(0); loadStorage(); }
  if(sec.id==="datamodel"){ listSetupObjects(); listObjectFields(); leList(); leFields(); calsRefresh(); }
  if(sec.id==="integrations"){ listNamedCreds(); listChangeSets(); importRunsList(); }
  if(sec.id==="devops"){ sdList(); }
  if(sec.id==="monitoring"){ listJobs(); loadHistoryTracking(); }
  if(sec.id==="corecrm"){ renderCoreCrmSetup(); }
  if(highlight){
    const card=[...host.children].find(c=>{const t=c.querySelector(":scope > .section-title");return t&&t.textContent.trim()===highlight;});
    if(card){ card.classList.add("flash"); card.scrollIntoView({behavior:"smooth",block:"start"}); setTimeout(()=>card.classList.remove("flash"),2300); }
  }
}
function enhanceSetupCard(card,title){
  const kind=Object.keys(SETUP_KINDS).find(k=>SETUP_KINDS[k].cardTitle===title);
  if(kind){ const t=card.querySelector(":scope > .section-title"); if(t&&!t.querySelector(".card-count")) t.insertAdjacentHTML("beforeend",`<span class="card-count" data-count-for="${kind}"></span>`); }
}

const SETUP_CACHE={};
let SETUP_EDIT={kind:null,rid:null};
function setupErr(kind,msg){ const el=document.getElementById(SETUP_KINDS[kind].errEl); if(el) el.innerHTML=msg?`<div class="err">${esc(msg)}</div>`:""; }
function collectSetupForm(kind){
  const cfg=SETUP_KINDS[kind], body={...(cfg.constFields||{})};
  for(const [key,id,how,extra] of cfg.fields){
    if(how==="const"){ body[key]=extra; continue; }
    const el=document.getElementById(id);
    if(how==="check"){ body[key]=el.checked; continue; }
    const raw=v(id);
    if(how==="json"){ if(!raw){ body[key]=extra; continue; } try{ body[key]=JSON.parse(raw); }catch(e){ setupErr(kind,`${key} is not valid JSON.`); return null; } continue; }
    if(how==="csv"){ body[key]=raw.split(",").map(s=>s.trim()).filter(Boolean); continue; }
    if(how==="int"){ body[key]=parseInt(raw||extra||"0",10); continue; }
    if(how==="blankstar"){ body[key]=raw||"*"; continue; }
    body[key]=raw;
  }
  if(!body.name){ setupErr(kind,"Name is required."); return null; }
  return body;
}
function fillSetupForm(kind,row){
  const cfg=SETUP_KINDS[kind];
  if(kind==="exchange-rates"){
    // Stored rows use the canonical {currency_code, start_date} shape;
    // map back to the form's field names for editing.
    row={...row, from_currency:row.currency_code||row.from_currency,
         effective_date:row.start_date||row.effective_date};
  }
  for(const [key,id,how] of cfg.fields){
    if(how==="const") continue;
    const el=document.getElementById(id); if(!el) continue;
    const val=row[key];
    if(how==="check"){ el.checked=!!val; continue; }
    if(how==="json"){ el.value=val==null?"":JSON.stringify(val,null,2); continue; }
    if(how==="csv"){ el.value=(val||[]).join(", "); continue; }
    el.value=val==null?"":val;
  }
}
async function submitSetupForm(kind){
  const cfg=SETUP_KINDS[kind], apiKind=cfg.apiKind||kind;
  setupErr(kind,null);
  const body=collectSetupForm(kind); if(!body) return;
  let r;
  if(SETUP_EDIT.kind===kind&&SETUP_EDIT.rid){ r=await api("PATCH",`/api/admin/${apiKind}/${SETUP_EDIT.rid}`,body); }
  else{ r=await api("POST","/api/admin/"+apiKind,body); }
  if(r.ok){ toast(SETUP_EDIT.kind===kind?"Saved.":"Created.","ok"); cancelSetupEdit(kind,true); refreshSetupList(kind); }
  else setupErr(kind,r.data&&r.data.error||"Failed");
}
async function editSetupRow(kind,rid){
  let row=(SETUP_CACHE[kind]||[]).find(x=>x.id===rid);
  if(!row){  // not on current page — fetch single
    const cfg0=SETUP_KINDS[kind], apiKind=cfg0.apiKind||kind;
    const r=await api("GET",`/api/admin/${apiKind}/${rid}`);
    if(r.ok&&r.data) row=r.data; else { toast("Failed to load: "+(r.data&&r.data.error||r.status),"error"); return; }
  }
  const cfg=SETUP_KINDS[kind];
  fillSetupForm(kind,row);
  SETUP_EDIT={kind,rid};
  const sb=document.getElementById(cfg.submit); if(sb){ if(!sb.dataset.label) sb.dataset.label=sb.textContent; sb.textContent="Save changes"; }
  const cb=document.getElementById(cfg.cancel); if(cb) cb.style.display="";
  setupErr(kind,null);
  document.getElementById(cfg.submit).scrollIntoView({behavior:"smooth",block:"center"});
  toast("Editing — change the form and Save.","ok");
}
function cancelSetupEdit(kind,silent){
  const cfg=SETUP_KINDS[kind]; if(!cfg) return;
  if(SETUP_EDIT.kind) SETUP_EDIT={kind:null,rid:null};
  const sb=document.getElementById(cfg.submit); if(sb) sb.textContent=sb.dataset.label||"Save";
  const cb=document.getElementById(cfg.cancel); if(cb) cb.style.display="none";
  if(!silent) setupErr(kind,null);
}
async function toggleSetupActive(kind,rid,cur){
  const cfg=SETUP_KINDS[kind], apiKind=cfg.apiKind||kind;
  const r=await api("PATCH",`/api/admin/${apiKind}/${rid}`,{active:!cur});
  r.ok?(toast(cur?"Deactivated.":"Activated.","ok"),refreshSetupList(kind)):toast("Failed: "+(r.data&&r.data.error||r.status),"error");
}
async function delSetupRow(kind,rid){
  if(!confirm("Delete this?")) return;
  const cfg=SETUP_KINDS[kind], apiKind=cfg.apiKind||kind;
  const r=await api("DELETE",`/api/admin/${apiKind}/${rid}`);
  r.ok?(toast("Deleted.","ok"),refreshSetupList(kind)):toast("Failed: "+(r.data&&r.data.error||r.status),"error");
}
function cellVal(row,f){
  let val=row[f];
  if(f==="last_run"||f==="next_run") val=(val||"never").slice(0,16).replace("T"," ");
  if(f==="events"||f==="fields") val=(val||[]).join(", ");
  if(f==="is_default") val=val?"✓":"—";
  if(val===undefined||val===null||val==="") val="—";
  return esc(String(val));
}
let SETUP_PAGE={};
async function refreshSetupList(kind){
  const cfg=SETUP_KINDS[kind]; if(!cfg) return;
  const el=document.getElementById(cfg.listEl); if(!el) return;
  const apiKind=cfg.apiKind||kind;
  const paged=!cfg.filter;  // kinds with a client-side filter share a table; keep full fetch
  const limit=50, offset=paged?(SETUP_PAGE[kind]||0):0;
  const r=await api("GET","/api/admin/"+apiKind+(paged?`?limit=${limit}&offset=${offset}`:""));
  let rows, total=null;
  if(r.data&&!Array.isArray(r.data)&&Array.isArray(r.data.rows)){ rows=r.data.rows; total=r.data.total; }
  else rows=Array.isArray(r.data)?r.data:[];
  SETUP_CACHE[kind]=rows;
  if(cfg.filter) rows=rows.filter(cfg.filter);
  const badge=document.querySelector(`[data-count-for="${kind}"]`); if(badge) badge.textContent=`(${total==null?rows.length:total})`;
  if(!rows.length){ el.innerHTML=`<p class="muted">None yet.</p>`; return; }
  const acts=cfg.actions||{edit:!cfg.noEdit,toggle:!cfg.noActive,del:true};
  el.innerHTML=`<table style="margin-top:10px"><tr>${cfg.cols.map(c=>`<th>${c[0]}</th>`).join("")}${cfg.noActive?"":`<th>Status</th>`}<th></th></tr>`+
   rows.map(x=>`<tr>${cfg.cols.map(c=>`<td>${cellVal(x,c[1])}</td>`).join("")}${cfg.noActive?"":`<td>${x.active?`<span class="pill pill-on">Active</span>`:`<span class="pill pill-off">Inactive</span>`}</td>`}<td style="white-space:nowrap">${cfg.extra==="runJob"?`<button class="btn secondary small" onclick="runJob('${x.id}')">Run now</button> <button class="btn secondary small" onclick="viewJobRuns('${x.id}')">Runs</button> `:""}${cfg.extra==="flowCanvas"?`<button class="btn secondary small" onclick="openFlowBuilder('${kind}','${x.id}')">Canvas</button> `:""}${cfg.extra==="psEdit"?`<button class="btn secondary small" onclick="psEditForm('${x.id}')">Edit</button> `:""}${acts.edit?`<button class="btn secondary small" onclick="editSetupRow('${kind}','${x.id}')">Edit</button> `:""}${acts.toggle?`<button class="btn secondary small" onclick="toggleSetupActive('${kind}','${x.id}',${!!x.active})">${x.active?"Deactivate":"Activate"}</button> `:""}${acts.del?`<button class="btn danger small" onclick="delSetupRow('${kind}','${x.id}')">Delete</button>`:""}</td></tr>`).join("")+`</table>`+
   (paged&&total!=null?setupPager(kind,total,limit,offset):"");
}
function setupPager(kind,total,limit,offset){
  const pages=Math.max(1,Math.ceil(total/limit));
  const page=Math.floor(offset/limit)+1;
  return `<div class="btnrow" style="margin-top:8px"><span class="muted">${total} item${total===1?"":"s"} — page ${page} of ${pages}</span><span style="flex:1"></span><button class="btn secondary small" ${offset===0?"disabled":""} onclick="SETUP_PAGE['${kind}']=Math.max(0,${offset}-${limit});refreshSetupList('${kind}')">${"\u2190"} Prev</button> <button class="btn secondary small" ${offset+limit>=total?"disabled":""} onclick="SETUP_PAGE['${kind}']=${offset}+${limit};refreshSetupList('${kind}')">Next ${"\u2192"}</button></div>`;
}

async function psEditForm(id){
  const r=await api("GET","/api/admin/permission-sets/"+id);
  if(!r.ok){ toast("Failed to load: "+(r.data&&r.data.error||r.status),"error"); return; }
  const ps=r.data;
  document.getElementById("ps_list").innerHTML=`<div class="card" style="margin-top:10px;padding:10px"><div class="section-title">Edit permission set</div><div class="grid2"><div><label>Name</label><input id="pse_name" value="${esc(ps.name||"")}" disabled><label>Label</label><input id="pse_label" value="${esc(ps.label||"")}"></div><div><label>Object permissions JSON</label><textarea id="pse_obj" rows="4">${esc(JSON.stringify(ps.object_permissions||{},null,2))}</textarea><label>Field permissions JSON</label><textarea id="pse_field" rows="4">${esc(JSON.stringify(ps.field_permissions||{},null,2))}</textarea></div></div><div class="btnrow" style="margin-top:8px"><button class="btn small" onclick="psSave('${ps.id}')">Save</button> <button class="btn secondary small" onclick="refreshSetupList('permission-sets')">Cancel</button></div><div id="pse_err"></div></div>`;
}
async function psSave(id){
  let obj, fld;
  try{ obj=JSON.parse(document.getElementById("pse_obj").value||"{}"); fld=JSON.parse(document.getElementById("pse_field").value||"{}"); }
  catch(e){ document.getElementById("pse_err").innerHTML=`<div class="err">Invalid JSON.</div>`; return; }
  const r=await api("PATCH","/api/admin/permission-sets/"+id,{label:document.getElementById("pse_label").value.trim(),object_permissions:obj,field_permissions:fld});
  if(!r.ok){ document.getElementById("pse_err").innerHTML=`<div class="err">${esc(r.data.error||"Failed")}</div>`; return; }
  toast("Permission set saved.","ok"); refreshSetupList("permission-sets");
}
async function userPsView(uid){
  const u=SETUP_USERS.find(x=>x.id===uid); if(!u) return;
  const el=document.getElementById("au_ps");
  const [ar,pr]=await Promise.all([api("GET",`/api/admin/users/${uid}/permission-sets`),api("GET","/api/admin/permission-sets")]);
  const assigned=ar.ok?ar.data:[];
  const all=(pr.data&&pr.data.rows)||pr.data||[];
  const assignedIds=new Set(assigned.map(a=>a.id));
  const avail=all.filter(p=>!assignedIds.has(p.id));
  el.innerHTML=`<div class="card" style="margin-top:10px;padding:10px"><div class="section-title">Permission sets — ${esc(u.username)}</div>`+
   (assigned.length?`<table style="margin-top:6px"><tr><th>Name</th><th>Label</th><th></th></tr>${assigned.map(a=>`<tr><td>${esc(a.name)}${a.missing?' <span class="pill pill-off">deleted</span>':""}</td><td>${esc(a.label||"—")}</td><td><button class="btn danger small" onclick="userPsUnassign('${uid}','${a.id}')">Unassign</button></td></tr>`).join("")}</table>`:`<p class="muted">No permission sets assigned.</p>`)+
   `<div class="btnrow" style="margin-top:8px"><select id="ups_add" style="max-width:260px">${avail.map(p=>`<option value="${p.id}">${esc(p.label||p.name)}</option>`).join("")}</select> <button class="btn small" onclick="userPsAssign('${uid}')" ${avail.length?"":"disabled"}>Assign</button> <button class="btn secondary small" onclick="document.getElementById('au_ps').innerHTML=''">Close</button></div><div id="ups_err"></div></div>`;
  el.scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function userPsAssign(uid){
  const sel=document.getElementById("ups_add"); if(!sel||!sel.value) return;
  const r=await api("POST",`/api/admin/users/${uid}/permission-sets`,{permission_set:sel.value});
  if(!r.ok){ document.getElementById("ups_err").innerHTML=`<div class="err">${esc(r.data.error||"Failed")}</div>`; return; }
  userPsView(uid); toast("Permission set assigned.","ok");
}
async function userPsUnassign(uid,psid){
  if(!confirm("Unassign this permission set?")) return;
  const r=await api("DELETE",`/api/admin/users/${uid}/permission-sets/${psid}`);
  r.ok?(userPsView(uid),toast("Unassigned.","ok")):toast("Failed: "+(r.data&&r.data.error||r.status),"error");
}

function cbAddGroup(bid,container){
  const st=CB_STATE[bid]; if(!st||!container) return;
  const div=document.createElement("div"); div.className="cb-group";
  div.style.cssText="border:1px dashed var(--line);border-radius:8px;padding:8px;margin:8px 0";
  div.innerHTML=`<div class="btnrow"><select class="cb-gop" style="max-width:120px"><option value="and">AND</option><option value="or">OR</option><option value="not">NOT</option></select>
   <span style="flex:1"></span><button class="btn secondary small" onclick="cbAddRow('${bid}',this.closest('.cb-group').querySelector('.cb-grows'))">+ Condition</button>
   <button class="btn secondary small" onclick="cbAddGroup('${bid}',this.closest('.cb-group').querySelector('.cb-gsubs'))">+ Subgroup</button>
   <button class="btn danger small" onclick="this.closest('.cb-group').remove()">✕</button></div>
   <div class="cb-grows"></div><div class="cb-gsubs"></div>`;
  container.appendChild(div);
  host2Rows(bid);

function cbBuildGroup(g){
  const op=(g.querySelector(":scope > .btnrow .cb-gop")||{}).value||"and";
  const conds=[];
  g.querySelectorAll(":scope > .cb-grows > .cb-row").forEach(row=>{ const e=cbRowExpr(row); if(e) conds.push(e); });
  g.querySelectorAll(":scope > .cb-gsubs > .cb-group").forEach(sg=>{ const e=cbBuildGroup(sg); if(e&&Object.keys(e).length) conds.push(e); });
  if(!conds.length) return null;
  if(op==="not") return conds.length===1?{not:conds[0]}:{not:{and:conds}};
  return {[op]:conds};
}
function cbBuildNested(bid){
  const root=document.querySelector(`#${bid} .cb-nested`); if(!root) return {};
  const parts=[];
  root.querySelectorAll(":scope > .cb-group").forEach(g=>{ const e=cbBuildGroup(g); if(e) parts.push(e); });
  if(!parts.length) return {};
  return parts.length===1?parts[0]:{and:parts};
}
async function cbLoadFields(bid){
  const st=CB_STATE[bid]; if(!st) return;

function host2Rows(bid){
  document.querySelectorAll(`#${bid} .cb-field, #${bid} .cb-valfield`).forEach(sel=>{
    const st=CB_STATE[bid], cur=sel.value;
    sel.innerHTML=(st.fields||[]).map(f=>`<option value="${esc(f.name)}">${esc(f.label||f.name)}</option>`).join("");
    if(cur&&[...sel.options].some(o=>o.value===cur)) sel.value=cur;
  });
}
function cbRowHtml(bid){
  const st=CB_STATE[bid];
  const opts=(st.fields||[]).map(f=>`<option value="${esc(f.name)}">${esc(f.label||f.name)}</option>`).join("");
  return `<select class="cb-field">${opts}</select>
   <select class="cb-op">${CB_OPS.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("")}</select>
   <input class="cb-val" placeholder="value"><label class="muted" title="Compare to another field" style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" class="cb-isfield" onchange="cbToggleValField(this)"> field</label>
   <select class="cb-valfield" style="display:none;max-width:150px">${opts}</select><button class="btn danger small cb-x" onclick="this.parentElement.remove()">✕</button>`;
}
function cbToggleValField(cb){
  const row=cb.closest(".cb-row"); if(!row) return;
  const isF=cb.checked;
  row.querySelector(".cb-val").style.display=isF?"none":"";
  row.querySelector(".cb-valfield").style.display=isF?"":"none";
}
function cbAddRow(bid,box){
  const st=CB_STATE[bid]; if(!st) return;
  box=box||document.querySelector(`#${bid} .cb-rows`); if(!box) return;
  const div=document.createElement("div"); div.className="cb-row";
  div.innerHTML=cbRowHtml(bid);
  box.appendChild(div);
}
function cbRowExpr(row){
  const f=(row.querySelector(".cb-field")||{}).value, op=(row.querySelector(".cb-op")||{}).value;
  if(!f||!op) return null;
  let rhs;
  if(row.querySelector(".cb-isfield").checked){
    const f2=(row.querySelector(".cb-valfield")||{}).value;
    if(!f2) return null;
    rhs={field:f2};
  }else{
    rhs=cbVal((row.querySelector(".cb-val")||{}).value);
  }
  if(op==="isblank") return {isblank:{field:f}};
  if(op==="notblank") return {not:{isblank:{field:f}}};
  if(op==="is_last_n_days") return {[op]:[{field:f},(typeof rhs==="number"?rhs:30)]};
  if(op.startsWith("is_")) return {[op]:[{field:f}]};
  return {[op]:[{field:f},rhs]};
}
function cbVal(s){ s=(s||"").trim(); if(s==="") return ""; if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s); if(s==="true") return true; if(s==="false") return false; return s; }
function cbBuildExpr(bid){
  const st=CB_STATE[bid]; if(!st) return {};
  const logic=(document.getElementById(bid+"_logic")||{}).value||"and";
  const conds=[];
  document.querySelectorAll(`#${bid} .cb-flat .cb-row`).forEach(row=>{
    const e=cbRowExpr(row); if(e) conds.push(e);
  });
  return conds.length===1?conds[0]:conds.length?{[logic]:conds}:{};
}
function cbInsert(bid){
  const st=CB_STATE[bid]; if(!st) return;
  const nested=(document.getElementById(bid+"_nested")||{}).checked;
  const expr=nested?cbBuildNested(bid):cbBuildExpr(bid);
  if(!Object.keys(expr).length){ toast("Add at least one condition first.","error"); return; }
  document.getElementById(st.target).value=JSON.stringify(expr);
  toast("Condition inserted — review, then save.","ok");
}

  const divList=divs.ok&&Array.isArray(divs.data)?divs.data:[];
  const list=((objs.data||[])).slice().sort((a,b)=>a.name.localeCompare(b.name));

async function saveProfile(name){

  const pages=Math.ceil(total/LH_LIMIT);

    h+=`<div class="btnrow" style="margin-top:8px"><button class="btn secondary small" ${cur<=0?"disabled":""} onclick="loadLoginHistory(${LH_OFFSET-LH_LIMIT})">‹ Prev</button><span class="muted" style="align-self:center">Page ${cur+1} of ${pages} (${total} attempts)</span><button class="btn secondary small" ${cur>=pages-1?"disabled":""} onclick="loadLoginHistory(${LH_OFFSET+LH_LIMIT})">Next ›</button></div>`;

async function loadStorage(){
  const el=document.getElementById("st_list"); if(!el) return;
  el.innerHTML=`<p class="muted">Loading…</p>`;
  const r=await api("GET","/api/admin/storage"); const d=r.data||{};
  if(!r.ok){ el.innerHTML=`<div class="err">${esc((r.data||{}).error||"Failed to load")}</div>`; return; }
  const fmt=b=>b==null?"—":(b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":b<1073741824?(b/1048576).toFixed(1)+" MB":(b/1073741824).toFixed(2)+" GB");
  const objs=(d.objects||[]).filter(o=>o.records);
  const max=Math.max(1,...objs.map(o=>o.records||0));
  let h=`<div class="grid2"><div><b>Database</b><div class="muted">${fmt(d.database_bytes)}</div></div><div><b>Uploaded files</b><div class="muted">${fmt(d.files_bytes)}</div></div></div>
  <div class="grid2" style="margin-top:6px"><div><b>Backups (${(d.backups||[]).length})</b><div class="muted">${fmt(d.backups_bytes)}</div></div><div><b>Total records</b><div class="muted">${d.total_records!=null?d.total_records:"—"}</div></div></div>`;
  if((d.backups||[]).length) h+=`<table style="margin-top:10px"><tr><th>Backup</th><th style="text-align:right">Size</th><th></th></tr>${d.backups.map(b=>`<tr><td>${esc(b.name)}</td><td style="text-align:right">${fmt(b.size_bytes)}</td><td style="text-align:right"><button class="btn secondary small" onclick="restoreBackup('${esc(b.name)}')">Restore</button></td></tr>`).join("")}</table>`;
  h+=`<table style="margin-top:10px"><tr><th>Object</th><th style="width:45%">Records</th><th style="text-align:right"></th></tr>${objs.slice(0,40).map(o=>{const pct=Math.round(100*(o.records||0)/max);return `<tr><td>${esc(o.label||o.object)}<div class="muted">${esc(o.object)}${o.custom?" · custom":""}</div></td><td><div style="background:#eef1f5;border-radius:4px;height:10px"><div style="background:#0176d3;height:10px;border-radius:4px;width:${pct}%"></div></div></td><td style="text-align:right">${o.records.toLocaleString()}</td></tr>`;}).join("")}</table>`;
  el.innerHTML=h;
}
async function restoreBackup(name){
  if(!confirm("Restore backup '"+name+"'? The current database will be replaced by this backup.")) return;
  if(!confirm("This cannot be undone directly — a pre-restore safety snapshot is kept. Restore now?")) return;
  const r=await api("POST","/api/admin/backups/"+encodeURIComponent(name)+"/restore",{confirm:true});
  if(r.ok){ toast("Database restored from "+name+" — reloading…","ok"); setTimeout(()=>location.reload(),1500); }
  else toast((r.data&&r.data.error)||"Restore failed","error");
}
async function listSetupRoles(){
  const el=document.getElementById("rl_list"); if(!el) return;
  const [rr,ur]=await Promise.all([api("GET","/api/admin/roles"),api("GET","/api/admin/users")]);
  const roles=rr.data||[], users=ur.data||[];
  const kids={}; roles.forEach(r=>{ const p=r.parent||""; (kids[p]=kids[p]||[]).push(r); });
  Object.values(kids).forEach(a=>a.sort((x,y)=>x.name.localeCompare(y.name)));
  const userCount={}; users.forEach(u=>{ if(u.role) userCount[u.role]=(userCount[u.role]||0)+1; });
  const orphans=roles.filter(r=>r.parent&&!roles.some(x=>x.name===r.parent));
  function node(r,depth){
    const ch=(kids[r.name]||[]);
    const ed=`roleEd_${r.name.replace(/[^a-zA-Z0-9]/g,"_")}`;
    return `<li><div class="btnrow" style="gap:6px;align-items:center;flex-wrap:wrap">`+
     `<span style="font-weight:600">${esc(r.name)}</span>`+
     `<span class="muted">${userCount[r.name]||0} user${(userCount[r.name]||0)===1?"":"s"}${ch.length?` · ${ch.length} child role${ch.length===1?"":"s"}`:""}</span>`+
     `<span style="flex:1"></span>`+
     `<button class="btn secondary small" onclick="roleEditForm('${esc(r.name)}')">Rename / reparent</button> `+
     `<button class="btn danger small" onclick="roleDel('${esc(r.name)}')">Delete</button></div>`+
     `<div id="${ed}"></div>`+
     (ch.length?`<ul style="margin:4px 0 4px 18px;padding-left:12px;border-left:2px solid var(--border)">${ch.map(c=>node(c,depth+1)).join("")}</ul>`:"")+
     `</li>`;
  }
  const roots=(kids[""]||[]).concat(orphans);
  el.innerHTML=`<div style="margin-top:10px"><div class="muted" style="margin-bottom:6px">Role hierarchy — ${roles.length} role${roles.length===1?"":"s"}. Sharing rules grant users visibility into records owned by their subordinates.</div>`+
   (roots.length?`<ul style="list-style:none;margin:0;padding:0">${roots.map(r=>node(r,0)).join("")}</ul>`:`<p class="muted">No roles.</p>`)+`</div>`;
  el._roles=roles;
}

  const body={label:document.getElementById("ofe_label").value.trim(),help_text:document.getElementById("ofe_help").value.trim(),required:document.getElementById("ofe_req").checked};
  const lenEl=document.getElementById("ofe_len"); if(lenEl&&lenEl.value) body.length=parseInt(lenEl.value,10);
  const pkEl=document.getElementById("ofe_pick"); if(pkEl) body.picklist_values=pkEl.value.split(",").map(s=>s.trim()).filter(Boolean);
  if(!body.label){ document.getElementById("oferr").innerHTML=`<div class="err">Label cannot be blank.</div>`; return; }
  const r=await api("PUT","/api/admin/objects/"+encodeURIComponent(obj)+"/fields/"+encodeURIComponent(fname),body);
  document.getElementById("oferr").innerHTML=r.ok?`<div class="ok">Field updated.</div>`:`<div class="err">${esc(r.data.error||"Failed")}</div>`;
  if(r.ok) listObjectFields();
}
async function deleteObject(){
  const obj=v("of_obj"); if(!obj) return;
  if(!confirm(`Delete the custom object '${obj}' and all its field definitions? This is permanent and cannot be undone. The delete is refused while any records of this object still exist — delete those records first.`)) return;
  const r=await api("DELETE","/api/admin/objects/"+encodeURIComponent(obj));
  document.getElementById("oferr").innerHTML=r.ok?`<div class="ok">Object deleted.</div>`:`<div class="err">${esc(r.data.error||"Failed")}</div>`;
  if(r.ok){ loadObjects(); listObjectFields(); }
}

/* ---------- Page layouts: visual editor + assignment list ---------- */
let LE={fields:[],sections:[],related:[]}, LE_ALL=[], LE_TAB="v";
async function leFields(){
  const obj=v("al_obj"); if(!obj) return;
  const d=await getDesc(obj).catch(()=>null);
  LE.fields=(d&&d.fields)||[];
  leRenderSections();
}
function leTab(which){
  LE_TAB=which;
  document.getElementById("le_visual").style.display=which==="v"?"":"none";
  document.getElementById("le_json").style.display=which==="j"?"":"none";
  document.getElementById("le_tabV").className="btn secondary small"+(which==="v"?"":"");
  if(which==="j") document.getElementById("al_json").value=JSON.stringify(leSerialize(),null,2);
  else{ try{ leDeserialize(JSON.parse(document.getElementById("al_json").value||"{}")); }catch(e){} }
}
function leSerialize(){
  return {sections:LE.sections.map(s=>{
    const cols=Array.from({length:s.columns||2},()=>[]);
    s.fields.forEach((fn,k)=>cols[k%(s.columns||2)].push(fn));
    return {title:s.title,columns:cols};
  }),related_lists:LE.related.slice()};
}
function leDeserialize(lay){
  const secs=(lay&&lay.sections)||[];
  LE.sections=secs.map(s=>({title:s.title||"Section",columns:(s.columns||[[]]).length,fields:(s.columns||[]).flat()}));
  if(!LE.sections.length) LE.sections=[{title:"Details",columns:2,fields:[]}];
  LE.related=((lay&&lay.related_lists)||[]).slice();
  leRenderSections();
}
function leRenderSections(){
  const host=document.getElementById("le_sections"); if(!host) return;
  host.innerHTML=LE.sections.map((s,i)=>`<div style="margin:8px 0;padding:8px;border:1px solid #d5dae2;border-radius:6px" ondragover="event.preventDefault()" ondrop="leDrop(event,${i})">
    <div class="btnrow"><input value="${esc(s.title)}" onchange="LE.sections[${i}].title=this.value" style="max-width:200px;font-weight:bold" aria-label="Section title"><span style="flex:1"></span>
    <label style="margin:0">Columns <select onchange="LE.sections[${i}].columns=+this.value;leRenderSections()"><option value="1" ${s.columns===1?"selected":""}>1</option><option value="2" ${s.columns!==1?"selected":""}>2</option></select></label>
    <button class="btn danger small" onclick="leDelSection(${i})">Remove</button></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;min-height:44px;border:1px dashed #aab3c0;border-radius:6px;padding:6px;margin-top:6px">
    ${s.fields.map(fn=>{const f=LE.fields.find(x=>x.name===fn)||{label:fn};return `<span class="pill" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','move:${i}:${fn}')" style="cursor:grab" title="Drag to move">${esc(f.label)} <a href="#" onclick="leUnplace(${i},'${fn}');return false" title="Remove from section">×</a></span>`;}).join("")||`<span class="muted" style="padding:6px">Drop fields here</span>`}
    </div></div>`).join("");
  const used=new Set(LE.sections.flatMap(s=>s.fields));
  document.getElementById("le_palette").innerHTML=LE.fields.filter(f=>!used.has(f.name)).map(f=>
    `<span class="pill" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${f.name}')" style="cursor:grab" title="${esc(f.label)} — ${esc(f.type)}">${esc(f.label)}</span>`).join("")||`<span class="muted">All fields are placed in sections.</span>`;
  document.getElementById("le_related").innerHTML=LE.related.map((o,i)=>`<span class="pill">${esc(o)} <a href="#" onclick="LE.related.splice(${i},1);leRenderSections();return false" title="Remove">×</a></span>`).join("")||`<span class="muted">None</span>`;
}
function leDrop(ev,i){
  ev.preventDefault();
  let data=""; try{ data=ev.dataTransfer.getData("text/plain"); }catch(e){}
  if(!data) return;
  let fn=data;
  if(data.startsWith("move:")){ const parts=data.split(":"); const fi=+parts[1]; fn=parts.slice(2).join(":"); LE.sections[fi].fields=LE.sections[fi].fields.filter(x=>x!==fn); }
  if(!LE.sections[i].fields.includes(fn)) LE.sections[i].fields.push(fn);
  leRenderSections();
}
function leUnplace(i,fn){ LE.sections[i].fields=LE.sections[i].fields.filter(x=>x!==fn); leRenderSections(); }
function leAddSection(){ LE.sections.push({title:"New section",columns:2,fields:[]}); leRenderSections(); }
function leDelSection(i){ LE.sections.splice(i,1); leRenderSections(); }
function leAddRelated(){
  const oN=document.getElementById("le_rel_new").value.trim();
  if(oN&&!LE.related.includes(oN)) LE.related.push(oN);
  document.getElementById("le_rel_new").value="";
  leRenderSections();
}
async function leList(){
  const el=document.getElementById("le_list"); if(!el) return;
  const r=await api("GET","/api/admin/layouts");
  LE_ALL=r.ok?(r.data||[]):[];
  el.innerHTML=LE_ALL.length?`<table><tr><th>Object</th><th>Profile</th><th>Record type</th><th>Sections</th><th></th></tr>${LE_ALL.map((l,i)=>`<tr><td>${esc(l.object)}</td><td>${esc(l.profile)}</td><td>${esc(l.record_type)}</td><td>${l.sections}</td><td style="white-space:nowrap"><button class="btn secondary small" onclick="leEdit(${i})">Edit</button> <button class="btn danger small" onclick="leDel(${i})">Delete</button></td></tr>`).join("")}</table>`:`<p class="muted">No saved layouts.</p>`;
}
function leEdit(i){
  const l=LE_ALL[i]; if(!l) return;
  document.getElementById("al_obj").value=l.object;
  document.getElementById("al_prof").value=l.profile;
  document.getElementById("al_rt").value=l.record_type==="Default"?"":l.record_type;
  leFields().then(()=>{ leDeserialize(l); leTab("v"); });
}
async function leDel(i){
  const l=LE_ALL[i]; if(!l) return;
  if(!confirm(`Delete the layout for ${l.object} / ${l.profile} / ${l.record_type}? Records will fall back to the default field arrangement.`)) return;
  const q=`?object=${encodeURIComponent(l.object)}&profile=${encodeURIComponent(l.profile)}&record_type=${encodeURIComponent(l.record_type)}`;
  const r=await api("DELETE","/api/admin/layouts"+q);
  document.getElementById("alerr").innerHTML=r.ok&&r.data.deleted?`<div class="ok">Layout deleted.</div>`:`<div class="err">${esc((r.data&&r.data.error)||"Failed")}</div>`;
  leList();
}
async function leLoad(){
  const obj=v("al_obj"), prof=v("al_prof"), rt=v("al_rt")||"Default";
  await leList();
  const l=LE_ALL.find(x=>x.object===obj&&x.profile===prof&&x.record_type===rt);
  await leFields();
  leDeserialize(l||{sections:[],related_lists:[]});
  document.getElementById("alerr").innerHTML=l?`<div class="ok">Layout loaded into the editor.</div>`:`<div class="ok">No saved layout for this assignment — starting from a blank canvas.</div>`;
  leTab("v");
}
async function leSave(){
  let layout;
  if(LE_TAB==="j"){
    try{ layout=JSON.parse(v("al_json")); }catch(e){ document.getElementById("alerr").innerHTML=`<div class="err">Invalid JSON.</div>`; return; }
  }else layout=leSerialize();
  const r=await api("POST","/api/admin/layouts",{object:v("al_obj"),profile:v("al_prof"),record_type:v("al_rt")||"Default",sections:layout.sections||[],related_lists:layout.related_lists||[]});
  document.getElementById("alerr").innerHTML=r.ok?`<div class="ok">Layout saved.</div>`:`<div class="err">${esc(r.data.error||"Failed")}</div>`;
  if(r.ok) leList();
}
async function createPermissionSet(){

  if(!r.ok){ document.getElementById("pserr").innerHTML=`<div class="err">${esc(r.data.error||"Failed")}</div>`; return; }

async function importCsv(){
  const file=document.getElementById("im_file").files[0];
  if(!file){ document.getElementById("imperr").innerHTML=`<div class="err">Choose a CSV file first.</div>`; return; }
  const fd=new FormData(); fd.append("file",file);
  const mode=v("im_mode"), ext=v("im_ext"), dup=v("im_dup");
  const r=await fetch(`/api/admin/import/${v("im_obj")}?mode=${mode}&external_id_field=${encodeURIComponent(ext)}&on_duplicate=${dup}`,{method:"POST",headers:{"Authorization":"Bearer "+token},body:fd}).then(r=>r.json());
  const el=document.getElementById("imperr"); if(el) el.innerHTML="";
  document.getElementById("im_result").innerHTML=`<div class="${r.failed?"err":"ok"}" style="margin-top:10px">Created ${r.created||0}, updated ${r.updated||0}, skipped ${r.skipped||0}, failed ${r.failed}.</div>`+
   (r.error_csv_url&&r.failed?`<div class="btnrow" style="margin-top:8px"><a class="btn secondary small" href="${esc(r.error_csv_url)}" download>Download failed rows (${r.failed})</a><button class="btn secondary small" onclick="importRetry('${r.run_id}')">Retry failed rows</button></div>`:"")+
   (r.errors&&r.errors.length?`<table style="margin-top:8px"><tr><th>CSV row</th><th>Error</th></tr>${r.errors.map(e=>`<tr><td>${e.row}</td><td>${esc((e.details||[]).join("; "))}</td></tr>`).join("")}</table>`:"");
  importRunsList();
}
async function importRunsList(){
  const el=document.getElementById("im_runs"); if(!el) return;
  const r=await api("GET","/api/admin/import-runs"); const runs=r.ok&&Array.isArray(r.data)?r.data:[];
  el.innerHTML=runs.length?`<table><tr><th>When</th><th>Object</th><th>Mode</th><th>Created</th><th>Updated</th><th>Skipped</th><th>Failed</th><th></th></tr>`+
   runs.map(x=>`<tr><td>${esc((x.created_at||"").slice(0,16).replace("T"," "))}</td><td>${esc(x.object||"")}</td><td>${esc(x.mode||"")}${x.on_duplicate&&x.on_duplicate!=="insert"?" / "+esc(x.on_duplicate):""}</td><td>${x.created||0}</td><td>${x.updated||0}</td><td>${x.skipped||0}</td><td>${x.failed||0}</td><td style="white-space:nowrap">${x.failed?`<button class="btn secondary small" onclick="importRetry('${x.id}')">Retry</button> `:""}<a class="btn secondary small" href="/api/admin/import-runs/${x.id}/errors.csv" download>Errors CSV</a></td></tr>`).join("")+`</table>`:`<p class="muted">No imports yet.</p>`;
}
async function importRetry(rid){
  if(!confirm("Retry the failed rows of this import run?")) return;
  const r=await api("POST",`/api/admin/import-runs/${rid}/retry`);
  if(!r.ok){ toast("Retry failed: "+(r.data&&r.data.error||r.status),"error"); return; }
  const d=r.data||{};
  toast(`Retry: ${d.created||0} created, ${d.updated||0} updated, ${d.skipped||0} skipped, ${d.failed||0} still failing.`,d.failed?"info":"ok");
  importRunsList();
}

/* ---------- Delegated administration groups ---------- */
const DG_SCOPES=[["users","Manage users"],["passwords","Reset passwords / unlock"],["profiles","Manage profiles"],["roles","Manage roles"]];
let DG_EDIT=null, DG_CACHE=[];
async function dgInit(){
  const ur=await api("GET","/api/admin/users");
  const users=(ur.data&&ur.data.rows)||ur.data||[];
  document.getElementById("dg_members").innerHTML=users.length?users.map(u=>`<label style="display:block;font-weight:normal;margin:2px 0"><input type="checkbox" data-dg-user="${u.id}" style="width:auto"> ${esc(u.username)}</label>`).join(""):`<span class="muted">No users.</span>`;
  document.getElementById("dg_scopes").innerHTML=DG_SCOPES.map(s=>`<label style="display:block;font-weight:normal;margin:4px 0"><input type="checkbox" data-dg-scope="${s[0]}" style="width:auto"> ${s[1]}</label><input data-dg-roles="${s[0]}" placeholder="Limit to roles (comma-separated, blank = any)" style="margin:-2px 0 6px 22px;max-width:280px">`).join("");
  dgList();
}
async function dgList(){
  const el=document.getElementById("dg_list"); if(!el) return;
  const r=await api("GET","/api/admin/delegated-groups"); DG_CACHE=r.ok&&Array.isArray(r.data)?r.data:[];
  el.innerHTML=DG_CACHE.length?`<table style="margin-top:10px"><tr><th>Group</th><th>Scopes</th><th>Members</th><th></th></tr>`+
   DG_CACHE.map(g=>`<tr><td><b>${esc(g.name)}</b>${g.description?`<div class="muted">${esc(g.description)}</div>`:""}</td><td>${(g.scopes||[]).map(s=>esc(s.scope)+(s.roles&&s.roles.length?` (${s.roles.map(esc).join(", ")})`:"")).join("<br>")||"—"}</td><td>${(g.member_usernames||[]).map(esc).join(", ")||"—"}</td><td style="white-space:nowrap"><button class="btn secondary small" onclick="dgEdit('${g.id}')">Edit</button> <button class="btn danger small" onclick="dgDel('${g.id}')">Delete</button></td></tr>`).join("")+`</table>`:`<p class="muted">No delegated groups yet.</p>`;
}
async function dgSave(){
  const errEl=document.getElementById("dgerr"); errEl.innerHTML="";
  const name=v("dg_name"); if(!name){ errEl.innerHTML=`<div class="err">Group name is required.</div>`; return; }
  const members=[...document.querySelectorAll("[data-dg-user]:checked")].map(c=>c.dataset.dgUser);
  const scopes=DG_SCOPES.filter(s=>document.querySelector(`[data-dg-scope="${s[0]}"]`).checked).map(s=>{
    const roles=(document.querySelector(`[data-dg-roles="${s[0]}"]`).value||"").split(",").map(x=>x.trim()).filter(Boolean);
    return roles.length?{scope:s[0],roles}:{scope:s[0]};
  });
  const body={name,description:v("dg_desc"),members,scopes};
  const r=DG_EDIT
    ?await api("PUT","/api/admin/delegated-groups/"+DG_EDIT,body)
    :await api("POST","/api/admin/delegated-groups",body);
  if(!r.ok){ errEl.innerHTML=`<div class="err">${esc((r.data||{}).error||"Failed")}${r.data&&r.data.details?`: ${esc(r.data.details.join("; "))}`:""}</div>`; return; }
  toast(DG_EDIT?"Group saved.":"Group created.","ok"); dgCancel(); dgList();
}
function dgEdit(id){
  const g=DG_CACHE.find(x=>x.id===id); if(!g) return;
  DG_EDIT=id;
  document.getElementById("dg_name").value=g.name||"";
  document.getElementById("dg_desc").value=g.description||"";
  document.querySelectorAll("[data-dg-user]").forEach(c=>{ c.checked=(g.members||[]).includes(c.dataset.dgUser); });
  DG_SCOPES.forEach(s=>{
    const entry=(g.scopes||[]).find(e=>e.scope===s[0]);
    document.querySelector(`[data-dg-scope="${s[0]}"]`).checked=!!entry;
    document.querySelector(`[data-dg-roles="${s[0]}"]`).value=entry&&entry.roles?entry.roles.join(", "):"";
  });
  document.getElementById("dg_submit").textContent="Save changes";
  document.getElementById("dg_cancel").style.display="";
  document.getElementById("dg_submit").scrollIntoView({behavior:"smooth",block:"center"});
}
function dgCancel(){
  DG_EDIT=null;
  document.getElementById("dg_name").value=""; document.getElementById("dg_desc").value="";
  document.querySelectorAll("[data-dg-user]").forEach(c=>{ c.checked=false; });
  document.querySelectorAll("[data-dg-scope]").forEach(c=>{ c.checked=false; });
  document.querySelectorAll("[data-dg-roles]").forEach(c=>{ c.value=""; });
  document.getElementById("dg_submit").textContent="Create group";
  document.getElementById("dg_cancel").style.display="none";
  document.getElementById("dgerr").innerHTML="";
}
async function dgDel(id){
  if(!confirm("Delete this delegated group? Members lose their delegated scopes.")) return;
  const r=await api("DELETE","/api/admin/delegated-groups/"+id);
  r.ok?(toast("Deleted.","ok"),dgList()):toast("Failed: "+(r.data&&r.data.error||r.status),"error");
}
/* ---------- Test data seeding ---------- */
let SD_EDIT=null, SD_CACHE=[];
async function sdList(){
  const el=document.getElementById("sd_list"); if(!el) return;
  const r=await api("GET","/api/admin/seed-templates"); SD_CACHE=r.ok&&Array.isArray(r.data)?r.data:[];

   SD_CACHE.map(t=>`<tr><td><b>${esc(t.name)}</b>${t.active?"":' <span class="pill pill-off">Inactive</span>'}</td><td>${esc(t.object||"")}</td><td>${t.count||0}</td><td>${t.last_run?esc(String(t.last_run.at).slice(0,16).replace("T"," "))+" — "+t.last_run.created+" created":"—"}</td><td style="white-space:nowrap"><button class="btn small" onclick="sdRun('${t.id}')">Run</button> <button class="btn secondary small" onclick="sdEdit('${t.id}')">Edit</button> <button class="btn danger small" onclick="sdDel('${t.id}')">Delete</button></td></tr>`).join("")+`</table>`:`<p class="muted">No seed templates yet.</p>`;

async function sdSave(){
  const errEl=document.getElementById("sderr"); errEl.innerHTML="";

  const r=SD_EDIT?await api("PUT","/api/admin/seed-templates/"+SD_EDIT,body):await api("POST","/api/admin/seed-templates",body);

  toast(SD_EDIT?"Template saved.":"Template created.","ok"); sdCancel(); sdList();
}
function sdEdit(id){

  SD_EDIT=id;
  document.getElementById("sd_name").value=t.name||"";
  document.getElementById("sd_obj").value=t.object||"";

  document.getElementById("sd_cancel").style.display="";
  document.getElementById("sd_submit").scrollIntoView({behavior:"smooth",block:"center"});
}
function sdCancel(){
  SD_EDIT=null;

  document.getElementById("sd_rules").value=""; document.getElementById("sd_active").checked=true;
  document.getElementById("sd_submit").textContent="Create template";
  document.getElementById("sd_cancel").style.display="none";
  document.getElementById("sderr").innerHTML="";
}
async function sdDel(id){
  if(!confirm("Delete this seed template?")) return;
  const r=await api("DELETE","/api/admin/seed-templates/"+id);
  r.ok?(toast("Deleted.","ok"),sdList()):toast("Failed: "+(r.data&&r.data.error||r.status),"error");
}
async function sdRun(id){
  const t=SD_CACHE.find(x=>x.id===id);
  if(!confirm(`Run template "${t?t.name:id}"? This writes ${t?t.count:""} real ${(t&&t.object)||""} records.`)) return;
  const r=await api("POST",`/api/admin/seed-templates/${id}/run`,{confirm:true});
  if(!r.ok){ toast("Run failed: "+(r.data&&r.data.error||r.status),"error"); return; }
  const d=r.data||{};
  toast(`Seeded ${d.created||0} record(s)${d.failed?`, ${d.failed} failed`:""}.`,d.failed?"info":"ok");
  sdList();
}

async function tbSave(){

function auditQuery(extra){
  const q=new URLSearchParams();
  if(AUD.user)q.set("user",AUD.user); if(AUD.action)q.set("action",AUD.action);
  if(AUD.entity)q.set("entity",AUD.entity); if(AUD.from)q.set("from",AUD.from);
  if(AUD.to)q.set("to",AUD.to);
  if(extra) for(const k in extra) q.set(k,extra[k]);
  return q.toString();
}
async function showAudit(){
  const r=await api("GET","/api/admin/audit-trail?"+auditQuery({limit:AUD.limit,offset:AUD.offset}));
  const d=r.data||{rows:[],total:0}; AUD.total=d.total;
  const page=Math.floor(AUD.offset/AUD.limit)+1, pages=Math.max(1,Math.ceil(AUD.total/AUD.limit));
  document.getElementById("audit_view").innerHTML=`
  <div class="btnrow" style="margin-top:10px;flex-wrap:wrap">
    <input id="af_user" placeholder="User" value="${esc(AUD.user)}" style="max-width:130px" onkeydown="if(event.key==='Enter')auditApply()">
    <input id="af_action" placeholder="Action" value="${esc(AUD.action)}" style="max-width:130px" onkeydown="if(event.key==='Enter')auditApply()">
    <input id="af_entity" placeholder="Entity type/name" value="${esc(AUD.entity)}" style="max-width:160px" onkeydown="if(event.key==='Enter')auditApply()">
    <input id="af_from" type="date" value="${esc(AUD.from)}" style="max-width:150px" title="From date">
    <input id="af_to" type="date" value="${esc(AUD.to)}" style="max-width:150px" title="To date">
    <button class="btn secondary small" onclick="auditApply()">Filter</button>
    <button class="btn secondary small" onclick="auditClear()">Clear</button>
    <span style="flex:1"></span>
    <button class="btn secondary small" onclick="downloadCsv('/api/admin/audit-trail/export?'+auditQuery(),'audit-trail.csv')">Export CSV</button>
  </div>
  <table style="margin-top:10px"><tr><th>When</th><th>Who</th><th>Action</th><th>What</th></tr>${(d.rows||[]).map(a=>`<tr><td>${esc((a.at||"").slice(0,19).replace("T"," "))}</td><td>${esc(a.username)}</td><td>${esc(a.action)}</td><td>${esc(a.entity_type+": "+a.entity_name)}</td></tr>`).join("")}</table>
  <div class="btnrow" style="margin-top:8px"><span class="muted">${AUD.total} entr${AUD.total===1?"y":"ies"} — page ${page} of ${pages}</span><span style="flex:1"></span>
  <button class="btn secondary small" ${AUD.offset===0?"disabled":""} onclick="AUD.offset=Math.max(0,AUD.offset-AUD.limit);showAudit()">← Prev</button>
  <button class="btn secondary small" ${AUD.offset+AUD.limit>=AUD.total?"disabled":""} onclick="AUD.offset+=AUD.limit;showAudit()">Next →</button></div>`;
}
function auditApply(){
  AUD.user=document.getElementById("af_user").value.trim();
  AUD.action=document.getElementById("af_action").value.trim();
  AUD.entity=document.getElementById("af_entity").value.trim();
  AUD.from=document.getElementById("af_from").value;
  AUD.to=document.getElementById("af_to").value;
  AUD.offset=0; showAudit();
}
function auditClear(){ AUD={user:"",action:"",entity:"",from:"",to:"",limit:50,offset:0,total:0}; showAudit(); }

let EMLOG_PAGE=0; const EMLOG_SIZE=20;
async function showEmailLog(){
  const q={limit:EMLOG_SIZE,offset:EMLOG_PAGE*EMLOG_SIZE};
  const to=document.getElementById("em_to"), tpl=document.getElementById("em_tpl"),
        df=document.getElementById("em_from"), dt=document.getElementById("em_to2");
  if(to&&to.value) q.to=to.value; if(tpl&&tpl.value) q.template=tpl.value;
  if(df&&df.value) q.date_from=df.value; if(dt&&dt.value) q.date_to=dt.value;
  const qs=Object.entries(q).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join("&");
  const r=await api("GET","/api/admin/email-log?"+qs);
  const rows=(r.data&&r.data.rows)||[], total=(r.data&&r.data.total)||0;
  const pages=Math.max(1,Math.ceil(total/EMLOG_SIZE));
  document.getElementById("em_log").innerHTML=`<div class="btnrow" style="margin:8px 0"><input id="em_to" placeholder="To contains…" value="${to?esc(to.value):""}" style="max-width:160px"><input id="em_tpl" placeholder="Template…" value="${tpl?esc(tpl.value):""}" style="max-width:140px"><input id="em_from" type="date" value="${df?df.value:""}" style="max-width:140px"><input id="em_to2" type="date" value="${dt?dt.value:""}" style="max-width:140px"><button class="btn secondary small" onclick="EMLOG_PAGE=0;showEmailLog()">Apply</button></div>`+
   `<table style="margin-top:6px"><tr><th>When</th><th>To</th><th>Subject</th><th>Template</th></tr>${rows.map(e=>`<tr><td>${esc((e.sent_at||"").slice(0,16).replace("T"," "))}</td><td>${esc(e.recipient)}</td><td>${esc(e.subject)}</td><td>${esc(e.template||"—")}</td></tr>`).join("")||`<tr><td colspan="4" class="muted">No emails match.</td></tr>`}</table>`+
   `<div class="btnrow" style="margin-top:8px"><span class="muted">${total} email${total===1?"":"s"} — page ${EMLOG_PAGE+1} of ${pages}</span><span style="flex:1"></span><button class="btn secondary small" ${EMLOG_PAGE===0?"disabled":""} onclick="EMLOG_PAGE--;showEmailLog()">← Prev</button> <button class="btn secondary small" ${EMLOG_PAGE+1>=pages?"disabled":""} onclick="EMLOG_PAGE++;showEmailLog()">Next →</button></div>`;
}

async function importPkg(){

  if(!f){ document.getElementById("pkgerr").innerHTML=`<div class="err">Choose a package file first.</div>`; return; }
  let pkg; try{ pkg=JSON.parse(await f.text()); }catch(e){ document.getElementById("pkgerr").innerHTML=`<div class="err">Not valid JSON.</div>`; return; }

function editApp(id){

  const utilOpts=Object.entries(APP_UTILS).map(([k,v])=>`<option value="utility:${k}">${esc(v[2])} (utility)</option>`).join("")
   +`<option value="utility:bulk">Bulk Jobs (utility, admin)</option><option value="utility:admin">Admin Setup (utility, admin)</option>`;

  host.innerHTML=`<div class="card" style="border:2px solid var(--blue)"><div class="section-title">${id?"Edit app":"New app"}</div><div id="ae_err"></div>
   <div class="grid2"><div>
     <label>Label</label><input id="ae_label" value="${esc(e.label)}">
     <label>API name</label><input id="ae_name" value="${esc(e.name)}" ${id?"disabled":""}>
     <label>Description</label><input id="ae_desc" value="${esc(e.description)}">
   </div><div>
     <label>Color</label><input id="ae_color" type="color" value="${esc(e.color||"#1f6feb")}">
     <label>Sort order</label><input id="ae_sort" type="number" value="${e.sort_order||0}">

   </div></div>
   <div class="section-title" style="margin-top:8px">Tabs <span class="muted" style="font-weight:400">— order, layout override &amp; related lists per tab</span></div>
   <div id="ae_tabs"></div>
   <div class="btnrow"><select id="ae_addref" style="width:auto;max-width:280px">${objOpts}${utilOpts}</select>
   <button class="btn secondary small" onclick="appAddTab()">+ Add tab</button></div>
   <div class="section-title" style="margin-top:8px">Profile access <span class="muted" style="font-weight:400">— empty = visible to everyone</span></div>
   <div id="ae_profiles" class="grid2">${APPMGR.profiles.map(p=>{const c=(e.profile_access||{})[p]||{};
     return `<label style="font-weight:400"><input type="checkbox" data-prof="${esc(p)}" data-k="visible" style="width:auto" ${c.visible?"checked":""}> ${esc(p)}
     <span class="muted">· default <input type="radio" name="ae_def" data-prof="${esc(p)}" style="width:auto" ${c.default?"checked":""}></span></label>`}).join("")||'<p class="muted">No profiles found.</p>'}</div>

  renderAppTabRows();

}
function renderAppTabRows(){
  const e=APPMGR.editing.app, host=document.getElementById("ae_tabs");
  if(!e.tabs.length){ host.innerHTML='<p class="muted">No tabs yet — add one above.</p>'; return; }
  host.innerHTML=e.tabs.map((t,i)=>{
    const isObj=t.kind==="object";
    const lbl=isObj?((objects.find(o=>o.name===t.ref)||{}).plural||t.ref):(APP_UTILS[t.ref]?APP_UTILS[t.ref][2]:t.ref);
    const relOpts=objects.map(o=>`<option value="${o.name}" ${(t.related_lists||[]).includes(o.name)?"selected":""}>${esc(o.plural)}</option>`).join("");
    const profOpts=`<option value="">— profile default layout —</option>`+APPMGR.profiles.map(p=>`<option ${t.layout&&t.layout.profile===p?"selected":""}>${esc(p)}</option>`).join("");
    return `<div class="card" style="margin:6px 0;padding:10px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <b>${i+1}. ${esc(t.label||lbl)}</b><span class="muted">${t.kind}: ${esc(t.ref)}</span><span style="margin-left:auto"></span>
     <button class="btn secondary small" onclick="appTabMove(${i},-1)" ${i===0?"disabled":""}>↑</button>
     <button class="btn secondary small" onclick="appTabMove(${i},1)" ${i===e.tabs.length-1?"disabled":""}>↓</button>
     <button class="btn secondary small" onclick="appTabDel(${i})">✕</button></div>
     <div class="grid2" style="margin-top:8px"><div>
       <label>Tab label override</label><input data-tab="${i}" data-k="label" value="${esc(t.label||"")}" placeholder="${esc(lbl)}">
       ${isObj?`<label>Page layout override (use another profile's layout)</label><select data-tab="${i}" data-k="layout_profile">${profOpts}</select>`:'<p class="muted">Layout &amp; related lists apply to object tabs.</p>'}
     </div><div>${isObj?`<label>Related lists <span class="muted">— none selected = all</span></label><select multiple data-tab="${i}" data-k="related_lists" style="height:96px">${relOpts}</select>`:""}</div></div></div>`;
  }).join("");
}
function appAddTab(){
  const v=document.getElementById("ae_addref").value, [kind,ref]=v.split(":");
  collectAppTabEdits();
  APPMGR.editing.app.tabs.push({kind,ref,label:null,layout:null,related_lists:null});
  renderAppTabRows();
}
function appTabMove(i,d){ collectAppTabEdits(); const t=APPMGR.editing.app.tabs, j=i+d; if(j<0||j>=t.length) return; [t[i],t[j]]=[t[j],t[i]]; renderAppTabRows(); }
function appTabDel(i){ collectAppTabEdits(); APPMGR.editing.app.tabs.splice(i,1); renderAppTabRows(); }
function collectAppTabEdits(){
  const ed=APPMGR.editing; if(!ed) return; const e=ed.app;
  document.querySelectorAll("#ae_tabs [data-tab]").forEach(el=>{
    const i=+el.dataset.tab, k=el.dataset.k, t=e.tabs[i]; if(!t) return;
    if(k==="label") t.label=el.value.trim()||null;
    if(k==="layout_profile") t.layout=el.value?{profile:el.value,record_type:"Default"}:null;
    if(k==="related_lists"){ const s=[...el.selectedOptions].map(o=>o.value); t.related_lists=s.length?s:null; }
  });
  e.profile_access={};
  document.querySelectorAll("#ae_profiles [data-prof]").forEach(el=>{
    const p=el.dataset.prof; e.profile_access[p]=e.profile_access[p]||{visible:false,default:false};
    if(el.dataset.k==="visible") e.profile_access[p].visible=el.checked;
    else e.profile_access[p].default=el.checked;
  });
  for(const p of Object.keys(e.profile_access))
    if(!e.profile_access[p].visible&&!e.profile_access[p].default) delete e.profile_access[p];
}
async function saveApp(){
  collectAppTabEdits();
  const e=APPMGR.editing.app, err=document.getElementById("ae_err");
  const body={name:document.getElementById("ae_name").value.trim(), label:document.getElementById("ae_label").value.trim(),
    description:document.getElementById("ae_desc").value.trim(),
    color:document.getElementById("ae_color").value, sort_order:+document.getElementById("ae_sort").value||0,
    active:document.getElementById("ae_active").checked, tabs:e.tabs, profile_access:e.profile_access};
  const id=APPMGR.editing.id;
  const r=id?await api("PUT",`/api/admin/apps/${id}`,body):await api("POST","/api/admin/apps",body);
  if(!r.ok){ err.innerHTML=`<div class="err">${esc(r.data.error||("HTTP "+r.status))}</div>`; return; }
  toast("App saved.","ok"); await refreshAppMgr(); await refreshUserApps();
}
async function delApp(id){ if(!confirm("Delete this app? Users fall back to their next visible app."))return;
  const r=await api("DELETE",`/api/admin/apps/${id}`); if(r.ok){toast("App deleted.","ok"); await refreshAppMgr(); await refreshUserApps();}else toast("Delete failed.","error"); }

async function createBulkJob(){
  const body={object:document.getElementById("bulk_obj").value, operation:document.getElementById("bulk_op").value,
    externalIdFieldName:document.getElementById("bulk_ext").value.trim()||undefined};
  const r=await api("POST","/api/bulk/jobs",body);
  if(!r.ok){ document.getElementById("bulkerr").innerHTML=`<div class="err">${esc(r.data.error||"Failed")}</div>`; return; }
  const csv=document.getElementById("bulk_csv").value;
  if(csv.trim()){
    const up=await fetch(`/api/bulk/jobs/${r.data.id}`,{method:"PUT",headers:{...H(),"Content-Type":"text/csv"},body:csv});
    if(!up.ok){ document.getElementById("bulkerr").innerHTML=`<div class="err">Upload failed.</div>`; }
  }
  document.getElementById("bulk_csv").value="";
  await listBulkJobs();
}
async function listBulkJobs(){
  const r=await api("GET","/api/bulk/jobs");
  const host=document.getElementById("bulk_list"); if(!host) return;
  host.innerHTML=(r.data||[]).map(j=>`<div class="rowline"><b>${esc(j.object)}</b><span class="muted">${esc(j.operation)} · ${esc(j.state)} · ${j.state==="Open"?(j.row_count||0)+" uploaded":(j.processed||0)+" processed"} (${j.succeeded||0} ok, ${j.failed||0} failed)</span><span style="margin-left:auto"></span>
    ${j.state==="Open"?`<button class="btn secondary small" onclick="closeBulkJob('${j.id}')">Close &amp; run</button>`:""}
    ${["Open","UploadComplete","InProgress"].includes(j.state)?`<button class="btn secondary small" onclick="abortBulkJob('${j.id}')">Abort</button>`:""}
    ${j.state==="JobComplete"?`<button class="btn secondary small" onclick="dlBulk('${j.id}','successful')">✓ CSV</button><button class="btn secondary small" onclick="dlBulk('${j.id}','failed')">✗ CSV</button>`:""}
    </div>`).join("")||`<p class="muted">No jobs yet.</p>`;
}
async function closeBulkJob(id){ const r=await api("PATCH",`/api/bulk/jobs/${id}`,{state:"UploadComplete"});

async function abortBulkJob(id){ await api("DELETE",`/api/bulk/jobs/${id}`); await listBulkJobs(); }

let STREAM_SRC=null;
function startStream(){
  stopStream();
  const topics=document.getElementById("st_topics").value.trim();
  const log=document.getElementById("stream_log");
  log.innerHTML=`<p class="muted">Listening…</p>`;
  const es=new EventSource(`/api/streaming?access_token=${encodeURIComponent(token)}${topics?`&topics=${encodeURIComponent(topics)}`:""}`);
  STREAM_SRC=es;
  const show=e=>{
    const div=document.createElement("div"); div.className="rowline";
    div.innerHTML=`<b>${esc(e.type==="message"?"event":e.type)}</b> <code>${esc(""+(e.lastEventId||""))}</code><span class="muted" style="word-break:break-all">${esc(e.data.slice(0,300))}</span>`;
    log.prepend(div);
    while(log.children.length>60) log.lastChild.remove();
  };
  es.onmessage=show; // unnamed events
  topics.split(",").forEach(t=>{ t=t.trim(); if(t) es.addEventListener(t,show); }); // named topic events
  es.onerror=()=>{ const d=document.createElement("div"); d.innerHTML=`<div class="err">Stream error / disconnected.</div>`; log.prepend(d); stopStream(); };
}
function stopStream(){ if(STREAM_SRC){ STREAM_SRC.close(); STREAM_SRC=null; } }

  const r=await api("POST","/api/admin/metadata-types",{label:document.getElementById("cmdt_label").value.trim(),

  document.getElementById("cmdterr").innerHTML=""; await listCmdt();

async function listCmdt(){
  const r=await api("GET","/api/admin/metadata-types");
  const host=document.getElementById("cmdt_list"); if(!host) return;
  let html="";
  for(const t of (r.data||[])){
    const d=await api("GET",`/api/admin/metadata-types/${t.id}`);
    const recs=(d.data&&d.data.records)||[];
    html+=`<div class="rowline" style="align-items:flex-start;flex-direction:column"><div style="display:flex;gap:8px;align-items:center;width:100%"><b>${esc(t.label)}</b><code>${esc(t.api_name)}</code><span class="muted">${(t.fields||[]).map(f=>esc(f.name+":"+f.type)).join(", ")}</span><span style="margin-left:auto"></span><button class="btn secondary small" onclick="delCmdt('${t.id}')">Delete type</button></div>
    <div style="margin-top:6px;width:100%">${recs.map(x=>`<div class="rowline"><code>${esc(x.developer_name)}</code><span class="muted">${esc(JSON.stringify(x.values))}</span><span style="margin-left:auto"></span><button class="btn secondary small" onclick="delCmdtRecord('${x.id}')">✕</button></div>`).join("")}
    <div class="grid2" style="margin-top:6px"><div><input id="cmdtr_name_${t.id}" placeholder="DeveloperName"></div><div><input id="cmdtr_vals_${t.id}" placeholder='Values JSON, e.g. {"Discount":15}'></div></div>
    <div class="btnrow" style="margin-top:6px"><button class="btn secondary small" onclick="addCmdtRecord('${t.id}')">Add record</button></div></div></div>`;

/* ============ visual flow builder (node canvas) ============ */
let FB=null;
const FB_ACTION_TYPES=[["create_record","Create record"],["set_fields","Update fields"],["log","Log to history"],["http_callout","HTTP callout"]];
function fbNodes(){
  const f=FB.flow, isS=FB.isScreen, nodes=[{key:"start",kind:"start"}];
  if(!isS&&f.condition&&Object.keys(f.condition).length) nodes.push({key:"cond",kind:"cond"});
  if(isS){
    (f.screens||[]).forEach((s,i)=>nodes.push({key:"s"+i,kind:"screen",idx:i}));
    (f.finish_actions||[]).forEach((a,i)=>nodes.push({key:"f"+i,kind:"faction",idx:i}));
  }else{
    (f.actions||[]).forEach((a,i)=>nodes.push({key:"a"+i,kind:"action",idx:i}));
  }
  return nodes;
}
function fbPos(key,i){
  const c=FB.flow.canvas||{};
  return c[key]||{x:260,y:44+i*104};
}
function fbLabel(n){
  const f=FB.flow;
  if(n.kind==="start"){
    if(FB.isScreen) return "▶ "+(f.name||"Screen flow");
    if(f.trigger==="scheduled"){
      const s=f.schedule||{};
      return "▶ scheduled · "+(s.frequency||"daily")+" "+(s.time||"")+" UTC";
    }
    return "▶ "+String(f.trigger||"on_create").replace(/_/g," ")+" · "+(f.object||"");
  }
  if(n.kind==="cond") return "◆ Condition";
  if(n.kind==="screen"){ const s=(f.screens||[])[n.idx]||{}; return "▤ "+(s.title||("Screen "+(n.idx+1))); }
  const a=((n.kind==="faction"?f.finish_actions:f.actions)||[])[n.idx]||{};
  const t=(FB_ACTION_TYPES.find(t=>t[0]===a.type)||[])[1]||a.type||"?";
  const d=a.type==="create_record"&&a.object?(" → "+a.object):a.type==="http_callout"?(" "+(a.method||"POST")+" "+(a.path||"")):"";
  return "⚙ "+t+d;
}
async function openFlowBuilder(kind,id){
  const cfg=SETUP_KINDS[kind];
  const r=await api("GET","/api/admin/"+(cfg.apiKind||kind));
  const rows=Array.isArray(r.data)?r.data:[];
  const flow=rows.find(x=>x.id===id);
  if(!flow){ toast("Flow not found.","error"); return; }
  FB={kind,id,flow:JSON.parse(JSON.stringify(flow)),isScreen:(kind==="screen-flows"||flow.flow_type==="screen"),sel:"start"};
  renderFlowBuilder();
  fbLoadVersions();
}
function renderFlowBuilder(){
  const nodes=fbNodes(), H=Math.max(440,44+nodes.length*104+70);
  const pos=nodes.map((n,i)=>fbPos(n.key,i));
  let svg=`<svg id="fbsvg" viewBox="0 0 560 ${H}" style="width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:none">`;
  svg+=`<defs><marker id="fbarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker></defs>`;
  nodes.forEach((n,i)=>{
    if(!i) return;
    const a=pos[i-1],b=pos[i];
    svg+=`<line id="fbl${i}" x1="${a.x}" y1="${a.y+32}" x2="${b.x}" y2="${b.y-32}" stroke="#94a3b8" stroke-width="2" marker-end="url(#fbarr)"/>`;
  });
  nodes.forEach((n,i)=>{
    const p=pos[i], sel=FB.sel===n.key;
    const fill=n.kind==="start"?"#e8f3fd":n.kind==="cond"?"#fef6e0":"var(--surface)";
    svg+=`<g data-node="${n.key}" transform="translate(${p.x},${p.y})" style="cursor:grab"><rect x="-115" y="-32" width="230" height="64" rx="10" fill="${fill}" stroke="${sel?"#0176d3":"var(--line)"}" stroke-width="${sel?3:1.5}"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">${esc(fbLabel(n).slice(0,36))}</text></g>`;
  });
  svg+="</svg>";
  document.getElementById("main").innerHTML=
   `<div class="btnrow"><button class="btn secondary" onclick="showAdmin()">← Back to Setup</button>`
   +`<h2 style="margin:0">${esc(FB.flow.name||"Flow")}</h2><span style="flex:1"></span>`
   +`<select id="fbvers" style="max-width:190px" title="Version history"><option value="">Versions…</option></select>`
   +`<button class="btn secondary small" onclick="fbRollback()">Rollback</button>`
   +(FB.isScreen?`<button class="btn secondary small" onclick="fbAddStep('screen')">+ Screen</button>`:`<button class="btn secondary small" onclick="fbAddStep('action')">+ Action</button>`)
   +(FB.sel&&FB.sel!=="start"?` <button class="btn danger small" onclick="fbDelStep()">Delete step</button>`:"")
   +` <button class="btn" onclick="fbSave()">Save flow</button></div>`
   +`<div class="fbwrap"><div>${svg}</div><div class="fbpanel card" id="fbpanel"></div></div>`
   +`<p class="muted">Drag steps to arrange · click a step to edit · positions save with the flow.</p>`;
  renderFbPanel();
  fbBindDrag();
}
function fbSvgPt(svg,e){
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function fbBindDrag(){
  const svg=document.getElementById("fbsvg"); if(!svg) return;
  let drag=null;
  svg.querySelectorAll("[data-node]").forEach(g=>{
    g.addEventListener("pointerdown",e=>{
      const key=g.dataset.node, nodes=fbNodes(), i=nodes.findIndex(n=>n.key===key);
      FB.sel=key; renderFbPanel();
      svg.querySelectorAll("[data-node] rect").forEach(r=>{const on=r.parentElement.dataset.node===key; r.setAttribute("stroke",on?"#0176d3":"var(--line)"); r.setAttribute("stroke-width",on?"3":"1.5");});
      const pt=fbSvgPt(svg,e), p=fbPos(key,i);
      drag={key,i,dx:pt.x-p.x,dy:pt.y-p.y,g};
      try{g.setPointerCapture(e.pointerId);}catch(err){}
      e.preventDefault();
    });
  });
  svg.addEventListener("pointermove",e=>{
    if(!drag) return;
    const pt=fbSvgPt(svg,e);
    const x=Math.round(pt.x-drag.dx), y=Math.round(pt.y-drag.dy);
    const c=FB.flow.canvas=FB.flow.canvas||{}; c[drag.key]={x,y};
    drag.g.setAttribute("transform",`translate(${x},${y})`);
    const nodes=fbNodes(), i=drag.i;
    const setLine=(li,ax,ay,bx,by)=>{const l=document.getElementById("fbl"+li); if(l){l.setAttribute("x1",ax);l.setAttribute("y1",ay+32);l.setAttribute("x2",bx);l.setAttribute("y2",by-32);}};
    if(i>0){const p=fbPos(nodes[i-1].key,i-1); setLine(i,p.x,p.y,x,y);}
    if(i<nodes.length-1){const p=fbPos(nodes[i+1].key,i+1); setLine(i+1,x,y,p.x,p.y);}
  });
  svg.addEventListener("pointerup",()=>{drag=null;});
}

let fbJsonOk=true;
function fbJson(id,fb){
  const el=document.getElementById(id); if(!el) return fb;
  try{ const p=JSON.parse(el.value||"{}"); el.style.border=""; return p; }
  catch(e){ el.style.border="2px solid #c0392b"; fbJsonOk=false; toast("Invalid JSON in "+id+" — fix it before saving.","error"); return fb; }
}
function fbApplyPanel(loud){
  if(!FB) return;
  fbJsonOk=true;
  const n=fbNodes().find(x=>x.key===FB.sel); if(!n) return;
  const f=FB.flow, gv=id=>(document.getElementById(id)||{}).value;
  if(n.kind==="start"){
    f.name=gv("fb_name")||f.name;
    if(!FB.isScreen){
      f.object=gv("fb_objsel")||f.object; f.trigger=gv("fb_trig")||f.trigger;
      if(f.trigger==="scheduled"){
        f.schedule={frequency:gv("fb_freq")||"daily",time:gv("fb_stime")||"09:00"};
        if(f.schedule.frequency==="weekly") f.schedule.day_of_week=parseInt(gv("fb_dow")||"1",10);
      }else delete f.schedule;
    }
  }else if(n.kind==="cond"){
    f.condition=fbJson("fb_cond",f.condition);
  }else if(n.kind==="action"||n.kind==="faction"){
    const list=n.kind==="faction"?(f.finish_actions=f.finish_actions||[]):(f.actions=f.actions||[]);
    const type=gv("fb_atype")||"create_record", a={type};
    if(type==="create_record"||type==="set_fields"){
      a.object=gv("fb_aobj");
      if(type==="set_fields") a.record_id=gv("fb_arid")||"{{Trigger.Id}}";
      a.fields=fbJson("fb_afields",{});
    }else if(type==="log"){ a.message=gv("fb_amsg")||""; }
    else if(type==="http_callout"){
      a.credential=gv("fb_acred"); a.method=gv("fb_amethod")||"POST"; a.path=gv("fb_apath")||"";
      a.headers=fbJson("fb_aheaders",{}); a.body=fbJson("fb_abody","");
    }
    list[n.idx]=a;
  }else if(n.kind==="screen"){
    const s=(f.screens||[])[n.idx]; if(!s) return;
    s.title=gv("fb_stitle")||s.title;
    const oldFields=s.fields||[];
    s.fields=[...document.querySelectorAll("#fb_sfields [data-sf='name']")].map(inp=>{
      const i=inp.dataset.i;
      const q=k=>document.querySelector(`#fb_sfields [data-sf='${k}'][data-i='${i}']`);
      return {...(oldFields[+i]||{}),name:q("name").value,label:q("label").value||q("name").value,type:q("type").value};
    }).filter(x=>x.name);
  }
  if(loud) toast("Applied — remember to Save flow.","info");
  renderFlowBuilder();
}
function fbAddStep(kind){
  const f=FB.flow;
  if(kind==="screen"){ (f.screens=f.screens||[]).push({title:"Screen "+(f.screens.length+1),fields:[]}); FB.sel="s"+(f.screens.length-1); }
  else{
    if(FB.isScreen){ (f.finish_actions=f.finish_actions||[]).push({type:"create_record"}); FB.sel="f"+(f.finish_actions.length-1); }
    else{ (f.actions=f.actions||[]).push({type:"create_record"}); FB.sel="a"+(f.actions.length-1); }
  }
  renderFlowBuilder();
}
function fbDelStep(){
  const n=fbNodes().find(x=>x.key===FB.sel); if(!n||n.kind==="start") return;
  if(!confirm("Delete this step?")) return;
  const f=FB.flow;
  if(n.kind==="cond") f.condition={};
  else if(n.kind==="action") f.actions.splice(n.idx,1);
  else if(n.kind==="faction") f.finish_actions.splice(n.idx,1);
  else if(n.kind==="screen") f.screens.splice(n.idx,1);
  FB.sel="start"; renderFlowBuilder();
}
function fbAddScreenField(si){
  fbApplyPanel(false);
  const s=FB.flow.screens[si]; s.fields=s.fields||[]; s.fields.push({name:"field"+(s.fields.length+1),label:"Field "+(s.fields.length+1),type:"text"});
  FB.sel="s"+si; renderFlowBuilder();
}
function fbDelScreenField(si,fi){
  fbApplyPanel(false);
  FB.flow.screens[si].fields.splice(fi,1);
  FB.sel="s"+si; renderFlowBuilder();
}
async function fbSave(){
  fbApplyPanel(false);
  if(!fbJsonOk){ toast("Fix the invalid JSON before saving.","error"); return; }
  const f=FB.flow, payload={name:f.name,canvas:f.canvas||{}};
  if(FB.isScreen){ payload.screens=f.screens||[]; payload.finish_actions=f.finish_actions||[]; }
  else{ payload.object=f.object; payload.trigger=f.trigger; payload.condition=f.condition||{}; payload.actions=f.actions||[]; if(f.schedule) payload.schedule=f.schedule; }
  const cfg=SETUP_KINDS[FB.kind];
  const r=await api("PATCH","/api/admin/"+(cfg.apiKind||FB.kind)+"/"+FB.id,payload);
  if(r.ok){ toast("Flow saved.","ok"); fbLoadVersions(); }
  else toast("Save failed: "+(r.data.error||r.status),"error");
}

/* ============ dispatch console ============ */
let dispDate=null, dispTerr="", dispCache=null, dispSkills={};
const FS_STAT_COLOR={"Completed":"#2e9e4f","In Progress":"#d98a1f","Dispatched":"#8b5cf6","Scheduled":"#0176d3","Cancelled":"#94a3b8","Cannot Complete":"#ef4444","None":"#6b7280"};
const FS_TRANSITIONS={"None":["Scheduled","Cancelled"],"Scheduled":["Dispatched","Cancelled"],"Dispatched":["In Progress","Cancelled"],"In Progress":["Completed","Cannot Complete","Cancelled"],"Cannot Complete":["Scheduled"],"Cancelled":["Scheduled"]};
const FS_ACTION_LABEL={"Scheduled":"Re-schedule","Dispatched":"Start travel","In Progress":"Start work","Completed":"Complete","Cannot Complete":"Cannot complete","Cancelled":"Cancel"};
function fsStatusPill(s){

function fsMapLink(loc){

  if(p.length!==2||!p[0].trim()||!p[1].trim()) return "";

}
function fsHm(iso){ return iso?String(iso).slice(11,16):"—"; }
async function showDispatch(){
  setActive("__dispatch");
  if(!dispDate) dispDate=new Date().toISOString().slice(0,10);
  document.getElementById("main").innerHTML=skel(3);
  const q=`date=${dispDate}${dispTerr?`&territory_id=${encodeURIComponent(dispTerr)}`:""}`;
  const [d,terr,sk]=await Promise.all([
    api("GET",`/api/field-service/dispatch?${q}`),
    api("GET","/api/sobjects/ServiceTerritory"),
    api("GET","/api/sobjects/Skill")
  ]);
  if(!d.ok){ document.getElementById("main").innerHTML=`<div class="err">${esc((d.data||{}).error||"Failed to load dispatch data")}</div>`; return; }
  dispCache=d.data||{};
  const terrs=(terr.ok&&terr.data)||[];
  dispSkills={}; ((sk.ok&&sk.data)||[]).forEach(s=>{ dispSkills[s.Id]=s.Name||s.Id; });
  const lanes=dispCache.lanes||[], unsched=dispCache.unscheduled||[];
  const nAppt=lanes.reduce((n,l)=>n+(l.appointments||[]).length,0);
  const H0=6,H1=22,SPAN=H1-H0;
  const pct=dt=>{ const x=new Date(dt); return Math.min(100,Math.max(0,((x.getHours()+x.getMinutes()/60)-H0)/SPAN*100)); };
  const today=new Date().toISOString().slice(0,10);
  const nowPct=dispDate===today?pct(new Date().toISOString()):null;
  let ticks=""; for(let h=H0;h<=H1;h+=2) ticks+=`<span style="position:absolute;left:${((h-H0)/SPAN*100).toFixed(1)}%;transform:translateX(-50%)">${h}:00</span>`;
  let html=`<div class="btnrow" style="align-items:center;flex-wrap:wrap"><h2 style="margin:0">Dispatch console</h2>`
    +`<span class="muted">${nAppt} scheduled · ${unsched.length} unscheduled · ${lanes.length} resource(s)</span><span style="flex:1"></span>`
    +`<select id="disp_terr" onchange="dispTerr=this.value;showDispatch()" style="width:auto"><option value="">All territories</option>${terrs.map(t=>`<option value="${t.Id}"${dispTerr===t.Id?" selected":""}>${esc(t.Name||t.Id)}</option>`).join("")}</select> `
    +`<input type="date" id="disp_date" value="${dispDate}" style="width:auto"> <button class="btn secondary small" onclick="dispDate=v('disp_date');showDispatch()">Go</button> `
    +`<button class="btn secondary small" onclick="dispDate=new Date().toISOString().slice(0,10);showDispatch()">Today</button> `
    +`<button class="btn small" onclick="dispAutoSchedule()">Auto-schedule day</button> `
    +`<button class="btn secondary small" onclick="dispOptimize()">Optimize routes</button></div>`;
  html+=`<div class="setup-links">Setup: ${["ServiceTerritory","ServiceResource","WorkType","OperatingHours","Skill"].map(o=>`<a href="#" onclick="showObject('${o}');return false">${o}</a>`).join(" · ")}</div>`;
  // ---- resource lanes gantt ----
  html+=`<div class="card"><div class="section-title">Resource schedule</div><div class="disp-head"><div></div><div class="disp-scale">${ticks}</div></div>`;
  if(!lanes.length) html+=`<p class="muted">No active service resources${dispTerr?" in this territory":""}. Add them under Setup: ServiceResource.</p>`;
  for(const lane of lanes){
    const res=lane.resource||{};
    const appts=(lane.appointments||[]).slice().sort((a,b)=>(a.ScheduledStart||"").localeCompare(b.ScheduledStart||""));
    const ends=[];
    for(const a of appts){ // stack overlapping bars on separate rows
      const s=a.ScheduledStart||"", e=a.ScheduledEnd||s;
      let r=0; while(ends[r]&&ends[r]>s) r++;
      ends[r]=e; a._row=r;
    }
    const laneH=Math.max(1,ends.length)*36+10;
    html+=`<div class="disp-row"><div style="padding:10px 8px"><b>${esc(res.Name||"(no name)")}</b><div class="muted">${appts.length} appt(s)</div></div><div class="disp-lane" style="min-height:${laneH}px" ondragover="dispDragOver(event)" ondragleave="dispDragLeave(event)" ondrop="dispDropLane(event,'${res.Id}')">`;
    for(const a of appts){
      const l=pct(a.ScheduledStart), w=Math.max(2.5,pct(a.ScheduledEnd||a.ScheduledStart)-l);
      const tip=`${a.Name||"(no name)"} — ${fsHm(a.ScheduledStart)}–${fsHm(a.ScheduledEnd)} · ${a.Status||""}${a.Address?" · "+a.Address:""}`;
      html+=`<div class="disp-bar" draggable="true" ondragstart="dispDragStart(event,'sched','${a.Id}')" style="left:${l.toFixed(1)}%;width:${w.toFixed(1)}%;top:${9+(a._row||0)*36}px;background:${FS_STAT_COLOR[a.Status]||"#0176d3"}" title="${esc(tip)}" onclick="openApptModal('${a.Id}')">${esc(a.Name||"(no name)")}</div>`;
    }
    if(nowPct!=null&&nowPct>=0&&nowPct<=100) html+=`<div style="position:absolute;left:${nowPct.toFixed(1)}%;top:0;bottom:0;width:2px;background:#ef4444;opacity:.7" title="Now"></div>`;
    html+=`</div></div>`;
  }
  html+=`</div><p class="muted">Click a block to open the appointment. Drag an unscheduled card onto a lane to assign it, drag a bar between lanes to reassign, or drop a bar back on the unscheduled tray to unassign.</p>`;
  // ---- unscheduled tray ----
  html+=`<div class="section-title" style="margin-top:18px">Unscheduled (${unsched.length})</div>`;
  html+=`<div class="unsch-grid" id="unsch_tray" ondragover="dispDragOver(event)" ondragleave="dispDragLeave(event)" ondrop="dispDropTray(event)">${unsched.length?unsched.map(a=>dispUnscheduledCard(a)).join(""):`<p class="muted">Nothing waiting to be scheduled.</p>`}</div>`;
  document.getElementById("main").innerHTML=html;
}
