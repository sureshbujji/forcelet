<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forcelet — mini-CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpolygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2' fill='%23e8a100'/%3E%3C/svg%3E">
<style>
:root{
  --blue:#0176d3; --blue-dark:#014486;
  --bg:#f3f2f2; --surface:#ffffff; --surface2:#fafaf9;
  --text:#181818; --muted:#706e6b; --line:#d8dde6;
  --header-bg:#032d60; --header-text:#ffffff;
  --input-bg:#ffffff;
  --danger:#c0392b; --ok:#1b5e20; --ok-bg:#e8f5e9; --err-bg:#fdecea; --err:#a93226;
  --shadow:0 1px 3px rgba(0,0,0,.08); --radius:10px;
}
[data-theme="dark"]{
  --bg:#121417; --surface:#1c1f24; --surface2:#24292f;
  --text:#e8eaed; --muted:#9aa0a6; --line:#343a41;
  --header-bg:#0b1220; --header-text:#e8eaed;
  --input-bg:#24292f;
  --ok-bg:#14291a; --ok:#7cc78a; --err-bg:#3a1d18; --err:#f0978a;
  --shadow:0 1px 3px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.45}
header{background:var(--header-bg);color:var(--header-text);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:20px} header h1 span{font-weight:400}
header .hgroup{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
header input#gsearch{background:var(--input-bg);color:var(--text)}
.userbox{font-size:13px;display:flex;gap:12px;align-items:center}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--header-text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
.iconbtn:hover{background:rgba(255,255,255,.22)}
.iconbtn svg{width:16px;height:16px;vertical-align:-3px}
#chatfab svg{width:22px;height:22px;vertical-align:-5px}
.logo-mark{display:inline-flex;vertical-align:-4px;margin-right:6px;color:#e8a100}
.logo-mark svg{width:20px;height:20px}
#login .logo-mark{vertical-align:-3px}
#appname{color:var(--header-text);font-weight:700;font-size:14px;white-space:nowrap}
#launcher{position:absolute;top:56px;left:12px;z-index:200;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:8px;display:none;min-width:300px;max-height:70vh;overflow:auto}
#launcher .lapp{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--text)}
#launcher .lapp:hover{background:var(--hover)}
#launcher .lapp.sel{background:var(--hover);outline:2px solid var(--blue)}
#launcher .lapp-ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;color:#fff}
#launcher .lapp small{display:block;color:var(--muted);font-size:11px}
#launcher .lapp-def{margin-left:auto;font-size:10px;color:var(--blue);font-weight:700;text-transform:uppercase}
nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:50}
nav button{border:0;background:none;padding:14px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
nav button .badge{background:var(--danger);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px}
main{padding:20px 24px 96px;max-width:1400px}
/* Record detail: two-column layout with a right rail */
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.detail-grid .card{margin-bottom:16px}
@media(max-width:1000px){.detail-grid{grid-template-columns:1fr}}
/* Sticky record header (title + actions + tabs stay visible while scrolling) */
.dhead{position:sticky;top:50px;z-index:40;background:var(--bg);padding:10px 0 0}
/* Collapsible cards (empty sections start collapsed) */
.card.collapsible>.section-title{cursor:pointer;user-select:none}
.card.collapsible>.section-title::after{content:"\25be";float:right;color:var(--muted);font-size:13px}
.card.collapsible.collapsed>.section-title::after{content:"\25b8"}
.card.collapsible.collapsed>:not(.section-title){display:none}
/* Dropdown menus (list "More" menu, user menu) */
.dd{position:relative;display:inline-block}
.dd-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:300;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;min-width:200px;display:none}
.dd.open .dd-menu{display:block}
.dd-menu button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:7px;cursor:pointer;color:var(--text);font-size:13px;white-space:nowrap}
.dd-menu button:hover{background:var(--hover)}
.dd-menu .dd-head{padding:8px 12px 6px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px}
/* Tab bar overflow fade (only when tabs actually overflow) */
nav.overflow{-webkit-mask-image:linear-gradient(90deg,#000 94%,transparent);mask-image:linear-gradient(90deg,#000 94%,transparent)}
/* Dimmed empty field values */
.fv-empty{color:var(--muted);opacity:.7}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
/* ---- Admin Setup: home, sections, tiles ---- */
.setup-breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--muted)}
.setup-breadcrumb a{cursor:pointer;color:var(--accent);font-weight:600}
.setup-nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px;padding:10px 0;background:var(--bg)}
.setup-nav button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:600}
.setup-nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.setup-search{margin-bottom:14px}
.setup-search input{width:100%;max-width:520px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);font-size:14px}
.setup-sec{margin-bottom:26px}
.setup-sec-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;box-shadow:var(--shadow);color:var(--text)}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .ttitle{font-weight:700;font-size:14px}
.tile .tcount{font-size:12px;color:var(--accent);font-weight:700}
.tile .tdesc{font-size:12px;color:var(--muted)}
.setup-sec-title{font-size:16px;font-weight:800;margin:22px 0 4px;display:flex;align-items:center;gap:8px}
/* collapsible setup cards */
#setup_cards .card .section-title{cursor:pointer;user-select:none}
#setup_cards .card .section-title::after{content:"▾";float:right;color:var(--muted);font-size:13px}
#setup_cards .card.collapsed .section-title::after{content:"▸"}
#setup_cards .card.collapsed>:not(.section-title){display:none}
#setup_cards .card.flash{animation:setupflash 2.2s}
@keyframes setupflash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.card-count{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-on{background:#e6f4ea;color:#137333}
.pill-off{background:#fce8e6;color:#a50e0e}
[data-theme="dark"] .pill-on{background:#1e3a2a;color:#7bd88f}
[data-theme="dark"] .pill-off{background:#3d2320;color:#f28b82}
.pill-custom{background:#e8f0fe;color:#1a56db;font-size:10px;padding:1px 8px;text-transform:uppercase;letter-spacing:.04em}
[data-theme="dark"] .pill-custom{background:#1e2c4d;color:#8fb4ff}
/* guided condition builder */
.cb{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.cb-cap{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.cb-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.cb-row select,.cb-row input{margin:0;flex:1;min-width:0}
.cb-row .cb-x{flex:0 0 auto}
@media(max-width:640px){.cb-row{flex-wrap:wrap}.tile-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{background:var(--input-bg);color:var(--text);width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;box-sizing:border-box}
.rtbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.rtbar button,.rtbar select{width:auto;padding:4px 9px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--text);cursor:pointer}
.rtbar button:hover{background:var(--hover,#eef1f6)}
.rtedit{background:var(--input-bg);color:var(--text);width:100%;min-height:110px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;box-sizing:border-box}
.rtedit:focus{outline:2px solid var(--blue)}
.rtview{line-height:1.5}
.rtview p,.rtview h1,.rtview h2,.rtview h3,.rtview h4{margin:6px 0}
.rtview ul,.rtview ol{margin:6px 0;padding-left:22px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:14px;cursor:pointer}
.btn:hover{background:var(--blue-dark)}
.btn.secondary{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.btn.secondary:hover{background:rgba(1,118,211,.08)}
.btn.danger{background:var(--danger)}
.btn.small{padding:5px 10px;font-size:12px}
.btnrow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
tr:hover td{background:var(--surface2)}
.section-title{font-size:15px;font-weight:600;margin-bottom:8px}
.field{margin-bottom:10px}.fl{font-size:12px;color:var(--muted)}.fv{font-size:14px}
/* dynForm: dynamic forms — conditional field visibility in record forms */
.ff{transition:opacity .15s ease}.ff.df-hidden{display:none}
.df-targets{max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px}
.muted{color:var(--muted);font-size:13px}
.err{background:var(--err-bg);color:var(--err);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px}
.ok{background:var(--ok-bg);color:var(--ok);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#login .card{width:380px}
.loginbtn{display:block;width:100%;margin:6px 0;text-align:left}
pre{background:#0f2a44;color:#cfe8ff;padding:14px;border-radius:8px;overflow:auto;font-size:13px}
.bar{height:22px;background:linear-gradient(90deg,var(--blue),#4bc076);border-radius:4px;margin:4px 0}
.bar-row{display:grid;grid-template-columns:180px 1fr 120px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
details{margin-top:8px} summary{cursor:pointer;color:var(--blue);font-size:13px}
/* detail tabs */
.dtabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.dtabs button{border:0;background:none;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.dtabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
/* toasts */
#toasts{position:fixed;bottom:24px;right:24px;z-index:1000;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px 16px;box-shadow:var(--shadow);font-size:14px;animation:tin .25s ease}
.toast.ok{border-left-color:#2e9e4f}.toast.error{border-left-color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* skeleton */
.skel{border-radius:8px;background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* command palette */
#palette{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#palette.open{display:flex}
#palette .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(560px,92vw);box-shadow:var(--shadow);overflow:hidden}
#palette input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 18px;font-size:16px}
#palette input:focus{outline:none}
#palresults{max-height:320px;overflow:auto;padding:6px}
.palitem{padding:10px 14px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center}
.palitem.sel{background:rgba(1,118,211,.12)}
.palitem .k{color:var(--muted);font-size:12px;margin-left:auto}
/* assistant chat */
#chatfab{position:fixed;bottom:24px;left:24px;z-index:800;background:var(--blue);color:#fff;border:0;border-radius:50%;width:56px;height:56px;font-size:24px;cursor:pointer;box-shadow:var(--shadow)}
#chatpanel{position:fixed;bottom:92px;left:24px;z-index:800;width:min(380px,92vw);max-height:60vh;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden}
#chatpanel.open{display:flex}
#chatlog{padding:12px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px;min-height:200px}
.msg{padding:8px 12px;border-radius:10px;font-size:13px;max-width:90%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff}
.msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--line)}
#chatpanel .cinput{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
/* dashboard charts */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:700}.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase}
.dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
/* ---- UI batch: flow canvas, dispatch, split view, dashboard builder, lightbox ---- */
.fbwrap{display:grid;grid-template-columns:1fr 350px;gap:16px;align-items:start}
.fbpanel{position:sticky;top:12px;max-height:82vh;overflow:auto}
#lightbox{position:fixed;inset:0;z-index:950;display:flex;align-items:center;justify-content:center;padding:20px}
.lb-back{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.lb-box{position:relative;max-width:min(880px,94vw);max-height:88vh;overflow:auto;padding:22px;margin:0}
.lb-x{position:absolute;top:10px;right:10px}
.split{display:grid;grid-template-columns:minmax(430px,1.35fr) 1fr;gap:16px;align-items:start}
#splitlist tr[data-rid]{cursor:pointer}
#splitlist tr.sel td{background:#e8f3fd}
.dashbuild-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dashw{border:2px dashed var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.dashw.dragging{opacity:.4}
.disp-head{display:grid;grid-template-columns:150px 1fr;color:var(--muted);font-size:12px;margin-bottom:4px}
.disp-scale{position:relative;height:20px}
.disp-row{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--line)}
.disp-lane{position:relative;min-height:46px}
.disp-bar{position:absolute;top:9px;height:28px;border-radius:6px;color:#fff;font-size:12px;line-height:20px;padding:4px 8px;overflow:hidden;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
.stat-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.unsch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:10px}
.disp-lane.dragover,.unsch-grid.dragover{outline:2px dashed var(--accent);outline-offset:-2px;background:rgba(1,118,211,.07)}
.disp-bar[draggable="true"],.appt-card[draggable="true"]{cursor:grab}
#notifdd{position:absolute;top:56px;right:12px;width:370px;max-width:94vw;max-height:460px;overflow:auto;z-index:90;display:none}
.sigpad{width:100%;max-width:340px;height:120px;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.appt-card{padding:14px}
.setup-links{margin:6px 0;font-size:12px;color:var(--muted)}
.setup-links a{color:var(--accent);margin:0 2px}
@media (max-width:900px){.fbwrap,.split,.dashbuild-grid{grid-template-columns:1fr}.fbpanel{position:static;max-height:none}}

/* mobile */
@media (max-width:760px){
  header{padding:10px 14px} header h1{font-size:17px}
  nav{padding:0 10px} nav button{padding:11px 10px;font-size:13px}
  main{padding:12px}
  .grid2{grid-template-columns:1fr}
  .bar-row{grid-template-columns:1fr;gap:2px}
  main table{display:block;overflow-x:auto;white-space:nowrap}
  #toasts{left:16px;right:16px;bottom:16px;max-width:none}
  #chatfab{left:16px;bottom:16px}
  .appt-card .btn{min-height:44px;font-size:15px}
  .unsch-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-weight:600;color:var(--muted);font-size:12px;padding:4px}
.cal-cell{min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.cal-empty{background:transparent;border:none}
.cal-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal-date{font-weight:600;font-size:13px;margin-bottom:4px}
.cal-chip{background:var(--bg);border-radius:4px;padding:2px 6px;font-size:12px;margin-bottom:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:720px){.cal-grid{grid-template-columns:1fr}.cal-empty{display:none}.cal-cell{min-height:auto}}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h2><span class="logo-mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>Forcelet</h2>
    <p class="muted">Metadata-driven mini-CRM. Built by Suresh Itha. Sign in with your Forcelet account.</p>
    <div id="loginbtns"></div>
  </div>
</div>
<div id="app" style="display:none">
  <header>
    <h1><span class="logo-mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>Forcelet</h1>
    <button class="iconbtn" id="launcherbtn" onclick="toggleLauncher(event)" title="App Launcher" style="display:none">▦</button>
    <span id="appname"></span>
    <div id="launcher"></div>
    <div class="hgroup">
      <input id="gsearch" placeholder="Search all records…  (⌘K)" onkeydown="if(event.key==='Enter')showSearch()" style="width:200px;margin:0">
      <select id="gsearch_mode" title="Search mode" style="width:auto;margin:0;padding:4px"><option value="keyword">Keyword</option><option value="semantic">Semantic</option></select>
      <button class="iconbtn" onclick="openPalette()" title="Command palette (⌘K)">⌘K</button>
      <div class="dd" id="presencedd"><button class="iconbtn" id="presencebtn" onclick="toggleDD(event,'presencedd')" title="Omni-Channel presence"><span id="presdot" style="color:#9ca3af">●</span> <span id="preslabel">Offline</span></button><span class="dd-menu"><div class="dd-head">Omni-Channel presence</div><button onclick="setPresence('Available')"><span style="color:#22c55e">●</span>&nbsp;Available</button><button onclick="setPresence('Busy')"><span style="color:#f59e0b">●</span>&nbsp;Busy</button><button onclick="setPresence('Offline')"><span style="color:#9ca3af">●</span>&nbsp;Offline</button></span></div>

      <div id="notifdd" class="card"></div>
      <button class="iconbtn" onclick="showRecycleBin()" title="Recycle Bin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      <button class="iconbtn" id="themebtn" onclick="toggleTheme()" title="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <div class="userbox dd" id="usermenu"><button class="iconbtn" id="whoami" onclick="toggleDD(event,'usermenu')" title="Account"></button><span class="dd-menu"><div class="dd-head" id="whoami_detail"></div><button onclick="totpManage()">Two-factor authentication</button><button onclick="logout()">Switch user</button></span></div>
    </div>
  </header>
  <div id="palette"><div class="box"><input id="palinput" placeholder="Type to search records, objects, actions…" autocomplete="off"><div id="palresults"></div></div></div>
  <div id="toasts"></div>
  <button id="chatfab" onclick="toggleChat()" title="Ask Forcelet Assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
  <div id="chatpanel"><div class="section-title" style="padding:12px 12px 0">Forcelet Assistant <span class="muted">· rule-based demo</span></div><div id="chatlog"></div><div class="cinput"><input id="chatinput" placeholder="Ask about your CRM…" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn small" onclick="sendChat()">Send</button></div></div>
  <nav id="tabs"></nav>

</div>
<script src="fragments/sales_core.js"></script>
<script src="fragments/service_core.js"></script>
<script src="fragments/platform_core.js"></script>
<script>
let token=null, me=null, objects=[], lookups={}, curApp=null, userApps=[];
const APP_UTILS={
 reports:["__reports","showReports()","Reports"], dashboards:["__dashboards","showDashboards()","Dashboards"],
 chatter:["__chatter","showChatter()","Chatter"], approvals:["__approvals","showApprovals()","Approvals"],
 forecasts:["__forecasts","showForecasts()","Forecasts"], calendar:["__calendar","showCalendar()","Calendar"],
 dispatch:["__dispatch","showDispatch()","Dispatch"], flows:["__flows","showFlows()","Flows"],
 omni:["__omni","showOmni()","Omni"],
 myschedule:["__myschedule","showMySchedule()","My Schedule"],
 inventory:["__inventory","showInventory()","Inventory"],
 bulk:["__bulk","showBulk()","Bulk Jobs","admin"], admin:["__admin","showAdmin()","Admin Setup","admin"],
};
const H=()=>({"Authorization":"Bearer "+token,"Content-Type":"application/json"});
const api=(m,p,b)=>fetch(p,{method:m,headers:H(),body:b?JSON.stringify(b):undefined}).then(async r=>({ok:r.ok,status:r.status,data:await r.json().catch(()=>({}))}));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Record display title: Contacts (like Salesforce) store FirstName + LastName
// with no single Name field, so prefer the person name before the fallbacks.
function recTitle(rec){ const pn=[rec.FirstName,rec.LastName].filter(Boolean).join(" "); return pn||rec.Name||rec.Subject||rec.Title||rec.Id; }

/* ---- shared UI helpers (dropdowns, collapsible cards, dates, user names) ---- */
function toggleDD(e,id){ e.stopPropagation(); const el=document.getElementById(id); if(!el) return;
  const was=el.classList.contains("open");
  document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open"));
  if(!was) el.classList.add("open"); }
document.addEventListener("click",()=>{ document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open")); });
function toggleCollapse(el){ const c=el.closest(".card"); if(c) c.classList.toggle("collapsed"); }
function fmtDateTime(iso){ if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return esc(String(iso));
  return d.toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}); }
let _userNames=null;
async function userName(uid){ if(!uid) return "—";
  if(!_userNames){ try{ const r=await api("GET","/api/users/names"); _userNames=(r.ok&&r.data)||{}; }catch(e){ _userNames={}; } }
  return _userNames[uid]||uid; }
function updateTabFade(){ const n=document.getElementById("tabs"); if(!n) return;
  n.classList.toggle("overflow", n.scrollWidth>n.clientWidth+4); }
window.addEventListener("resize",updateTabFade);

// ------------------------------------------------------- theme + toasts + ui kit
function toggleTheme(){
  const dark=document.documentElement.dataset.theme==="dark";
  document.documentElement.dataset.theme=dark?"":"dark";
  try{localStorage.setItem("forcelet-theme",dark?"light":"dark")}catch(e){}
  document.getElementById("themebtn").textContent=dark?"\uD83C\uDF19":"\u2600\uFE0F";
}
try{if(document.documentElement.dataset.theme==="dark")document.getElementById("themebtn").textContent="\u2600\uFE0F"}catch(e){}
function toast(msg,kind){
  const t=document.createElement("div");t.className="toast "+(kind||"");
  t.textContent=msg;document.getElementById("toasts").appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),320)},3600);
}
function skel(n){n=n||3;let h="";for(let i=0;i<n;i++)h+=`<div class="card"><div class="skel" style="height:18px;width:40%;margin-bottom:10px"></div><div class="skel" style="height:12px;width:90%;margin-bottom:6px"></div><div class="skel" style="height:12px;width:70%"></div></div>`;return h;}

// ------------------------------------------------------- command palette
let palItems=[],palSel=0;
function openPalette(){document.getElementById("palette").classList.add("open");const i=document.getElementById("palinput");i.value="";palSel=0;renderPal("");setTimeout(()=>i.focus(),30);}
function closePalette(){document.getElementById("palette").classList.remove("open");}
function palGo(it){
  closePalette();
  if(it.kind==="obj")showObject(it.name);
  else if(it.kind==="rec")jumpTo(it.obj,it.id);
  else if(it.kind==="act")it.fn();
}
async function renderPal(q){
  q=(q||"").toLowerCase();const items=[];
  const acts=[["Reports",()=>showReports()],["Dashboards",()=>showDashboards()],["Chatter",()=>showChatter()],["Approvals",()=>showApprovals()],["Forecasts",()=>showForecasts()],["Flows",()=>showFlows()],["Recycle Bin",()=>showRecycleBin()],["Admin Setup",()=>showAdmin()],["API docs",()=>window.open("/api/openapi.json","_blank")]];
  for(const [label,fn] of acts)if(label.toLowerCase().includes(q))items.push({kind:"act",label,kind2:"action",fn});
  for(const o of objects)if(o.name.toLowerCase().includes(q)||o.plural.toLowerCase().includes(q))items.push({kind:"obj",name:o.name,label:o.plural,kind2:"object"});
  if(q.length>=2){
    try{const r=await api("GET","/api/search?q="+encodeURIComponent(q));for(const g of (r.data||[]))for(const rec of g.records.slice(0,4))items.push({kind:"rec",obj:g.object,id:rec.Id,label:String(recTitle(rec)).slice(0,60),kind2:g.label||g.object});}catch(e){}
  }
  palItems=items.slice(0,14);palSel=0;
  document.getElementById("palresults").innerHTML=palItems.map((it,i)=>`<div class="palitem${i===palSel?" sel":""}" data-i="${i}" onclick="palGo(palItems[${i}])">${esc(it.label)}<span class="k">${esc(it.kind2||"")}</span></div>`).join("")||`<div class="palitem">No matches</div>`;
}
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("palette").classList.contains("open")?closePalette():openPalette();}
  if(e.key==="Escape"){closePalette();document.getElementById("chatpanel").classList.remove("open");}
});
document.getElementById("palinput").addEventListener("input",e=>{palSel=0;renderPal(e.target.value);});
document.getElementById("palinput").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(palSel-1,0);}
  else if(e.key==="Enter"){e.preventDefault();if(palItems[palSel])palGo(palItems[palSel]);return;}
  else return;
  document.querySelectorAll(".palitem").forEach((el,i)=>el.classList.toggle("sel",i===palSel));
});
document.getElementById("palette").addEventListener("click",e=>{if(e.target.id==="palette")closePalette();});

// ------------------------------------------------------- assistant chat
function toggleChat(){const p=document.getElementById("chatpanel");p.classList.toggle("open");if(p.classList.contains("open"))setTimeout(()=>document.getElementById("chatinput").focus(),50);}
function chatAdd(text,who){
  const d=document.createElement("div");d.className="msg "+who;
  d.innerHTML=esc(text).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
  const log=document.getElementById("chatlog");log.appendChild(d);log.scrollTop=log.scrollHeight;
}
async function sendChat(){
  const inp=document.getElementById("chatinput");const msg=inp.value.trim();if(!msg)return;
  inp.value="";chatAdd(msg,"me");chatAdd("…","bot");
  const log=document.getElementById("chatlog");
  try{
    const r=await api("POST","/api/assistant",{message:msg});
    log.lastChild.remove();
    chatAdd(r.ok?r.data.reply:"Sorry, something went wrong.","bot");
  }catch(e){log.lastChild.remove();chatAdd("Sorry, something went wrong.","bot");}
}

async function boot(){
  totpPassword="";
  document.getElementById("loginbtns").innerHTML=`<div class="card" style="max-width:320px">
  <label>Username</label><input id="li_user" autocomplete="username" placeholder="admin">
  <label>Password</label><input id="li_pass" type="password" autocomplete="current-password" placeholder="Password">
  <div class="btnrow" style="margin-top:10px"><button class="btn" onclick="loginForm()">Sign in</button></div>
  <div id="lierr"></div></div>`;
  const u=document.getElementById("li_user"), p=document.getElementById("li_pass");
  u.focus();
  p.onkeydown=e=>{ if(e.key==="Enter") loginForm(); };
  u.onkeydown=e=>{ if(e.key==="Enter") p.focus(); };
  applyLoginBranding();
}
/* ---- Login screen: public branding + i18n pack (no auth needed) ---- */
async function applyLoginBranding(){
  let b={}, pack={};
  try{ b=await fetch("/api/public/login-branding").then(r=>r.json()); }catch(e){}
  try{ const lang=(navigator.language||"en").slice(0,2); pack=await fetch("/api/i18n/"+encodeURIComponent(lang)).then(r=>r.json()); }catch(e){}
  const h2=document.querySelector("#login .card h2");
  if(h2){
    if(b.logo_url) h2.insertAdjacentHTML("afterbegin",`<img src="${esc(b.logo_url)}" alt="" style="height:28px;vertical-align:-6px;margin-right:8px">`);
    if(b.headline) h2.innerHTML=h2.innerHTML.replace(/Forcelet/,esc(b.headline));
  }
  const tag=document.querySelector("#login .card p.muted");
  const tagline=pack["login.tagline"]||b.tagline;
  if(tag&&tagline) tag.textContent=tagline;
  if(b.primary_color){ const btn=document.querySelector("#loginbtns .btn"); if(btn) btn.style.background=b.primary_color; }
  if(b.background){ const lg=document.getElementById("login"); if(lg) lg.style.background=b.background; }
  const signin=document.querySelector("#loginbtns .btn");
  if(signin&&pack["login.signin"]) signin.textContent=pack["login.signin"];
  const u=document.getElementById("li_user"), pw=document.getElementById("li_pass");
  if(u&&pack["login.username"]) u.placeholder=pack["login.username"];
  if(pw&&pack["login.password"]) pw.placeholder=pack["login.password"];
}
async function loginForm(){
  const username=document.getElementById("li_user").value.trim();
  const password=document.getElementById("li_pass").value;
  login(username,password);
}
async function login(username,password){
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})}).then(r=>r.json());
  if(r.totp_required){ totpChallenge=r.challenge; totpUser=username; totpPassword=password; showTotpPrompt(); return; }
  if(!r.token){ document.getElementById("lierr").innerHTML=`<div class="err">${esc(r.error||"Login failed")}</div>`; return; }
  finishLogin(r,password);
}
let totpChallenge=null, totpUser=null, totpPassword="";
function showTotpPrompt(){
  document.getElementById("loginbtns").innerHTML=`<div class="card" style="max-width:320px"><div class="section-title">Two-factor authentication</div>
  <p class="muted">Enter the 6-digit code from your authenticator app for <b>${esc(totpUser)}</b>.</p>
  <input id="totp_code" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;font-size:20px;letter-spacing:6px">
  <div class="btnrow" style="margin-top:10px"><button class="btn" onclick="totpVerify()">Verify</button>
  <button class="btn secondary" onclick="boot()">Back</button></div><div id="totperr"></div></div>`;
  const inp=document.getElementById("totp_code"); inp.focus();
  inp.onkeydown=e=>{ if(e.key==="Enter") totpVerify(); };
}
async function totpVerify(){
  const code=document.getElementById("totp_code").value.trim();
  const r=await fetch("/api/login/totp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({challenge:totpChallenge,code})}).then(r=>r.json());
  if(!r.token){ document.getElementById("totperr").innerHTML=`<div class="err">Invalid code — try again.</div>`; return; }
  finishLogin(r,totpPassword); totpPassword="";
}
async function finishLogin(r,currentPassword){
  if(r.must_change_password){ showForcedPasswordChange(r,currentPassword); return; }
  if(r.totp_setup_required){ token=r.token; me=r.user; showTotpEnroll(); return; }
  token=r.token; me=r.user;
  await enterApp();
}
async function enterApp(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("whoami").textContent=me.name;
  document.getElementById("whoami_detail").textContent=`${me.profile} · ${me.role||"no role"}`;
  navSilent=true; // don't let the initial tab render rewrite a deep-link URL
  try{
    await loadObjects();
    loadDivisions();
    refreshBell();
    refreshPresence();
    if(!_omniPoll) _omniPoll=setInterval(refreshPresence,60000);
    checkPostLoginFlows();
    await routeFromUrl(); // land a deep link (/r/<object>/<id>) after sign-in
  }finally{ navSilent=false; }
}
/* ---- Post-login flow steps: announcement banner + 2FA nudge ---- */
async function checkPostLoginFlows(){
  try{
    const r=await api("GET","/api/me/announcement"); if(!r.ok) return;
    const d=r.data||{};
    if(d.announcement){
      document.querySelector("#app header").insertAdjacentHTML("afterend",
       `<div id="annbar" style="background:#fff8e1;border-bottom:1px solid #f0d97a;padding:10px 16px;display:flex;gap:12px;align-items:center"><div style="flex:1"><b>${esc(d.announcement.title||"Announcement")}</b>${d.announcement.body?`<div>${esc(d.announcement.body)}</div>`:""}</div><button class="btn secondary small" onclick="dismissAnnouncement()">Dismiss</button></div>`);
    }
    if(d.totp_nudge) toast("Protect your account: enable two-factor authentication from the account menu.","info");
  }catch(e){}
}
async function dismissAnnouncement(){
  await api("POST","/api/me/announcement/dismiss");
  const b=document.getElementById("annbar"); if(b) b.remove();
}
/* ---- TOTP enrollment during sign-in (org requires 2FA, not yet enrolled) ---- */
function showTotpEnroll(){
  document.getElementById("loginbtns").innerHTML=`<div class="card" style="max-width:380px">
  <div class="section-title">Set up two-factor authentication</div>
  <p class="muted">Your organization requires two-factor authentication. Set it up now to continue signing in.</p>
  <div class="btnrow"><button class="btn" onclick="totpEnrollSetup()">Set up now</button></div><div id="tpenerr"></div></div>`;
}
async function totpEnrollSetup(){
  const r=await api("POST","/api/me/totp/setup");
  if(!r.ok){ document.getElementById("tpenerr").innerHTML=`<div class="err">${esc((r.data||{}).error||"Setup failed")}</div>`; return; }
  document.getElementById("loginbtns").innerHTML=`<div class="card" style="max-width:380px">
  <div class="section-title">Set up two-factor authentication</div>
  <p class="muted">1. Enter this secret in your authenticator app, or open the link on your phone.</p>
  <label>Secret (keep private)</label><input readonly value="${esc(r.data.secret)}" onclick="this.select()">
  <p><a href="${esc(r.data.otpauth_url)}">otpauth link — open on your phone</a></p>
  <p class="muted">2. Enter the 6-digit code from the app to finish.</p>
  <input id="tpen_code" inputmode="numeric" maxlength="6" placeholder="000000" style="max-width:160px">
  <div class="btnrow" style="margin-top:10px"><button class="btn" onclick="totpEnrollEnable()">Enable 2FA</button></div>
  <div id="tpenerr"></div></div>`;
  document.getElementById("tpen_code").focus();
}
async function totpEnrollEnable(){
  const r=await api("POST","/api/me/totp/enable",{code:document.getElementById("tpen_code").value.trim()});
  if(!r.ok){ document.getElementById("tpenerr").innerHTML=`<div class="err">${esc((r.data||{}).error||"Invalid code — try again")}</div>`; return; }
  // Enrollment clears the limited flag on the session; we can enter the app.
  await enterApp();
}
let pendingCurrentPassword="";
function showForcedPasswordChange(r,currentPassword){
  token=r.token; me=r.user; pendingCurrentPassword=currentPassword||"";
  document.getElementById("loginbtns").innerHTML=`<div class="card" style="max-width:320px">
  <div class="section-title">Set a new password</div>
  <p class="muted">This account still has its initial password. Choose a new one to continue.</p>
  <label>New password</label><input id="pw_new" type="password" autocomplete="new-password" placeholder="At least 8 characters">
  <label>Confirm new password</label><input id="pw_new2" type="password" autocomplete="new-password" placeholder="Repeat new password">
  <div class="btnrow" style="margin-top:10px"><button class="btn" onclick="forcedPasswordSubmit()">Set password</button></div>
  <div id="pwerr"></div></div>`;
  document.getElementById("pw_new").focus();
}
async function forcedPasswordSubmit(){
  const n1=document.getElementById("pw_new").value, n2=document.getElementById("pw_new2").value;
  const err=m=>{document.getElementById("pwerr").innerHTML=`<div class="err">${esc(m)}</div>`;};
  if(n1.length<8) return err("New password must be at least 8 characters.");
  if(n1!==n2) return err("Passwords do not match.");
  const r=await fetch("/api/change-password",{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({current:pendingCurrentPassword,new:n1})}).then(r=>r.json());
  if(!r.changed) return err(r.error||"Could not change password.");
  pendingCurrentPassword="";
  if(r.totp_setup_required){ showTotpEnroll(); return; }
  // The limited session is now fully trusted; enter the app.
  await enterApp();
}
async function logout(){
  try{ await fetch("/api/logout",{method:"POST",headers:{"Authorization":"Bearer "+token}}); }catch(e){}
  token=null; me=null; location.reload();
}

async function loadObjects(){
  const r=await api("GET","/api/objects");
  objects=r.data;
  const ap=await api("GET","/api/approvals");
  const pending=(ap.data||[]).length;
  const ar=await api("GET","/api/apps").catch(()=>({data:{legacy:true}}));
  if(ar.data&&!ar.data.legacy&&(ar.data.apps||[]).length){
    userApps=ar.data.apps;
    document.getElementById("launcherbtn").style.display="";
    let saved=null; try{saved=localStorage.getItem("forcelet-app")}catch(e){}
    curApp=userApps.find(a=>a.id===saved)||userApps.find(a=>a.id===ar.data.default_app_id)||userApps[0];
    renderLauncher(); renderAppTabs(pending);
  }else{
    curApp=null; userApps=[];
    document.getElementById("launcherbtn").style.display="none";
    renderLegacyTabs(pending);
  }
}
function renderLegacyTabs(pending){
  const tabs=document.getElementById("tabs");
  document.getElementById("appname").textContent="";
  let html=objects.map(o=>`<button data-obj="${o.name}" onclick="showObject('${o.name}')">${esc(o.plural)}${o.is_custom?' <span class="pill pill-custom">Custom</span>':""}</button>`).join("");
  html+=`<button data-obj="__reports" onclick="showReports()">Reports</button>`;
  html+=`<button data-obj="__dashboards" onclick="showDashboards()">Dashboards</button>`;
  html+=`<button data-obj="__chatter" onclick="showChatter()">Chatter</button>`;
  html+=`<button data-obj="__approvals" onclick="showApprovals()">Approvals${pending?`<span class="badge">${pending}</span>`:""}</button>`;
  html+=`<button data-obj="__forecasts" onclick="showForecasts()">Forecasts</button>`;
  html+=`<button data-obj="__flows" onclick="showFlows()">Flows</button>`;
  html+=`<button data-obj="__dispatch" onclick="showDispatch()">Dispatch</button>`;
  html+=`<button data-obj="__omni" onclick="showOmni()">Omni</button>`;
  html+=`<button data-obj="__myschedule" onclick="showMySchedule()">My Schedule</button>`;
  html+=`<button data-obj="__inventory" onclick="showInventory()">Inventory</button>`;
  html+=`<button data-obj="__calendar" onclick="showCalendar()">Calendar</button>`;
  if(me.profile==="System Administrator") html+=`<button data-obj="__bulk" onclick="showBulk()">Bulk Jobs</button>`;
  if(me.profile==="System Administrator") html+=`<button data-obj="__admin" onclick="showAdmin()">Admin Setup</button>`;
  tabs.innerHTML=html;
  updateTabFade();
  if(objects.length) showObject(objects[0].name);
}
let navSilent=false; // true while routeFromUrl replays history (Back/Forward/deep link): don't rewrite the URL
function setActive(name){ document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.obj===name));
  // tab/list navigation leaves any open record: drop the /r/<obj>/<id> URL so the address bar matches the view
  if(!navSilent&&location.pathname!=="/") window.history.pushState({tab:name},"","");
  refreshPresence(); }

// ------------------------------------------------------- custom applications
function renderAppTabs(pending){
  const tabs=document.getElementById("tabs");
  document.getElementById("appname").textContent=curApp?curApp.label:"";
  if(!curApp){ tabs.innerHTML=""; return; }
  let html="";
  for(const t of curApp.tabs){
    if(t.kind==="object"){
      const o=objects.find(x=>x.name===t.ref); if(!o) continue;

function fmtVal(f,v){ if(v==null||v==="")return"—"; if(f.type==="RichTextArea"){ const t=String(v).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim(); return t?t.slice(0,120):"—"; } if(f.type==="Checkbox")return v?"✓":"—"; if(f.type==="Date"&&String(v).length>10)return String(v).slice(0,10); if(f.type==="Time")return String(v).slice(0,8); if(f.type==="Geolocation"){const p=String(v).split(";");return p.length===2?`${p[0]}, ${p[1]}`:String(v);} if(f.type==="Address"){try{const a=typeof v==="string"?JSON.parse(v):v;const parts=[a.street,a.city,a.state,a.postal_code,a.country].filter(Boolean);return parts.length?parts.join(", "):"—";}catch(e){return String(v);}} if(typeof v==="number")return Math.round(v*100)/100; return v; }
function fmtValHtml(f,v){ if(v==null||v==="")return"—"; if(f.type==="RichTextArea") return `<div class="rtview">${String(v)}</div>`; if(f.type==="Geolocation"){const p=String(v).split(";"); if(p.length===2) return `${esc(p[0])}, ${esc(p[1])} <a href="https://www.google.com/maps?q=${encodeURIComponent(p[0]+","+p[1])}" target="_blank" rel="noopener" title="Open in map">Map</a>`; return esc(String(v));} if(f.type==="Address"){try{const a=typeof v==="string"?JSON.parse(v):v;const parts=[a.street,a.city,a.state,a.postal_code,a.country].filter(Boolean);return parts.length?parts.map(esc).join("<br>"):"—";}catch(e){return esc(String(v));}} return esc(fmtVal(f,v)); }

  history+=`</div>`;
  html+=`<div id="dtab-details">${details}</div><div id="dtab-related" style="display:none">${related}</div><div id="dtab-activity" style="display:none">${activity}</div><div id="dtab-chatter" style="display:none">${chatter}</div><div id="dtab-files" style="display:none">${files}</div><div id="dtab-history" style="display:none">${history}</div>`;

// ------------------------------------------------------- record URLs
// The address bar mirrors the open record (/r/<object>/<id>). The server
// serves the SPA for those paths; this router renders them, handles the
// back/forward buttons, and lands deep links after sign-in.
function parseRecordUrl(){
  const m=location.pathname.match(/^\/r\/([^\/]+)\/([^\/]+)$/);
  return m?{obj:decodeURIComponent(m[1]),id:decodeURIComponent(m[2])}:null;
}
async function routeFromUrl(){
  if(!token) return; // login screen owns the page until authenticated
  const r=parseRecordUrl();
  navSilent=true;
  try{
    if(r){
      try{ await showObject(r.obj); await showDetail(r.id); }
      catch(e){ window.history.replaceState(null,"","/"); if(curObj) await showObject(curObj); }
    }else if(curObj){
      await showObject(curObj); // back to the list we came from
    }
  }finally{ navSilent=false; }
}

/* dynForm: dynamic forms — conditional field visibility.
   Mirrors forcelet/dynamic_forms.py: hide-rules win; a field listed in any
   active "show" rule is hidden unless a "show" rule for it evaluates true. */
let _dfCache={};
async function dynFormRules(obj){
  if(!_dfCache[obj]){ try{ const r=await api("GET","/api/dynamic-forms/"+encodeURIComponent(obj)); _dfCache[obj]=r.ok?(r.data.rules||[]):[]; }catch(e){ _dfCache[obj]=[]; } }
  return _dfCache[obj];
}
function dynFormBlank(v){ return v===null||v===undefined||(typeof v==="string"&&!v.trim())||(Array.isArray(v)&&!v.length); }
function dynFormNum(v){ if(typeof v==="boolean")return null; const n=parseFloat(v); return isNaN(n)?null:n; }
function dynFormBool(v){ if(typeof v==="boolean")return v; if(v===null||v===undefined)return false; return ["true","1","yes","y","on"].includes(String(v).trim().toLowerCase()); }
function dynFormEq(a,b){
  if(typeof a==="boolean"||typeof b==="boolean") return dynFormBool(a)===dynFormBool(b);
  const na=dynFormNum(a),nb=dynFormNum(b);
  if(na!==null&&nb!==null) return na===nb;
  return String(a)===String(b);
}
function dynFormCond(w,vals){
  if(!w) return false;
  const a=(vals||{})[w.field];
  switch(w.operator){
    case "is_blank": return dynFormBlank(a);
    case "is_not_blank": return !dynFormBlank(a);
    case "equals": return dynFormEq(a,w.value);
    case "not_equals": return !dynFormEq(a,w.value);
    case "contains": { const exp=String(w.value??""); return !!exp&&a!==null&&a!==undefined&&String(a).toLowerCase().includes(exp.toLowerCase()); }
    case "greater_than": { const na=dynFormNum(a),nb=dynFormNum(w.value); return na!==null&&nb!==null&&na>nb; }
    case "less_than": { const na=dynFormNum(a),nb=dynFormNum(w.value); return na!==null&&nb!==null&&na<nb; }
    default: return false;
  }
}
function dynFormHidden(obj,vals){
  const rules=(_dfCache[obj]||[]).filter(r=>r.active!==false);
  const hidden=new Set(),shown=new Set(),gated=new Set();
  for(const r of rules){
    const cond=dynFormCond(r.when||{},vals||{});
    const fs=((r.then||{}).fields||[]);
    if((r.then||{}).action==="hide"){ if(cond) fs.forEach(f=>hidden.add(f)); }
    else { fs.forEach(f=>shown.add(f)); if(cond) fs.forEach(f=>gated.add(f)); }
  }
  shown.forEach(f=>{ if(!gated.has(f)) hidden.add(f); });
  return hidden;
}
function dynFormReadValues(){
  const vals={};
  for(const f of (curDesc.fields||[])){
    if(f.type==="Geolocation"||f.type==="Address") continue;
    const el=document.getElementById("f_"+f.name); if(!el) continue;
    if(f.type==="Checkbox") vals[f.name]=el.checked;
    else if(f.type==="MultiPicklist") vals[f.name]=[...el.selectedOptions].map(o=>o.value).join(";");
    else vals[f.name]=el.value;
  }
  return vals;
}
async function dynFormInitForm(){
  await dynFormRules(curObj);
  const apply=()=>{
    const hidden=dynFormHidden(curObj,dynFormReadValues());
    for(const f of (curDesc.fields||[])){
      const w=document.getElementById("ff_"+f.name); if(!w) continue;
      const hide=hidden.has(f.name), isHid=w.classList.contains("df-hidden");
      if(hide&&!isHid) w.classList.add("df-hidden");
      else if(!hide&&isHid){ w.classList.remove("df-hidden"); try{ w.animate([{opacity:0},{opacity:1}],{duration:150}); }catch(e){} }
    }
  };
  const card=document.querySelector("#main .card");
  if(card){ card.addEventListener("input",apply); card.addEventListener("change",apply); }
  apply();
  wireDynamicPicklists(rec);
  wireTaskRecurrence();
}

    else if(f.type==="TextArea") fh+=`<textarea id="f_${f.name}" rows="3">${esc(val)}</textarea>`;
    else if(f.type==="Lookup"){ const opts=await lookupOptions(f.reference_to); fh+=`<select id="f_${f.name}"><option value="">—</option>${opts.map(o=>`<option value="${o.id}" ${o.id===val?"selected":""}>${esc(o.label)}</option>`).join("")}</select>`; }
    else if(f.type==="MasterDetail"){ const opts=await lookupOptions(f.reference_to); fh+=`<select id="f_${f.name}" required><option value="">— select ${esc(f.reference_to)} —</option>${opts.map(o=>`<option value="${o.id}" ${o.id===val?"selected":""}>${esc(o.label)}</option>`).join("")}</select>`; }
    else if(f.type==="Geolocation"){ const p=String(val||"").split(";"); fh+=`<div class="grid2" style="gap:6px"><div><input id="f_${f.name}_lat" placeholder="Latitude" value="${esc(p[0]||"")}" style="margin:0"></div><div><input id="f_${f.name}_lng" placeholder="Longitude" value="${esc(p[1]||"")}" style="margin:0"></div></div>`; }
    else if(f.type==="Address"){ let a={}; try{ a=typeof val==="string"&&val?JSON.parse(val):(val||{}); }catch(e){} fh+=["street","city","state","postal_code","country"].map(k=>`<input id="f_${f.name}_${k}" placeholder="${k.replace("_"," ")}" value="${esc(a[k]||"")}" style="margin-bottom:6px">`).join(""); }

    else if(f.type==="EncryptedText"){ fh+=`<input type="password" id="f_${f.name}" placeholder="${val?esc(val):"Enter new value"}" autocomplete="new-password" title="Encrypted at rest. Leave blank to keep the current value.">`; }
    else if(f.type==="RichTextArea"){ fh+=`<div class="rtbar" role="toolbar" aria-label="Formatting"><button type="button" onclick="rtCmd('bold')" title="Bold"><b>B</b></button><button type="button" onclick="rtCmd('italic')" title="Italic"><i>I</i></button><button type="button" onclick="rtCmd('underline')" title="Underline"><u>U</u></button><button type="button" onclick="rtCmd('insertUnorderedList')" title="Bulleted list">&bull; List</button><button type="button" onclick="rtCmd('insertOrderedList')" title="Numbered list">1. List</button><button type="button" onclick="rtLink()" title="Insert link">Link</button><select onchange="rtBlock(this)" title="Paragraph style" style="max-width:130px"><option value="p">Paragraph</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option><option value="pre">Code</option></select><button type="button" onclick="rtClearFmt()" title="Clear formatting">Clear</button></div><div class="rtedit" id="f_${f.name}_rt" contenteditable="true">${val||""}</div>`; }
    else fh+=`<input id="f_${f.name}" type="${f.type==="Date"?"date":f.type==="Email"?"email":f.type==="URL"?"url":"text"}" value="${esc(val)}">`;
    html+=`<div class="ff" id="ff_${f.name}">${fh}</div>`;
  }
  html+=`<div class="btnrow" style="margin-top:14px"><button class="btn" onclick="saveForm('${id||""}')">Save</button><button class="btn secondary" onclick="showObject('${curObj}')">Cancel</button></div></div>`;
  document.getElementById("main").innerHTML=html;
  dynFormInitForm();
}
async function saveForm(id){
  const body={};
  const rtEl=document.getElementById("f_RecordType"); if(rtEl) body.RecordType=rtEl.value;
  await dynFormRules(curObj); // dynForm: hidden fields must not be submitted
  const dfHidden=dynFormHidden(curObj,dynFormReadValues());
  for(const f of curDesc.fields){
    if(dfHidden.has(f.name)) continue;
    if(f.type==="Geolocation"){ const la=document.getElementById("f_"+f.name+"_lat"), ln=document.getElementById("f_"+f.name+"_lng"); if(la&&ln&&(la.value.trim()||ln.value.trim())) body[f.name]=`${la.value.trim()};${ln.value.trim()}`; continue; }
    if(f.type==="RichTextArea"){ const d=document.getElementById("f_"+f.name+"_rt"); if(d){ const hv=d.innerHTML.replace(/^(<br\s*\/?>|\s)*$/,""); if(hv) body[f.name]=hv; } continue; }
    if(f.type==="Address"){ const parts={}; let any=false; for(const k of ["street","city","state","postal_code","country"]){ const e=document.getElementById(`f_${f.name}_${k}`); if(e&&e.value.trim()){ parts[k]=e.value.trim(); any=true; } } if(any) body[f.name]=JSON.stringify(parts); continue; }
    const el=document.getElementById("f_"+f.name); if(!el) continue;
    if(f.type==="Checkbox") body[f.name]=el.checked;
    else if(f.type==="MultiPicklist") body[f.name]=[...el.selectedOptions].map(o=>o.value).join(";");
    else if(el.value!=="") body[f.name]=el.value;
  }
  const r=await api(id?"PATCH":"POST",`/api/sobjects/${curObj}${id?"/"+id:""}`,body);
  if(r.ok){ showObject(curObj); }
  else {
    let msg=r.data.error||"Save failed";
    if(r.data.details) msg+=": "+r.data.details.join("; ");
    if(r.data.duplicates) msg+=" (duplicates: "+r.data.duplicates.map(d=>d.record_id).join(", ")+")";
    document.getElementById("ferr").innerHTML=`<div class="err">${esc(msg)}</div>`;
  }
}

/* dynForm: dynamic forms — admin rule builder */
let DF_EDIT=null;
async function dfOnObj(){
  const obj=document.getElementById("df_obj").value;
  const d=await api("GET","/api/describe/"+encodeURIComponent(obj));
  const fs=((d.data||{}).fields)||[];
  document.getElementById("df_when_field").innerHTML=fs.map(f=>`<option value="${esc(f.name)}">${esc(f.label||f.name)}</option>`).join("");
  document.getElementById("df_targets").innerHTML=fs.map(f=>`<label style="display:flex;gap:6px;align-items:center;margin:4px 0"><input type="checkbox" class="df_tpick" value="${esc(f.name)}" style="width:auto"> ${esc(f.label||f.name)}</label>`).join("");
  dfRefresh();
}
async function dfRules(){
  const obj=document.getElementById("df_obj").value;
  const r=await api("GET","/api/dynamic-forms/"+encodeURIComponent(obj));
  return (r.ok&&(r.data.rules||[]))||[];
}
async function dfRefresh(){
  const obj=document.getElementById("df_obj").value;
  const rules=await dfRules();
  const el=document.getElementById("df_list");
  if(!rules.length){ el.innerHTML=`<p class="muted">No rules for ${esc(obj)} yet.</p>`; return; }
  el.innerHTML=`<table><tr><th>Name</th><th>When</th><th>Action</th><th>Fields</th><th>Active</th><th></th></tr>`+rules.map(x=>{
    const w=x.when||{}, t=x.then||{};
    return `<tr><td>${esc(x.name||"")}</td><td>${esc(w.field||"")} ${esc(w.operator||"")} ${esc(String(w.value??""))}</td><td>${esc(t.action||"")}</td><td>${esc((t.fields||[]).join(", "))}</td><td>${x.active===false?"No":"Yes"}</td><td><div class="btnrow"><button class="btn small secondary" onclick="dfEdit('${x.id}')">Edit</button><button class="btn small danger" onclick="dfDel('${x.id}')">Delete</button></div></td></tr>`;
  }).join("")+`</table>`;
}
function dfErr(m){ document.getElementById("dferr").innerHTML=m?`<div class="err">${esc(m)}</div>`:""; }
async function dfSave(){
  const obj=document.getElementById("df_obj").value;
  const body={name:document.getElementById("df_name").value.trim(),
    when:{field:document.getElementById("df_when_field").value,operator:document.getElementById("df_op").value,value:document.getElementById("df_value").value},
    then:{action:document.getElementById("df_action").value,fields:[...document.querySelectorAll(".df_tpick:checked")].map(c=>c.value)}};
  if(!body.name){ dfErr("Rule name is required."); return; }
  if(!body.then.fields.length){ dfErr("Pick at least one target field."); return; }
  const r=await api(DF_EDIT?"PUT":"POST",DF_EDIT?`/api/dynamic-forms/${encodeURIComponent(obj)}/rules/${DF_EDIT}`:`/api/dynamic-forms/${encodeURIComponent(obj)}/rules`,body);
  if(r.ok){ _dfCache[obj]=null; dfCancel(); dfRefresh(); }
  else dfErr((r.data&&r.data.error||"Save failed")+(r.data&&r.data.details?": "+r.data.details.join("; "):""));
}
async function dfEdit(id){
  const rules=await dfRules();
  const x=rules.find(r=>r.id===id); if(!x) return;
  DF_EDIT=id;
  document.getElementById("df_name").value=x.name||"";
  document.getElementById("df_when_field").value=(x.when||{}).field||"";
  document.getElementById("df_op").value=(x.when||{}).operator||"equals";
  document.getElementById("df_value").value=(x.when||{}).value??"";
  document.getElementById("df_action").value=(x.then||{}).action||"hide";
  document.querySelectorAll(".df_tpick").forEach(c=>{ c.checked=((x.then||{}).fields||[]).includes(c.value); });
  document.getElementById("df_submit").textContent="Save rule";
  document.getElementById("df_cancel").style.display="";
  dfErr("");
}
async function dfDel(id){
  if(!confirm("Delete this visibility rule?")) return;
  const obj=document.getElementById("df_obj").value;
  const r=await api("DELETE",`/api/dynamic-forms/${encodeURIComponent(obj)}/rules/${id}`);
  if(r.ok){ _dfCache[obj]=null; if(DF_EDIT===id) dfCancel(); dfRefresh(); }
  else dfErr((r.data&&r.data.error)||"Delete failed");
}
function dfCancel(){
  DF_EDIT=null;
  document.getElementById("df_name").value="";
  document.getElementById("df_value").value="";
  document.querySelectorAll(".df_tpick").forEach(c=>{ c.checked=false; });
  document.getElementById("df_submit").textContent="Create rule";
  document.getElementById("df_cancel").style.display="none";
  dfErr("");
}
function dfInit(){ if(document.getElementById("df_obj")) dfOnObj(); }

function repParseBuckets(){
  const field=document.getElementById("nr_bucket_field").value.trim();
  const lines=document.getElementById("nr_buckets").value.split("\n").map(s2=>s2.trim()).filter(Boolean);
  if(!field||!lines.length) return null;
  const buckets=[];
  for(const ln of lines){
    const m=ln.match(/^([^:]+):\s*(-?[\d.]*)\s*-\s*(-?[\d.]*)\s*$/);
    if(!m) throw new Error(`Bad bucket line: ${ln}`);
    buckets.push({name:m[1].trim(), from:m[2]===""?null:parseFloat(m[2]), to:m[3]===""?null:parseFloat(m[3])});
  }
  return {field, buckets};
}
function repCollect(){
  const nestedTgl=document.getElementById("cb_rp_nested");
  const builtFilter=nestedTgl&&nestedTgl.checked?cbBuildNested("cb_rp"):cbBuildExpr("cb_rp");
  const body={name:document.getElementById("nr_name").value.trim(), object:document.getElementById("nr_obj").value,
    columns:document.getElementById("nr_cols").value.split(",").map(s2=>s2.trim()).filter(Boolean),
    filters:Object.keys(builtFilter).length?builtFilter:((REP_ORIG&&REP_ORIG.filters)||{}), active:true,
    sort:RP.sorts.filter(s2=>s2.field).map(s2=>({field:s2.field,dir:s2.dir||"asc"})),
    group_by:["nr_g1","nr_g2","nr_g3"].map(id=>document.getElementById(id).value).filter(Boolean),
    group_sort:document.getElementById("nr_gsort").value,
    aggregates:RP.aggs.filter(a=>a.func).map(a=>({func:a.func,field:(a.field||"").trim()})),
    cross_filters:RP.cross.filter(c=>c.object&&c.via).map(c=>({mode:c.mode,object:c.object,via:c.via})),
    summary_formulas:[], highlight:RP.hl.filter(h=>h.field),
    chart:{}, folder_id:document.getElementById("nr_folder").value||null,
    run_as_user:document.getElementById("nr_runas").value||null};
  for(const f of RP.formulas){ if(!f.name) continue; let parsed; try{ parsed=typeof f.formula==="string"?JSON.parse(f.formula):f.formula; }catch(e){ throw new Error(`Bad formula JSON for ${f.name}`); } body.summary_formulas.push({name:f.name,label:f.label||f.name,formula:parsed}); }
  const ct=document.getElementById("nr_chart").value; if(ct) body.chart={type:ct};
  const bk=repParseBuckets(); if(bk) body.bucket=bk;
  const cg=["nr_cg1","nr_cg2"].map(id=>document.getElementById(id).value).filter(Boolean);
  if(cg.length) body.column_group_by=cg;
  const dp={};
  [["nr_g1","nr_p1"],["nr_g2","nr_p2"],["nr_g3","nr_p3"]].forEach(([g,p])=>{
    const f=document.getElementById(g).value, part=document.getElementById(p).value;
    if(f&&part&&part!=="exact") dp[f]=part;
  });
  if(Object.keys(dp).length) body.date_parts=dp;
  const fm=parseInt((document.getElementById("nr_fiscal_month")||{}).value||"",10);
  if(fm>=1&&fm<=12) body.fiscal_start_month=fm;
  const rf=[];
  for(const f of RP.rowformulas){ if(!f.name) continue; let parsed; try{ parsed=typeof f.formula==="string"?JSON.parse(f.formula):f.formula; }catch(e){ parsed=f.formula; } rf.push({name:f.name,label:f.label||f.name,formula:parsed}); }
  if(rf.length) body.row_formulas=rf;
  const bl=RP.blocks.filter(b=>b.object).slice(0,5).map(b=>({name:b.name||b.object,object:b.object,columns:(b.columns||"").split(",").map(s=>s.trim()).filter(Boolean),group_by:(b.group_by||"").trim()||null}));
  if(bl.length) body.blocks=bl;
  const rt=document.getElementById("nr_rtype").value; if(rt) body.report_type_id=rt;
  if(!body.name) throw new Error("Name is required.");
  return body;
}

function repHlStyle(rep,field,val){
  for(const h of (rep&&rep.highlight)||[]){
    if(h.field!==field||val==null||val==="") continue;
    const op=h.op||"==", tv=h.value; let hit=false;
    const n=parseFloat(val), tn=parseFloat(tv);
    const num=!isNaN(n)&&!isNaN(tn);
    if(op==="==") hit=String(val)===String(tv);
    else if(op==="!=") hit=String(val)!==String(tv);
    else if(num){ if(op===">")hit=n>tn; else if(op==="<")hit=n<tn; else if(op===">=")hit=n>=tn; else if(op==="<=")hit=n<=tn; }
    else { if(op===">")hit=String(val)>String(tv); else if(op==="<")hit=String(val)<String(tv); }
    if(hit) return `background:${h.color||"#fef3c7"};`;
  }
  return "";
}
function repTreeHtml(nodes,rep,repId,level,groupField){
  let html="";
  for(const n of nodes){
    const aggs=Object.entries(n.aggregates||{}).filter(([k])=>k!=="count").map(([k,v])=>`${esc(k)}: ${v==null?"—":esc(Math.round(v*100)/100)}`).join(" · ");
    const fms=(n.formulas||[]).filter(f=>f.value!=null).map(f=>`${esc(f.label)}: ${esc(Math.round(f.value*100)/100)}`).join(" · ");
    html+=`<div class="bar-row" style="margin-left:${level*18}px"><span><b>${esc(String(n.key))}</b> (${n.count})${aggs?" · "+aggs:""}${fms?" · "+fms:""}</span></div>`;
    if(n.children) html+=repTreeHtml(n.children,rep,repId,level+1,groupField);
  }
  return html;
}
async function runReport(id,page,opts){
  opts=opts||{};
  const el=document.getElementById("rep_"+id);
  el.innerHTML=`<p class="muted">Running…</p>`;
  let qs=`page=${page||1}&page_size=200`;
  if(opts.drill) qs+=`&drill_field=${encodeURIComponent(opts.drill.field)}&drill_value=${encodeURIComponent(opts.drill.value)}`;
  const r=await api("GET",`/api/reports/${id}/run?${qs}`);
  if(!r.ok){ el.innerHTML=`<div class="err">Failed.</div>`; return; }
  const d=r.data;
  const rep=(await api("GET","/api/reports")).data.find(x=>x.id===id)||{};
  const drillNote=opts.drill?` <span class="pill">filtered: ${esc(opts.drill.field)} = ${esc(opts.drill.value)}</span> <button class="btn secondary small" onclick="runReport('${id}',1)">Clear</button>`:"";
  let html=`<div class="btnrow"><span class="muted">${d.row_count} row(s)</span>${drillNote}<span style="flex:1"></span>`
    +`<button class="btn secondary small" onclick="window.open('/api/reports/${id}/export?format=csv&token='+token,'_blank')">CSV</button> `
    +`<button class="btn secondary small" onclick="window.open('/api/reports/${id}/export?format=xlsx&token='+token,'_blank')">Excel</button> `
    +`<button class="btn secondary small" onclick="repPrint('${id}')">Print</button></div>`;
  const groups=d.groups||[];
  const gbLevel=(Array.isArray(rep.group_by)?rep.group_by:[rep.group_by]).filter(Boolean)[0];
  if(d.chart&&d.chart.type&&groups.length){
    const ct=d.chart.type;
    html+=ct==="donut"?svgDonut(groups,id,gbLevel):ct==="line"?svgLine(groups):svgBars(groups,id,gbLevel);
  } else if(d.group_tree&&(d.group_tree.length>1||(d.group_tree[0]&&d.group_tree[0].children))){
    html+=repTreeHtml(d.group_tree,rep,id,0,gbLevel);
  } else if(groups.length){
    const max=Math.max(...groups.map(g=>g.count));
    html+=groups.map(g=>`<div class="bar-row"><span>${esc(String(g.key))}</span><div class="bar" style="width:${Math.round(g.count/max*100)}%"></div><span>${g.count}${g.aggregate!=null?" · Σ "+Math.round(g.aggregate*100)/100:""}</span></div>`).join("");
  }
  if(d.grand_total&&(Object.keys(d.grand_total.aggregates||{}).length>1||(d.grand_total.formulas||[]).length)){
    const ga=Object.entries(d.grand_total.aggregates).filter(([k])=>k!=="count").map(([k,v])=>`${esc(k)}: ${v==null?"—":esc(Math.round(v*100)/100)}`).join(" · ");
    const gf=(d.grand_total.formulas||[]).filter(f=>f.value!=null).map(f=>`${esc(f.label)}: ${esc(Math.round(f.value*100)/100)}`).join(" · ");
    html+=`<div class="bar-row" style="border-top:2px solid var(--line)"><span><b>Total</b> (${d.grand_total.count})${ga?" · "+ga:""}${gf?" · "+gf:""}</span></div>`;
  }
  const cols=d.columns.length?d.columns:Object.keys(d.rows[0]||{}).slice(0,8);
  if(d.rows.length) html+=`<div style="overflow-x:auto"><table style="margin-top:10px"><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${d.rows.map(row=>`<tr>${cols.map(c=>`<td style="${repHlStyle(rep,c,row[c])}">${esc(row[c]??"—")}</td>`).join("")}</tr>`).join("")}</table></div>`;
  if(d.pages>1){
    html+=`<div class="btnrow" style="margin-top:8px"><button class="btn secondary small" ${d.page<=1?"disabled":""} onclick="runReport('${id}',${d.page-1})">‹ Prev</button><span class="muted">Page ${d.page} of ${d.pages}</span><button class="btn secondary small" ${d.page>=d.pages?"disabled":""} onclick="runReport('${id}',${d.page+1})">Next ›</button></div>`;
  }
  el.innerHTML=html;
}
function repPrint(id){
  const el=document.getElementById("rep_"+id); if(!el) return;
  const clone=el.cloneNode(true);
  clone.querySelectorAll(".btnrow").forEach(b=>b.remove());
  const w=window.open("","_blank");
  w.document.write(`<html><head><title>Report</title><style>table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:4px 6px;font-size:12px;text-align:left}body{font-family:sans-serif;color:#111}.bar-row{margin:2px 0}</style></head><body>${clone.innerHTML}</body></html>`);
  w.document.close(); w.focus(); w.print();
}




// ------------------------------------------------------- dashboards
let dashType={};
function svgBars(groups,repId,groupField){
  const max=Math.max(1,...groups.map(g=>g.count));
  const W=340,H=180,pad=30,n=Math.min(groups.length,12);
  const bw=Math.min(44,(W-pad*2)/n-10);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">`;
  groups.slice(0,12).forEach((g,i)=>{
    const h=Math.max(4,(H-64)*g.count/max);
    const x=pad+i*((W-pad*2)/n), y=H-32-h;
    const dk=repId&&groupField?` onclick="drillReport('${repId}','${esc(groupField)}',this.dataset.k)" data-k="${esc(String(g.key))}" style="cursor:pointer"`:"";
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3" fill="#0176d3"${dk}><title>${esc(g.key)}: ${g.count}</title></rect>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-16}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".65">${esc(String(g.key)).slice(0,12)}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".65">${g.count}</text>`;
  });
  return s+"</svg>";
}
function svgDonut(groups,repId,groupField){
  const tot=groups.reduce((a,g)=>a+g.count,0)||1;
  const cols=["#0176d3","#2e9e4f","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899","#84cc16"];
  let s=`<svg viewBox="0 0 200 200" style="width:190px;height:auto;display:block;margin:0 auto" role="img">`;
  let ang=-90;const R=78,CX=100,CY=100;
  groups.slice(0,8).forEach((g,i)=>{
    const frac=g.count/tot,a2=ang+frac*360,big=frac>0.5?1:0;
    const x1=CX+R*Math.cos(ang*Math.PI/180),y1=CY+R*Math.sin(ang*Math.PI/180);
    const x2=CX+R*Math.cos(a2*Math.PI/180),y2=CY+R*Math.sin(a2*Math.PI/180);
    const dk=repId&&groupField?` onclick="drillReport('${repId}','${esc(groupField)}',this.dataset.k)" data-k="${esc(String(g.key))}" style="cursor:pointer"`:"";
    s+=`<path d="M${CX},${CY} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${big} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${cols[i%cols.length]}" opacity=".92"${dk}><title>${esc(g.key)}: ${g.count}</title></path>`;
    ang=a2;
  });
  s+=`<circle cx="${CX}" cy="${CY}" r="44" fill="var(--surface)"/><text x="${CX}" y="${CY+7}" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">${tot}</text></svg>`;
  s+=`<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px">`+groups.slice(0,8).map((g,i)=>`<span class="muted" style="font-size:12px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cols[i%cols.length]}"></span> ${esc(String(g.key)).slice(0,14)} (${g.count})</span>`).join("")+`</div>`;
  return s;
}
function svgLine(groups){
  const W=340,H=180,pad=34,n=Math.min(groups.length,12);
  const max=Math.max(1,...groups.slice(0,12).map(g=>g.count));
  const px=i=>pad+i*((W-pad*2)/Math.max(1,n-1)), py=v=>H-32-(H-64)*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">`;
  const pts=groups.slice(0,12).map((g,i)=>`${px(i).toFixed(1)},${py(g.count).toFixed(1)}`).join(" ");
  s+=`<polyline points="${pts}" fill="none" stroke="#0176d3" stroke-width="2.5"/>`;
  groups.slice(0,12).forEach((g,i)=>{
    s+=`<circle cx="${px(i).toFixed(1)}" cy="${py(g.count).toFixed(1)}" r="4" fill="#0176d3"><title>${esc(g.key)}: ${g.count}</title></circle>`;
    s+=`<text x="${px(i).toFixed(1)}" y="${H-14}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".65">${esc(String(g.key)).slice(0,10)}</text>`;
  });
  return s+"</svg>";
}
function svgGauge(value,max){
  const v=Math.max(0,Math.min(1,(value||0)/Math.max(1,max||100)));
  const W=220,H=130,CX=110,CY=108,R=84,a0=Math.PI,a1=Math.PI*(1-v);
  const x0=CX+R*Math.cos(a0),y0=CY+R*Math.sin(a0),x1=CX+R*Math.cos(a1),y1=CY+R*Math.sin(a1);
  const col=v>=0.75?"#2e9e4f":v>=0.4?"#f59e0b":"#ef4444";
  return `<svg viewBox="0 0 ${W} ${H}" style="width:220px;height:auto;display:block;margin:0 auto" role="img">`
   +`<path d="M${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 0 1 ${CX+R},${CY}" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/>`
   +`<path d="M${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round"/>`
   +`<text x="${CX}" y="${CY-6}" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">${Math.round(v*100)}%</text></svg>`;
}
function svgFunnel(groups){
  const W=340,H=200,cols=["#0176d3","#2e9e4f","#f59e0b","#ef4444","#8b5cf6"];
  const gs=groups.slice(0,6), max=Math.max(1,...gs.map(g=>g.count));
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">`;
  gs.forEach((g,i)=>{
    const w=Math.max(30,(W-40)*g.count/max), x=(W-w)/2, y=8+i*((H-16)/gs.length), h=(H-16)/gs.length-6;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${cols[i%cols.length]}" opacity=".9"><title>${esc(g.key)}: ${g.count}</title></rect>`;
    s+=`<text x="${W/2}" y="${(y+h/2+4).toFixed(1)}" font-size="11" text-anchor="middle" fill="#fff">${esc(String(g.key)).slice(0,16)} (${g.count})</text>`;
  });
  return s+"</svg>";
}
function svgScatter(rows,xf,yf){
  const W=340,H=200,pad=36;
  const pts=rows.map(r=>[r[xf],r[yf]]).filter(p=>typeof p[0]==="number"&&typeof p[1]==="number").slice(0,200);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">`;
  if(!pts.length) return s+`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="currentColor" opacity=".5">No numeric data</text></svg>`;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs)||1,y0=Math.min(...ys),y1=Math.max(...ys)||1;
  const px=v=>pad+(W-pad*2)*(v-x0)/Math.max(1e-9,x1-x0), py=v=>H-pad-(H-pad*2)*(v-y0)/Math.max(1e-9,y1-y0);
  s+=`<line x1="${pad}" y1="${H-pad}" x2="${W-8}" y2="${H-pad}" stroke="var(--line)"/><line x1="${pad}" y1="8" x2="${pad}" y2="${H-pad}" stroke="var(--line)"/>`;
  pts.forEach(p=>{ s+=`<circle cx="${px(p[0]).toFixed(1)}" cy="${py(p[1]).toFixed(1)}" r="3.5" fill="#0176d3" opacity=".7"><title>${p[0]}, ${p[1]}</title></circle>`; });
  s+=`<text x="${W/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".6">${esc(xf||"")}</text>`;
  return s+"</svg>";
}

async function showForecasts(){
  setActive("__forecasts");
  if(!fcPeriod){ const d=new Date(); fcPeriod=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }

  if(!r.ok){ document.getElementById("main").innerHTML=`<div class="err">${esc(r.data.error||"Failed to load forecasts")}</div>`; return; }
  const rows=r.data.rows||[];
  const maxF=Math.max(1,...rows.map(x=>x.forecast||0));
  const typeName=(r.data.forecast_type||{}).name||"Forecast";
  const lostStages=((r.data.forecast_type||{}).lost_values||[]).join(", ");
  let html=`<div class="btnrow"><h2 style="margin:0">Forecasts</h2><span style="flex:1"></span><label style="margin:0">Type</label><select id="fc_type" style="width:auto" onchange="fcType=this.value;showForecasts()">${types.map(t=>`<option value="${t.id}" ${t.id===fcType?"selected":""}>${esc(t.name)} (${esc(t.object)})</option>`).join("")}</select><label style="margin:0">Period</label><input id="fc_per" type="month" value="${fcPeriod}" style="width:auto"><button class="btn secondary small" onclick="fcPeriod=v('fc_per');showForecasts()">Go</button></div>`;
  html+=`<p class="muted" style="margin:0 0 8px">${esc(typeName)}${types.length>1?` · <a href="#" onclick="showSetup('forecast-types');return false">manage forecast types</a>`:""}</p>`;
  html+=`<div class="card"><table><tr><th>Salesperson</th><th>Quota</th><th>Closed</th><th>Weighted pipeline</th><th>Forecast</th><th>Attainment</th></tr>`;
  html+=rows.map(x=>{
    const att=x.attainment==null?"—":`${Number(x.attainment).toFixed(1)}%`;
    const color=x.attainment==null?"#999":x.attainment>=100?"#2e7d32":x.attainment>=70?"#d98a1f":"#c0392b";
    return `<tr><td>${esc(x.user_name)}</td><td>${x.quota==null?"—":"$"+Number(x.quota).toLocaleString()}</td><td>$${Number(x.closed_amount).toLocaleString()}</td><td>$${Number(x.weighted_pipeline).toLocaleString()}</td><td><b>$${Number(x.forecast).toLocaleString()}</b><div class="bar" style="width:${Math.round(100*x.forecast/maxF)}%"></div></td><td style="color:${color};font-weight:600">${att}</td></tr>`;
  }).join("")||`<tr><td colspan="6" class="muted">No forecast data for this period.</td></tr>`;
  html+=`</table><p class="muted">Closed Won counts at full amount; open stages count at Amount × Probability. Lost deals are excluded per the forecast type's lost-stage settings${lostStages?` (${esc(lostStages)})`:""}.</p></div>`;
  if(me.profile==="System Administrator"){
    const users=(await api("GET","/api/admin/users")).data||[];
    const quotas=(await api("GET",`/api/admin/forecast-quotas?type=${fcType}`)).data||[];
    html+=`<div class="card"><div class="section-title">Quotas</div><div id="qerr"></div>`
      +`<div class="grid2"><div><label>User</label><select id="q_user">${users.map(u=>`<option value="${u.id}">${esc(u.username)} — ${esc(u.name)}</option>`).join("")}</select></div>`
      +`<div><label>Period</label><input id="q_per" type="month" value="${fcPeriod}"><label>Quota ($)</label><input id="q_amt" type="number" min="0" step="1000"></div></div>`
      +`<div class="btnrow" style="margin-top:12px"><button class="btn" onclick="saveQuota()">Save quota</button></div>`
      +(quotas.length?`<table style="margin-top:10px"><tr><th>User</th><th>Period</th><th>Quota</th><th></th></tr>${quotas.map(q=>{const u=users.find(x=>x.id===q.user_id);return `<tr><td>${esc(u?u.username:q.user_id)}</td><td>${esc(q.period)}</td><td>$${Number(q.quota).toLocaleString()}</td><td><button class="btn danger small" onclick="delQuota('${q.id}')">Delete</button></td></tr>`;}).join("")}</table>`:`<p class="muted">No quotas set yet.</p>`)+`</div>`;
  }

function flowFieldHtml(f){
  const req=f.required?` <span style="color:#c0392b">*</span>`:"";
  const id=`flw_${f.name}`;
  let input="";
  if(f.type==="textarea") input=`<textarea id="${id}" rows="3"></textarea>`;
  else if(f.type==="picklist") input=`<select id="${id}"><option value="">— select —</option>${(f.picklist_values||[]).map(p=>`<option>${esc(p)}</option>`).join("")}</select>`;
  else if(f.type==="checkbox") input=`<input id="${id}" type="checkbox" style="width:auto">`;
  else if(f.type==="number") input=`<input id="${id}" type="number">`;
  else if(f.type==="date") input=`<input id="${id}" type="date">`;
  else if(f.type==="email") input=`<input id="${id}" type="email">`;
  else input=`<input id="${id}" type="text">`;
  return `<label>${esc(f.label||f.name)}${req}</label>${input}`;
}
function renderFlowScreen(runId, screen, total, step){
  const el=document.getElementById("flowrun");
  if(!screen){ el.innerHTML=""; return; }
  el.innerHTML=`<div class="card"><div class="section-title">${esc(screen.title)} <span class="muted">(step ${step} of ${total})</span></div><div id="flwerr"></div>`
    +screen.fields.map(flowFieldHtml).join("")
    +`<div class="btnrow" style="margin-top:12px"><button class="btn secondary" onclick="showFlows()">Cancel</button><button class="btn" onclick="flowNext('${runId}',${step},${total})">${step>=total?"Finish":"Next"}</button></div></div>`;
  window.scrollTo(0,0);
}
async function flowNext(runId, step, total){
  const r0=await api("GET",`/api/screen-flows/runs/${runId}`);
  const screen=(r0.data||{}).screen;
  const values={};
  (screen.fields||[]).forEach(f=>{
    const el=document.getElementById(`flw_${f.name}`);
    values[f.name]=f.type==="checkbox"?el.checked:el.value;
  });
  const r=await api("POST",`/api/screen-flows/runs/${runId}/next`,{values});
  if(!r.ok){
    const errs=(r.data.errors||[r.data.error||"Validation failed"]);
    document.getElementById("flwerr").innerHTML=`<div class="err">${errs.map(esc).join("<br>")}</div>`;
    return;
  }
  if(r.data.status==="completed"){
    const made=(r.data.result.created||[]).map(c=>`${esc(c.object)} <a href="#" onclick="jumpTo('${c.object}','${c.id}');return false">${esc(c.id.slice(0,8))}…</a>`).join(", ");
    document.getElementById("flowrun").innerHTML=`<div class="ok">Done!${made?` Created: ${made}.`:""}</div>`;
  } else {
    renderFlowScreen(runId, r.data.screen, total, step+1);
  }
}
